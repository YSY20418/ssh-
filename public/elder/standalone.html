<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<!-- 单文件版：样式与脚本已内联，可单独上传或传到手机直接打开 -->
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D62">
<meta name="description" content="小鱼兒 · 面向高龄老人的预约挂号服务，全程只需点选，可语音朗读、可对它说话让它代办，可调大字体。">
<title>小鱼兒 · 预约挂号</title>
<style>
/* ============================================================
   小鱼兒 · 预约挂号（适老版）
   配色：背景暖米白 #F2F0EA / 卡片纯白 / 主色深青绿 #2F5D62 /
        提示区淡米黄 #FAF3E4。不使用高饱和纯黄纯红。
   字号：正文 19.5px 起、标题 29px 起，可整体放大缩小。
   自适应：电脑优先 —— ≥1024px 左流程 + 右常驻摘要双栏；
           窄屏自动收成单列，等比缩放兜底。
   ============================================================ */

:root {
  --bg: #f2f0ea;
  --card: #ffffff;
  --brand: #2f5d62;
  --brand-dark: #22474b;
  --brand-soft: #e3edec;
  --notice: #faf3e4;
  --notice-line: #e6dcc0;
  --ink: #1f2b33;          /* 正文主色，与白底对比度 > 12:1 */
  --ink-2: #43535c;        /* 次要文字，加深以提升可读性 */
  --muted: #5e5c54;        /* 辅助说明，加深后仍保持柔和 */
  --line: #d5d0c5;
  --off-bg: #e9e5dc;       /* 约满 / 不可用 */
  --off-ink: #7a766c;
  --ok: #3f6b52;
  --ok-soft: #e8f1ea;
  --warn-ink: #7d5426;
  --radius: 16px;
  --radius-sm: 12px;
  --radius-lg: 22px;
  --tap: 64px;             /* 按钮最小高度 */
  --fs: 1;                 /* 字体缩放系数，由按钮控制 */
  --shell: 1160px;         /* 宽屏内容总宽 */
  --shadow: 0 2px 8px rgba(31, 43, 51, 0.07);
  --shadow-lift: 0 10px 28px rgba(31, 43, 51, 0.13);
}

* { box-sizing: border-box; }

html {
  font-size: calc(17px * var(--fs));
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC",
               "Noto Sans CJK SC", "Heiti SC", system-ui, sans-serif;
  font-size: 1.15rem;         /* ≈19.5px */
  line-height: 1.75;
  padding-bottom: 8.5rem;     /* 让底部固定栏不遮内容 */
}

/* 医院氛围背景：纯内联 SVG 绘制的抽象图形（楼宇轮廓 + 十字 + 心电线），
   不含任何文字与真实医院标识，透明度极低，不影响正文对比度 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.06;
  background-repeat: no-repeat;
  background-position: center bottom;
  background-size: 1200px auto;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='760' viewBox='0 0 1200 760'><g fill='%232f5d62'><path opacity='.55' d='M0 640 L0 470 L92 470 L92 402 L198 402 L198 470 L300 470 L300 522 L418 522 L418 430 L520 430 L520 522 L642 522 L642 452 L760 452 L760 522 L880 522 L880 480 L1000 480 L1000 542 L1200 542 L1200 640 Z'/><path opacity='.32' d='M150 128 h58 v-58 h48 v58 h58 v48 h-58 v58 h-48 v-58 h-58 z'/><path opacity='.26' d='M905 206 h42 v-42 h34 v42 h42 v34 h-42 v42 h-34 v-42 h-42 z'/><path opacity='.22' fill='none' stroke='%232f5d62' stroke-width='7' d='M0 706 h250 l28-72 l38 142 l44-192 l38 118 l30-4 h296 l30-58 l34 88 l38-28 h312'/></g></svg>");
}

/* 背景之上的所有内容需要抬升一层 */
.topbar, .stepbar, .wrap, .actionbar, .idlebar, .modal, .aifab, .ai { position: relative; z-index: 1; }
.topbar { z-index: 30; }
.stepbar { z-index: 29; }
.actionbar { z-index: 40; }
.idlebar { z-index: 41; }
.modal { z-index: 50; }

/* ---------- 通用排版 ---------- */
.title {
  font-size: 1.75rem;         /* ≈29px */
  line-height: 1.4;
  font-weight: 700;
  margin: 0.2rem 0 0.5rem;
  letter-spacing: 0.01em;
}
.title--success { color: var(--ok); }

.subtitle {
  font-size: 1.3rem;          /* ≈22px */
  font-weight: 700;
  margin: 1.6rem 0 0.7rem;
  color: var(--ink);
}

.lead {
  font-size: 1.2rem;          /* ≈20px */
  color: var(--ink-2);
  margin: 0 0 1.2rem;
}

.hint {
  font-size: 1.05rem;
  color: var(--muted);
  margin: 0.8rem 0 0;
}

/* 电脑优先：宽屏给主内容包一张「纸」，让层次更清楚 */
.wrap {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 1.2rem 1.1rem 2rem;
}
.shell { display: grid; gap: 1.1rem; grid-template-columns: 1fr; }

.skip-link {
  position: absolute;
  left: -9999px;
  background: #fff;
  color: var(--brand);
  padding: 0.6rem 1rem;
  border-radius: var(--radius-sm);
  z-index: 60;
}
.skip-link:focus { left: 1rem; top: 1rem; outline: 3px solid var(--brand); }

.sr-live {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- 顶部 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
/* 顶部一条主色渐变，增加层次与「医疗机构」的观感 */
.topbar::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--brand-dark), var(--brand) 45%, #528f93);
}
.topbar__inner {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0.8rem 1.1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 0.7rem; }
.brand__mark {
  width: 3rem; height: 3rem;
  display: grid; place-items: center;
  background: var(--brand);
  color: #fff;
  border-radius: var(--radius-sm);
  font-size: 1.6rem;
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(47, 93, 98, 0.28);
}
.brand__text { display: flex; flex-direction: column; line-height: 1.2; }
.brand__name { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.04em; }
.brand__sub { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.25em; }

/* 虚构院名（不指向任何现实医院） */
.brand__sep {
  width: 1px;
  align-self: stretch;
  min-height: 2.4rem;
  background: var(--line);
  margin: 0 0.2rem;
}
.brand__text--hospital { border-left: 0; }
.brand__hospital {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: 0.02em;
}
.brand__hospital-sub {
  font-size: 0.85rem;
  color: var(--muted);
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.topbar__tools { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.toolgroup {
  display: flex;
  gap: 0.35rem;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 0.25rem;
}
.toolbtn {
  min-height: 2.9rem;
  min-width: 3.2rem;
  padding: 0 0.75rem;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink-2);
  font-size: 1.05rem;
  font-family: inherit;
  cursor: pointer;
}
.toolbtn[aria-pressed="true"] {
  background: var(--brand);
  color: #fff;
  font-weight: 700;
}

/* ---------- 步骤条（跟着顶栏吸顶，走过的步骤可以点回去改） ---------- */
.stepbar {
  background: var(--bg);
  position: sticky;
  top: var(--topbar-h, 6.2rem);
  z-index: 29;
  border-bottom: 1px solid var(--line);
}
.stepbar__list {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0.7rem 1.1rem;
  list-style: none;
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
}
.stepbar__item {
  flex: 1 0 auto;
  display: flex;
  align-items: center;
  border-radius: 999px;
  background: #fff;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 1rem;
  white-space: nowrap;
  overflow: hidden;
}
.stepbar__btn {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  width: 100%;
  min-height: 2.6rem;
  padding: 0.3rem 0.7rem;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: inherit;
  font-family: inherit;
  font-size: 1rem;
  white-space: nowrap;
  cursor: pointer;
}
.stepbar__btn:disabled { cursor: default; }
.stepbar__btn:not(:disabled):hover { background: var(--brand-soft); }
.stepbar__btn:focus-visible { outline: 3px solid var(--brand); outline-offset: -2px; }
.stepbar__no {
  width: 1.6rem; height: 1.6rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--off-bg);
  color: var(--off-ink);
  font-size: 0.95rem;
  font-weight: 700;
}
.stepbar__item[data-state="active"] {
  border-color: var(--brand);
  border-width: 2px;
  background: var(--brand-soft);
  color: var(--brand);
  font-weight: 700;
}
.stepbar__item[data-state="active"] .stepbar__no { background: var(--brand); color: #fff; }
.stepbar__item[data-state="done"] { color: var(--ok); border-color: var(--ok-soft); }
.stepbar__item[data-state="done"] .stepbar__no { background: var(--ok); color: #fff; }

/* ---------- 卡片 / 网格 ---------- */
.grid { display: grid; gap: 0.9rem; grid-template-columns: 1fr; }

.bigcard {
  display: flex;
  align-items: center;
  gap: 1rem;
  width: 100%;
  min-height: var(--tap);
  padding: 1.15rem 1.2rem;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: inherit;
  font-size: 1.25rem;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
}
.bigcard:hover { box-shadow: var(--shadow-lift); }
.bigcard:active { transform: scale(0.985); }
.bigcard:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }

/* 选中态：主色底 + 深描边 + 投影，老人一眼能看出选了哪个 */
.bigcard[aria-pressed="true"] {
  background: var(--brand);
  border-color: var(--brand-dark);
  color: #fff;
  box-shadow: 0 6px 18px rgba(47, 93, 98, 0.28);
}
.bigcard[aria-pressed="true"] .bigcard__desc,
.bigcard[aria-pressed="true"] .bigcard__meta { color: #eaf3f2; }

.bigcard__icon {
  flex: 0 0 auto;
  width: 3.4rem; height: 3.4rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--brand-soft);
  color: var(--brand);
  font-size: 1.5rem;
  font-weight: 700;
}
.bigcard[aria-pressed="true"] .bigcard__icon { background: #fff; color: var(--brand); }

.bigcard__main { display: flex; flex-direction: column; gap: 0.15rem; flex: 1 1 auto; }
.bigcard__title { font-size: 1.3rem; font-weight: 700; line-height: 1.4; }
.bigcard__desc { font-size: 1.05rem; color: var(--ink-2); line-height: 1.55; }
.bigcard__meta { font-size: 1rem; color: var(--muted); }
.bigcard__check {
  flex: 0 0 auto;
  font-size: 1.6rem;
  font-weight: 700;
  color: transparent;
}
.bigcard[aria-pressed="true"] .bigcard__check { color: #fff; }

.bigcard--start {
  border-color: var(--brand);
  background: var(--brand-soft);
  font-size: 1.4rem;
  min-height: 6rem;
}
.bigcard--start .bigcard__icon { background: var(--brand); color: #fff; }

/* 不可用（约满） */
.bigcard--off {
  background: var(--off-bg);
  border-color: var(--off-bg);
  color: var(--off-ink);
  cursor: not-allowed;
  box-shadow: none;
}
.bigcard--off .bigcard__icon { background: #d8d3c8; color: var(--off-ink); }
.bigcard--off .bigcard__desc { color: var(--off-ink); }
.bigcard--off:active { transform: none; }

/* 医生头像（用姓氏首字生成，不依赖图片，离线可用） */
.avatar {
  flex: 0 0 auto;
  width: 4.2rem; height: 4.2rem;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 1.7rem;
  font-weight: 700;
  color: #fff;
  background: var(--brand);
}
.bigcard[aria-pressed="true"] .avatar { box-shadow: 0 0 0 3px #fff; }

/* ---------- 语音条 ---------- */
.voicebar {
  display: flex;
  gap: 0.7rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.btn--voice {
  flex: 1 1 auto;
  background: var(--brand-soft);
  border-color: var(--brand);
  color: var(--brand);
}
.btn--voice:hover { background: #d6e6e5; }
.btn__icon--brand { background: var(--brand); }
/* 正在朗读：按钮变成「停止朗读」的样子，老人一眼看得出 */
.btn--voice[data-speaking="1"] { background: var(--brand); color: #fff; }
.btn--voice[data-speaking="1"] .btn__icon--brand { background: #fff; color: var(--brand); }

.footnote {
  margin: 2rem 0 0;
  font-size: 0.95rem;
  color: #79766d;
  text-align: center;
  line-height: 1.6;
}

/* ---------- 提示区 / 结果区 ---------- */
.notice {
  background: var(--notice);
  border: 1px solid var(--notice-line);
  border-radius: var(--radius);
  padding: 1.1rem 1.2rem;
  margin: 0 0 1.2rem;
}
.notice--result { background: var(--card); border-color: var(--brand); border-width: 2px; }
.notice--tips { margin-top: 1.4rem; }
.notice__label { font-size: 1.05rem; color: var(--warn-ink); margin: 0 0 0.2rem; font-weight: 700; }
.notice__strong {
  font-size: 1.55rem; font-weight: 700; color: var(--brand);
  margin: 0.1rem 0 0.3rem;
}
.notice__text { font-size: 1.15rem; color: var(--ink-2); margin: 0; line-height: 1.7; }
.notice__row { margin-top: 0.8rem; display: flex; gap: 0.7rem; flex-wrap: wrap; }

/* ---------- 摘要表 ---------- */
.summary {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 0.4rem 1.2rem;
  margin: 0;
}
.summary__row {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--line);
}
.summary__row:last-child { border-bottom: 0; }
.summary__k { color: var(--muted); font-size: 1.05rem; flex: 0 0 auto; }
.summary__v { font-size: 1.2rem; font-weight: 700; text-align: right; }

/* ---------- 成功页 ---------- */
.success { text-align: center; padding: 0.5rem 0 0.3rem; }
.success__badge {
  width: 5rem; height: 5rem;
  margin: 0 auto 0.7rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--ok-soft);
  color: var(--ok);
  font-size: 2.6rem;
  font-weight: 700;
}
.ticket {
  background: var(--card);
  border: 2px solid var(--ok);
  border-radius: var(--radius-lg);
  padding: 1.2rem 1.3rem;
  margin-top: 1rem;
}
.ticket__hospital {
  margin: 0 0 0.2rem;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: 0.02em;
}
.ticket__no {
  font-size: 2.1rem; font-weight: 700; color: var(--ok);
  letter-spacing: 0.04em;
}
.ticket__label { font-size: 1rem; color: var(--muted); }

.tips { list-style: none; margin: 0.6rem 0 0; padding: 0; display: grid; gap: 0.55rem; }
.tips__item {
  display: flex; align-items: flex-start; gap: 0.7rem;
  font-size: 1.2rem; color: var(--ink); line-height: 1.6;
}
.tips__no {
  flex: 0 0 auto;
  width: 1.9rem; height: 1.9rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  font-size: 1.05rem;
  font-weight: 700;
  margin-top: 0.15rem;
}

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: var(--tap);
  padding: 0.7rem 1.3rem;
  border-radius: var(--radius);
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-family: inherit;
  font-size: 1.25rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.12s ease, transform 0.12s ease;
}
.btn:active { transform: scale(0.985); }
.btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-dark); }
.btn--primary:disabled,
.btn:disabled {
  background: var(--off-bg);
  border-color: var(--off-bg);
  color: var(--off-ink);
  cursor: not-allowed;
}
.btn--help { background: var(--notice); border-color: var(--notice-line); color: var(--warn-ink); }
.btn--sm { min-height: 3.2rem; padding: 0.35rem 1rem; font-size: 1.1rem; }
/* 必选项做完了，「下一步」轻轻呼吸一下，告诉老人可以点了 */
.btn--ready { animation: readyPulse 2s ease-in-out infinite; }
@keyframes readyPulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(47, 93, 98, 0.20); }
  50% { box-shadow: 0 0 0 8px rgba(47, 93, 98, 0.05); }
}
.btn__arrow { font-size: 1.4rem; line-height: 1; }
.btn__icon {
  width: 1.7rem; height: 1.7rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--warn-ink);
  color: #fff;
  font-size: 1.15rem;
}

/* ---------- 宽屏右栏：您已经选好的 ---------- */
.aside { display: none; }

/* ---------- 底部固定栏 ---------- */
.actionbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  background: var(--card);
  border-top: 1px solid var(--line);
  box-shadow: 0 -2px 12px rgba(34, 48, 58, 0.10);
  padding-bottom: env(safe-area-inset-bottom);
}
.actionbar__inner {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0.8rem 1.1rem;
  display: grid;
  grid-template-columns: 1fr 1fr 1.4fr;
  gap: 0.7rem;
}

/* ---------- 空闲关怀条 ---------- */
.idlebar {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(7.6rem + env(safe-area-inset-bottom));
  z-index: 41;
  background: var(--notice);
  border-top: 1px solid var(--notice-line);
  box-shadow: 0 -2px 10px rgba(34, 48, 58, 0.08);
  padding: 0.8rem 1.1rem;
}
.idlebar[hidden] { display: none; }
.idlebar__text {
  max-width: var(--shell);
  margin: 0 auto 0.5rem;
  font-size: 1.15rem;
  color: var(--warn-ink);
}
.idlebar__row { max-width: var(--shell); margin: 0 auto; display: flex; gap: 0.7rem; }

/* ---------- 弹窗 ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 1rem; }
.modal[hidden] { display: none; }
.modal__mask { position: absolute; inset: 0; background: rgba(31, 43, 51, 0.5); }
.modal__box {
  position: relative;
  width: min(560px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 1.4rem 1.4rem 1.2rem;
  box-shadow: 0 14px 48px rgba(31, 43, 51, 0.32);
}
.modal__title { font-size: 1.5rem; margin: 0 0 0.6rem; }
.modal__body { font-size: 1.15rem; color: var(--ink-2); }
.modal__body ul { margin: 0.5rem 0 0; padding-left: 1.3rem; }
.modal__body li { margin: 0.35rem 0; line-height: 1.7; }
.modal__actions { display: grid; gap: 0.7rem; margin-top: 1.2rem; }

.noscript {
  background: var(--notice);
  border: 1px solid var(--notice-line);
  padding: 1rem 1.2rem;
  margin: 1rem;
  border-radius: var(--radius);
  font-size: 1.15rem;
}

/* ---------- 无障碍与动效 ---------- */
:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {

<!-- ============ 顶部：品牌 + 语言 + 字体缩放 ============ -->
<header class="topbar">

<!-- ============ 主内容：每一步只做一件事 ============ -->
<main class="wrap" id="step-root" tabindex="-1">

        <span class="bigcard__title" data-i18n="step0.cta"></span>

  <!-- 第 1 步：选症状 -->

    } else if (state.step === 4) {
      lines.push(t('step4.title'), t('step4.lead'));
      var p = currentPatient();
      var dept4 = state.dept ? DEPTS[state.dept] : null;
      var doc4 = currentDoctor();
      lines.push(t('summary.patient') + ' ' + pick(p.name) + '，' + t('patient.idCard') + ' ' + p.idCard);
      lines.push(t('summary.dept') + ' ' + (dept4 ? pick(dept4.name) : PLACEHOLDER) + '，' + t('summary.doctor') + ' ' + (doc4 ? pick(doc4.name) : PLACEHOLDER) + '，' + t('summary.time') + ' ' + (slotText() || PLACEHOLDER));
      PAYS.forEach(function (pay) { lines.push(t(pay.key) + '，' + t(pay.descKey)); });
    } else if (state.step === 5) {
      lines.push(t('step5.title'), t('step5.lead'));
      lines.push(t('ticket.no') + ' ' + state.ticketNo);
      lines.push(t('step5.tip1'), t('step5.tip2'), t('step5.tip3'));
    }
    return lines.join('。');
  }

  function currentSymptom() {
    for (var i = 0; i < SYMPTOMS.length; i++) if (SYMPTOMS[i].id === state.symptom) return SYMPTOMS[i];
    return SYMPTOMS[0];
  }

  /* ---------------- 渲染 ---------------- */
  function applyStaticI18n() {
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    $$('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    document.title = t('doc.title');
    document.documentElement.lang = HTML_LANG[state.lang] || 'zh-CN';
    document.documentElement.setAttribute('data-lang', state.lang);
  }

  function renderStepbar() {
    var bar = $('#stepbar');
    bar.innerHTML = '';
    var steps = [0, 1, 2, 3, 4, 5];
    steps.forEach(function (i) {
      var done = i < state.step;
      var li = document.createElement('li');
      li.className = 'stepbar__item';
      li.setAttribute('data-state', i === state.step ? 'active' : (done ? 'done' : 'todo'));

      /* 走过的步骤可以点回去改，没走过的不能跳——防止老人误触跳步 */
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'stepbar__btn';
      btn.setAttribute('data-action', 'gostep');
      btn.setAttribute('data-value', String(i));
      if (i === state.step) btn.setAttribute('aria-current', 'step');
      btn.disabled = !done || state.step === 5;
      btn.setAttribute('aria-label', t('stepbar.' + i) + (btn.disabled ? '' : '（可回去修改）'));

      var no = document.createElement('span');
      no.className = 'stepbar__no';
      no.textContent = done ? '✓' : String(i);
      var label = document.createElement('span');
      label.textContent = t('stepbar.' + i);
      btn.appendChild(no);
      btn.appendChild(label);
      li.appendChild(btn);
      bar.appendChild(li);
    });
  }

  function optionCard(opts) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bigcard' + (opts.off ? ' bigcard--off' : '');
    btn.setAttribute('aria-pressed', opts.selected ? 'true' : 'false');
    if (opts.off) { btn.disabled = true; btn.setAttribute('aria-disabled', 'true'); }
    if (opts.action) btn.setAttribute('data-action', opts.action);
    if (opts.value) btn.setAttribute('data-value', opts.value);

    if (opts.avatarColor) {
      var av = document.createElement('span');
      av.className = 'avatar';
      av.style.background = opts.avatarColor;
      av.setAttribute('aria-hidden', 'true');
      av.textContent = opts.avatarText || '';
      btn.appendChild(av);
    } else if (opts.icon) {
      var ic = document.createElement('span');
      ic.className = 'bigcard__icon';
      ic.setAttribute('aria-hidden', 'true');
      ic.textContent = opts.icon;
      btn.appendChild(ic);
    }

    var main = document.createElement('span');
    main.className = 'bigcard__main';
    var ti = document.createElement('span');
    ti.className = 'bigcard__title';
    ti.textContent = opts.title;
    main.appendChild(ti);
    if (opts.desc) {
      var de = document.createElement('span');
      de.className = 'bigcard__desc';
      de.textContent = opts.desc;
      main.appendChild(de);
    }
    if (opts.meta) {
      var me = document.createElement('span');
      me.className = 'bigcard__meta';
      me.textContent = opts.meta;
      main.appendChild(me);
    }
    btn.appendChild(main);

    if (!opts.off) {
      var ck = document.createElement('span');
      ck.className = 'bigcard__check';
      ck.setAttribute('aria-hidden', 'true');
      ck.textContent = '✓';
      btn.appendChild(ck);
    }
    return btn;
  }

  function renderSymptoms() {
    var box = $('#symptom-list');
    box.innerHTML = '';
    SYMPTOMS.forEach(function (s) {
      box.appendChild(optionCard({
        icon: s.icon,
        title: pick(s.name),
        selected: state.symptom === s.id,
        action: 'symptom',
        value: s.id
      }));
    });

    showDeptResult();
  }

  /** 显示推荐（或手动改挂）的科室 */
  function showDeptResult() {
    var result = $('#dept-result');
    if (state.dept) {
      result.hidden = false;
      $('#dept-name').textContent = pick(DEPTS[state.dept].name);
      $('#dept-reason').textContent = state.deptPicked
        ? t('step1.pickedDept', { dept: pick(DEPTS[state.dept].name) })
        : t('step1.recommend', { symptom: pick(currentSymptom().name), dept: pick(DEPTS[state.dept].name) });
      var altsBox = $('#dept-alts');
      altsBox.innerHTML = '';
      altsBox.hidden = true;
    } else {
      result.hidden = true;
    }
  }

  function renderAlts() {
    var altsBox = $('#dept-alts');
    altsBox.innerHTML = '';
    var s = currentSymptom();
    var list = (s.alts || []).concat(Object.keys(DEPTS).filter(function (d) {

    })).slice(0, 4);
    if (!list.length) { altsBox.hidden = true; return; }
    var label = document.createElement('p');
    label.className = 'notice__text';
    label.textContent = t('step1.altsLabel');
    altsBox.appendChild(label);
    list.forEach(function (d) {

  function renderDoctors() {
    var box = $('#doctor-list');
    box.innerHTML = '';
    $('#step2-lead').textContent = t('step2.lead', { dept: pick(DEPTS[state.dept].name) });
    (DOCTORS[state.dept] || []).forEach(function (d) {
      box.appendChild(optionCard({
        avatarColor: colorOf(d.id),
        avatarText: initialOf(d),
        title: pick(d.name) + ' · ' + pick(d.title),
        desc: pick(d.good),
        meta: t('summary.fee') + ' ¥' + d.fee,
        selected: state.doctor === d.id,
        action: 'doctor',
        value: d.id
      }));
    });
  }

  function renderDates() {
    var box = $('#date-list');
    box.innerHTML = '';
    dateOptions().forEach(function (d) {
      box.appendChild(optionCard({
        icon: (state.lang === 'en' ? d.label.charAt(0) : d.label.charAt(0)),
        title: d.label,
        desc: d.text,
        selected: state.date === d.id,
        action: 'date',
        value: d.id
      }));
    });
  }

  function renderSlots() {
    var box = $('#slot-list');
    box.innerHTML = '';
    SLOTS.forEach(function (s) {
      var left = state.doctor ? slotLeft(state.doctor, state.date || 'd0', s.id) : 1;
      var off = left === 0;
      box.appendChild(optionCard({
        icon: s.id === 'am' ? '上' : '下',
        title: t(s.labelKey) + ' ' + t(s.timeKey),
        desc: off ? t('slot.full') : t('slot.left', { n: left }),
        off: off,
        selected: !off && state.slot === s.id,
        action: 'slot',
        value: s.id
      }));
    });
  }

  function renderPatients() {
    var box = $('#patient-list');
    box.innerHTML = '';
    PATIENTS.forEach(function (p) {
      box.appendChild(optionCard({
        avatarColor: colorOf(p.id),
        avatarText: initialOf(p),
        title: pick(p.name) + ' · ' + t(p.relKey),
        desc: pick(p.sex) + ' · ' + t('patient.age', { age: p.age }),
        meta: t('patient.idCard') + ' ' + p.idCard + ' · ' + t('patient.phone') + ' ' + p.phone,
        selected: state.patient === p.id,
        action: 'patient',
        value: p.id
      }));
    });
  }

  function renderSummary() {
    var box = $('#summary');
    box.innerHTML = '';
    /* 状态不全时也不能崩：缺的字段用占位符，保证付款方式等区块照常显示 */
    var dept = state.dept ? DEPTS[state.dept] : null;
    var doc = currentDoctor();
    var rows = [
      [t('summary.dept'), dept ? pick(dept.name) : PLACEHOLDER],
      [t('summary.doctor'), doc ? (pick(doc.name) + ' · ' + pick(doc.title)) : PLACEHOLDER],
      [t('summary.time'), slotText() || PLACEHOLDER],
      [t('ticket.place'), dept ? pick(dept.place) : PLACEHOLDER],
      [t('summary.fee'), doc ? ('¥' + doc.fee) : PLACEHOLDER]
    ];
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'summary__row';
      var k = document.createElement('dt');
      k.className = 'summary__k';
      k.textContent = r[0];
      var v = document.createElement('dd');
      v.className = 'summary__v';
      v.textContent = r[1];
      row.appendChild(k);
      row.appendChild(v);
      box.appendChild(row);
    });
  }

  /* 右栏「您已经选好的」：宽屏常驻，老人随时能看见自己选到哪一步了 */
  function renderAside() {
    var box = $('#aside-list');
    if (!box) return;
    var now = $('#aside-now');
    if (now) {
      now.textContent = (state.step >= 1 && state.step <= 5) ? t('aside.now', { n: state.step }) : '';
    }
    box.innerHTML = '';
    var rows = [];
    if (state.symptom) rows.push([t('aside.symptom'), pick(currentSymptom().name)]);
    if (state.dept) rows.push([t('aside.dept'), pick(DEPTS[state.dept].name)]);
    if (state.doctor) rows.push([t('aside.doctor'), pick(currentDoctor().name)]);
    if (state.date && state.slot) rows.push([t('aside.time'), slotText()]);
    if (state.pay) { var payItem = currentPay(); rows.push([t('aside.pay'), payItem ? t(payItem.key) : PLACEHOLDER]); }

    if (!rows.length) {
      var empty = document.createElement('p');
      empty.className = 'aside__empty';
      empty.textContent = t('aside.empty');
      box.appendChild(empty);
      return;
    }
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'aside__row';
      var k = document.createElement('span');
      k.className = 'aside__k';
      k.textContent = r[0];
      var v = document.createElement('span');
      v.className = 'aside__v';
      v.textContent = r[1];
      row.appendChild(k);
      row.appendChild(v);
      box.appendChild(row);
    });
  }

  function renderPays() {
    var box = $('#pay-list');
    box.innerHTML = '';
    PAYS.forEach(function (p) {
      box.appendChild(optionCard({
        icon: p.icon,
        title: t(p.key),
        desc: t(p.descKey),
        selected: state.pay === p.id,
        action: 'pay',
        value: p.id
      }));
    });
  }

  function renderTicket() {
    var box = $('#ticket');
    box.innerHTML = '';
    var hp = document.createElement('p');
    hp.className = 'ticket__hospital';
    hp.textContent = t('brand.hospital');
    box.appendChild(hp);
    var no = document.createElement('p');
    no.className = 'ticket__label';
    no.textContent = t('ticket.no');
    box.appendChild(no);
    var noV = document.createElement('p');
    noV.className = 'ticket__no';
    noV.textContent = state.ticketNo;
    box.appendChild(noV);

    var rows = [
      [t('summary.patient'), pick(currentPatient().name)],
      [t('summary.dept'), pick(DEPTS[state.dept].name)],
      [t('summary.doctor'), pick(currentDoctor().name) + ' · ' + pick(currentDoctor().title)],
      [t('summary.time'), slotText()],
      [t('ticket.place'), pick(DEPTS[state.dept].place)],
      [t('summary.pay'), t(currentPay().key)]
    ];
    var dl = document.createElement('dl');
    dl.className = 'summary';
    dl.style.marginTop = '0.8rem';
    dl.style.border = 'none';
    dl.style.padding = '0';
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'summary__row';
      var k = document.createElement('dt');
      k.className = 'summary__k';
      k.textContent = r[0];
      var v = document.createElement('dd');
      v.className = 'summary__v';
      v.textContent = r[1];
      row.appendChild(k);
      row.appendChild(v);
      dl.appendChild(row);

  /**
   * 就地更新勾选状态：不重建列表，焦点与朗读位置不丢，
   * 老人用键盘或读屏时不会「跳到别处」。
   */
  function markSelected(containerSel, value) {
    var cards = $$(containerSel + ' .bigcard');
    for (var i = 0; i < cards.length; i++) {
      var isOn = cards[i].getAttribute('data-value') === value;
      cards[i].setAttribute('aria-pressed', isOn ? 'true' : 'false');
    }
  }

  /** 当前这一步的必选项是否已做完（做完才让「下一步」亮起来，引导老人点） */
  function stepReady() {
    if (state.step === 0) return true;
    if (state.step === 1) return !!state.symptom || !!state.deptPicked;
    if (state.step === 2) return !!state.doctor;
    if (state.step === 3) return !!state.date && !!state.slot;
    if (state.step === 4) return !!state.pay;
    return false;
  }
  function updateNextState() {
    var next = $('#btn-next');
    if (next && state.step < 5) next.classList.toggle('btn--ready', stepReady());
  }

  var PLACEHOLDER = '—'; /* 字段缺失时的占位符，避免渲染整块崩掉 */

  /* 单块渲染隔离：某一块数据缺失时，不让它拖垮整页渲染 */
  function safeRender(fn) { try { fn(); } catch (e) { /* 忽略单块异常 */ } }

  /* 底部操作栏高度：供悬浮按钮避让，避免遮住「需要帮助」等按钮 */
  function syncActionbar() {
    var bar = $('#actionbar');
    var h = (bar && !bar.hidden) ? bar.offsetHeight : 0;
    document.documentElement.style.setProperty('--actionbar-h', h + 'px');
  }

  function renderStep() {
    for (var i = 0; i <= 5; i++) {
      var el = $('#step-' + i);
      if (el) el.hidden = (i !== state.step);
    }
    document.body.setAttribute('data-step', String(state.step));
    var bar = $('#actionbar');
    bar.hidden = (state.step === 5);
    var prev = $('#btn-prev');
    prev.disabled = (state.step === 0);

    var next = $('#btn-next');
    var nextLabel = next.querySelector('[data-i18n]');
    nextLabel.textContent = state.step === 4 ? t('nav.nextSubmit') : t('nav.next');
    updateNextState();

    if (state.step === 1) safeRender(renderSymptoms);
    if (state.step === 2) safeRender(renderDoctors);
    if (state.step === 3) { safeRender(renderDates); safeRender(renderSlots); }
    if (state.step === 4) { safeRender(renderPatients); safeRender(renderSummary); safeRender(renderPays); }
    if (state.step === 5) safeRender(renderTicket);

    renderStepbar();
    renderAside();
    syncActionbar();
    window.scrollTo(0, 0);
    if (autoSpeak) { var voice = ''; try { voice = stepVoice(); } catch (e) { /* 播报文案异常不阻断渲染 */ } if (voice) speak(voice); }
    renderHooks.forEach(function (fn) { try { fn(); } catch (e) { /* 外部模块出错不影响主流程 */ } });
  }

  function render() { applyStaticI18n(); renderStep(); }

  /* ---------------- 弹窗 ---------------- */
  var pendingConfirm = false; // 确认窗开着时，语音助手的「确认」才生效
  function openModal(title, bodyHtml, actions) {
    var modal = $('#modal');
    $('#modal-title').textContent = title;
    var body = $('#modal-body');
    body.innerHTML = '';
    if (typeof bodyHtml === 'string') {
      body.innerHTML = bodyHtml;
    } else {
      body.appendChild(bodyHtml);
    }
    var act = $('#modal-actions');
    act.innerHTML = '';
    actions.forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn ' + (a.primary ? 'btn--primary' : 'btn--ghost');
      b.textContent = a.label;
      b.addEventListener('click', function () { closeModal(); if (a.onClick) a.onClick(); });
      act.appendChild(b);
    });
    modal.hidden = false;
    var first = act.querySelector('.btn');
    if (first) first.focus();
  }
  function closeModal() { $('#modal').hidden = true; pendingConfirm = false; }

  /** 焦点锁在弹窗里：老人按 Tab 不会跑到背后的页面上 */
  function trapFocus(container, ev) {
    var items = container.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }

  function alertDialog(text) {
    openModal(t('dialog.needTitle'), '<p>' + text + '</p>', [
      { label: t('dialog.ok'), primary: true }
    ]);
  }

  function helpDialog() {
    var ul = document.createElement('div');
    var list = document.createElement('ul');
    [t('dialog.help1'), t('dialog.help2'), t('dialog.help3')].forEach(function (line) {
      var li = document.createElement('li');
      li.textContent = line;
      list.appendChild(li);
    });
    ul.appendChild(list);
    openModal(t('dialog.helpTitle'), ul, [
      { label: t('dialog.helpSpeak'), onClick: function () { speak(t('dialog.helpTitle') + '。' + t('dialog.help1') + t('dialog.help2') + t('dialog.help3')); } },
      { label: t('dialog.close'), primary: true }
    ]);
    speak(t('dialog.helpTitle') + '。' + t('dialog.help1') + t('dialog.help2') + t('dialog.help3'));
  }

  function confirmDialog() {
    if (!canGoNext()) return; // 信息不全时不弹确认窗，先提示缺什么
    var body = t('dialog.confirmBody', {
      dept: pick(DEPTS[state.dept].name),
      doctor: pick(currentDoctor().name),
      time: slotText(),
      patient: pick(currentPatient().name),
      pay: t(currentPay().key)
    });
    openModal(t('dialog.confirmTitle'), '<p>' + body + '</p>', [
      { label: t('dialog.confirmNo') },
      { label: t('dialog.confirmYes'), primary: true, onClick: submitBooking }
    ]);
    pendingConfirm = true;
    speak(t('dialog.confirmTitle') + '。' + body);
  }

  function submitBooking() {
    pendingConfirm = false;
    var seed = hash(state.dept + state.doctor + state.date + state.slot + state.patient);
    state.ticketNo = 'A' + String(100 + (seed % 800));
    state.step = 5;
    renderStep();
    speak(stepVoice());
  }

  /* ---------------- 流程控制 ---------------- */
  function canGoNext() {
    if (state.step === 1) {
      if (!state.symptom && !state.deptPicked) { alertDialog(t('dialog.needSymptom')); return false; }
    } else if (state.step === 2) {
      if (!state.doctor) { alertDialog(t('dialog.needDoctor')); return false; }
    } else if (state.step === 3) {
      if (!state.date) { alertDialog(t('dialog.needDate')); return false; }
      if (!state.slot) { alertDialog(t('dialog.needSlot')); return false; }
    } else if (state.step === 4) {
      if (!state.pay) { alertDialog(t('dialog.needPay')); return false; }
    }
    return true;
  }

  function next() {
    if (state.step === 0) { state.step = 1; renderStep(); return; }
    if (!canGoNext()) return;
    if (state.step === 4) { confirmDialog(); return; } // 提交前强制确认，防误操作
    state.step = Math.min(5, state.step + 1);
    renderStep();
  }

  function prev() {
    if (state.step === 0) return;
    state.step -= 1;
    renderStep();
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (ev) {
    var el = ev.target;
    autoSpeak = true; // 任何一次点选之后即可自动朗读

    var close = el.closest ? el.closest('[data-close]') : null;
    if (close) { closeModal(); return; }

    var btn = el.closest ? el.closest('[data-action]') : null;
    if (btn) {
      var action = btn.getAttribute('data-action');
      var value = btn.getAttribute('data-value');
      handleAction(action, value);
      return;
    }

    var langBtn = el.closest ? el.closest('[data-lang-btn]') : null;
    if (langBtn) { setLang(langBtn.getAttribute('data-lang-btn')); return; }
  });

  function handleAction(action, value) {
    stopSpeak();
    switch (action) {
      case 'start':
        state.step = 1; renderStep(); break;
      case 'symptom':
        state.symptom = value;
        state.deptPicked = false;
        state.dept = SYMPTOMS.filter(function (s) { return s.id === value; })[0].dept;
        state.doctor = null; state.slot = null;
        markSelected('#symptom-list', value);
        ensureVisible('#symptom-list', value);
        showDeptResult();
        speak(t('step1.recommend', { symptom: pick(currentSymptom().name), dept: pick(DEPTS[state.dept].name) }));
        break;
      case 'dept':
        state.dept = value; state.doctor = null; state.slot = null;
        state.deptPicked = true;
        markSelected('#symptom-list', null);
        showDeptResult();
        $('#dept-alts').hidden = true;
        speak(pick(DEPTS[state.dept].name));
        break;
      case 'doctor':
        state.doctor = value; state.slot = null;
        markSelected('#doctor-list', value);
        ensureVisible('#doctor-list', value);
        speak(pick(currentDoctor().name) + '，' + pick(currentDoctor().title));
        break;
      case 'date':
        state.date = value; state.slot = null;
        markSelected('#date-list', value);
        ensureVisible('#date-list', value);
        renderSlots(); // 余量随日期变化，时段需重算
        speak(dateOptions().filter(function (d) { return d.id === value; })[0].text);
        break;
      case 'slot':
        if (state.doctor && slotLeft(state.doctor, state.date || 'd0', value) === 0) {
          alertDialog(t('dialog.slotFull'));
          updateNextState();
          return;
        }
        state.slot = value;
        markSelected('#slot-list', value);
        ensureVisible('#slot-list', value);
        speak(t(value === 'am' ? 'slot.am' : 'slot.pm'));
        break;
      case 'patient':
        state.patient = value;
        markSelected('#patient-list', value);
        ensureVisible('#patient-list', value);
        renderSummary();
        speak(pick(currentPatient().name));
        break;
      case 'pay':
        state.pay = value;
        markSelected('#pay-list', value);
        ensureVisible('#pay-list', value);
        speak(t(currentPay().key) + '，' + t(currentPay().descKey));
        break;
      case 'gostep':
        /* 只允许回到已经走过的步骤，不能跳过没完成的步骤 */
        var target = parseInt(value, 10);
        if (isNaN(target) || target >= state.step || state.step === 5) return;
        state.step = target;
        renderStep();
        break;
      case 'restart':
        resetAll(); state.step = 1; renderStep(); break;
      case 'done':
        resetAll(); state.step = 0; renderStep(); break;
    }
    updateNextState();
  }

  /** 刚点中的卡片如果滚出屏幕，轻轻带回可视区（不抢焦点，读屏位置不丢） */
  function ensureVisible(sel, value) {
    try {
      var el = $(sel + ' .bigcard[data-value="' + value + '"]');
      if (el && typeof el.scrollIntoView === 'function') el.scrollIntoView({ block: 'nearest' });
    } catch (e) { /* 部分浏览器不支持，忽略 */ }
  }

  function resetAll() {
    state.symptom = null; state.dept = null; state.deptPicked = false; state.doctor = null;
    state.date = null; state.slot = null; state.pay = null;
    state.patient = 'self'; state.ticketNo = null;
  }

  $('#btn-next').addEventListener('click', next);
  $('#btn-prev').addEventListener('click', function () { stopSpeak(); prev(); });
  $('#btn-help').addEventListener('click', function () { stopSpeak(); helpDialog(); });
  $('#btn-speak').addEventListener('click', function () { speak(stepVoice()); });
  $('#btn-stop').addEventListener('click', function () { stopSpeak(); setLive(''); });
  $('#dept-change').addEventListener('click', function () {
    var box = $('#dept-alts');
    if (box.hidden) renderAlts(); else { box.hidden = true; box.innerHTML = ''; }
  });

  document.addEventListener('keydown', function (ev) {
    if ($('#modal').hidden) return;
    if (ev.key === 'Escape') { closeModal(); return; }
    if (ev.key === 'Tab') trapFocus($('#modal'), ev);
  });

  /* ---------------- 字体缩放 ---------------- */
  var FONT_MIN = 0.9, FONT_MAX = 1.5, FONT_STEP = 0.15;
  function applyFont() {
    document.documentElement.style.setProperty('--fs', String(state.font));
    store('xiaoyuer.font', String(state.font));
    syncTopbar(); // 字号变了顶栏高度也变，步骤条吸顶位置要跟着走
  }
  function setFont(v) {
    state.font = Math.min(FONT_MAX, Math.max(FONT_MIN, Math.round(v * 100) / 100));
    applyFont();
  }
  $('#font-plus').addEventListener('click', function () { setFont(state.font + FONT_STEP); });
  $('#font-minus').addEventListener('click', function () { setFont(state.font - FONT_STEP); });
  $('#font-reset').addEventListener('click', function () { setFont(1); });

  /* ---------------- 语言 ---------------- */
  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) return;
    state.lang = lang;
    store('xiaoyuer.lang', lang);
    stopSpeak();
    $$('[data-lang-btn]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang-btn') === lang ? 'true' : 'false');
    });
    render();
  }

  /* ---------------- 本地记忆 ---------------- */
  var memStore = {}; // localStorage 不可用（隐私模式、file:// 限制）时的内存回退
  function store(key, value) {
    memStore[key] = String(value);
    try { window.localStorage.setItem(key, String(value)); } catch (e) { /* 隐私模式下忽略 */ }
  }
  function read(key) {
    try {
      var v = window.localStorage.getItem(key);
      if (v != null) return v;
    } catch (e) { /* 忽略，走内存回退 */ }
    return memStore[key] != null ? memStore[key] : null;
  }

  /* ---------------- 对外导航动作 ----------------
     智能体（含语音助手）只能走这份白名单：
     要么调「能力清单」里的动作，要么调这里的界面导航，绝不能直接碰页面。 */
  function uiNav(cmd) {
    stopSpeak();
    switch (cmd) {
      case 'next': next(); return true;
      case 'prev': prev(); return true;
      case 'help': helpDialog(); return true;
      case 'read': speak(stepVoice()); return true;
      case 'stop': stopSpeak(); setLive(''); return true;
      case 'confirm': if (state.step !== 4) return false; confirmDialog(); return true; // 仍要人工点
      case 'confirmYes': if (state.step !== 4) return false; closeModal(); submitBooking(); return true;
      case 'closeModal': closeModal(); return true;
      case 'fontUp': setFont(state.font + FONT_STEP); return true;
      case 'fontDown': setFont(state.font - FONT_STEP); return true;
      case 'fontReset': setFont(1); return true;
      case 'restart': resetAll(); state.step = 1; renderStep(); return true;
      case 'home': resetAll(); state.step = 0; renderStep(); return true;
      default: return false;
    }
  }

  /** 当前每一步的「可选项」——智能体只能从这里取值，防止说出一个页面上没有的选项 */
  function options() {
    return {
      symptoms: SYMPTOMS.map(function (s) { return { id: s.id, name: pick(s.name) }; }),
      depts: Object.keys(DEPTS).map(function (d) { return { id: d, name: pick(DEPTS[d].name) }; }),
      doctors: (DOCTORS[state.dept] || []).map(function (d) { return { id: d.id, name: pick(d.name), title: pick(d.title) }; }),
      dates: dateOptions().map(function (d) { return { id: d.id, name: d.label, text: d.text }; }),
      slots: SLOTS.map(function (s) { return { id: s.id, name: t(s.labelKey), text: t(s.timeKey) }; }),
      patients: PATIENTS.map(function (p) { return { id: p.id, name: pick(p.name), rel: t(p.relKey) }; }),
      pays: PAYS.map(function (p) { return { id: p.id, name: t(p.key) }; })
    };
  }

  /* ---------------- 空闲关怀：老人停住不动时，轻轻提示一句 ---------------- */
  var IDLE_MS = 75000;
  var idleTimer = null;
  function hideIdle() {
    var bar = $('#idlebar');
    if (bar) bar.hidden = true;
    document.body.classList.remove('idle-on');
  }
  function resetIdle() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    hideIdle();
    if (state.step >= 1 && state.step <= 4) {
      idleTimer = setTimeout(function () {
        if (state.step < 1 || state.step > 4) return;
        var b = $('#idlebar');
        if (!b) return;
        b.hidden = false;
        document.body.classList.add('idle-on');
      }, IDLE_MS);
    }
  }
  ['click', 'keydown', 'touchstart'].forEach(function (evt) {
    document.addEventListener(evt, resetIdle, { passive: true });
  });

  /* ---------------- 步骤条吸顶跟随：按顶栏实际高度对齐 ---------------- */
  function syncTopbar() {
    var el = $('.topbar');
    if (!el || !el.offsetHeight) return;
    document.documentElement.style.setProperty('--topbar-h', el.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncTopbar);
  window.addEventListener('resize', syncActionbar);
  if (typeof window.ResizeObserver === 'function') {
    try { new window.ResizeObserver(syncActionbar).observe($('#actionbar')); } catch (e) { /* 忽略 */ }
  }
  if (typeof window.ResizeObserver === 'function') {
    try { new window.ResizeObserver(syncTopbar).observe($('.topbar')); } catch (e) { /* 忽略 */ }
  }

  /* ---------------- 对外能力清单（供智能体代驾） ----------------
     模型只负责「选哪个」，执行一律由下面这些确定性函数完成。 */
  var CAPABILITIES = [
    { id: 'select_symptom', risk: 'low', options: SYMPTOMS.map(function (s) { return s.id; }) },
    { id: 'select_department', risk: 'low', options: Object.keys(DEPTS) },
    { id: 'select_doctor', risk: 'low', note: 'options depend on department' },
    { id: 'select_date', risk: 'low', options: ['d0', 'd1', 'd2'] },
    { id: 'select_slot', risk: 'low', options: ['am', 'pm'] },
    { id: 'select_patient', risk: 'medium', options: PATIENTS.map(function (p) { return p.id; }) },
    { id: 'select_payment', risk: 'medium', options: PAYS.map(function (p) { return p.id; }) },
    { id: 'submit_booking', risk: 'high', note: 'requires granted=true' },
    { id: 'reset', risk: 'low' }
  ];

  /** 确定性执行：只接受能力清单内的动作，参数不在取值范围内直接拒绝 */
  function call(actionId, params) {
    params = params || {};
    switch (actionId) {
      case 'select_symptom':
        if (!SYMPTOMS.some(function (s) { return s.id === params.value; })) return reject();
        handleAction('symptom', params.value); return ok();
      case 'select_department':
        if (!DEPTS[params.value]) return reject();
        handleAction('dept', params.value); return ok();
      case 'select_doctor':
        if (!state.dept || !(DOCTORS[state.dept] || []).some(function (d) { return d.id === params.value; })) return reject();
        handleAction('doctor', params.value); return ok();
      case 'select_date':
        if (['d0', 'd1', 'd2'].indexOf(params.value) < 0) return reject();
        handleAction('date', params.value); return ok();
      case 'select_slot':
        if (['am', 'pm'].indexOf(params.value) < 0) return reject();
        if (state.doctor && slotLeft(state.doctor, state.date || 'd0', params.value) === 0) {
          return { ok: false, reason: 'slot_full' };
        }
        handleAction('slot', params.value); return ok();
      case 'select_patient':
        if (!PATIENTS.some(function (p) { return p.id === params.value; })) return reject();
        handleAction('patient', params.value); return ok();
      case 'select_payment':
        if (!PAYS.some(function (p) { return p.id === params.value; })) return reject();
        handleAction('pay', params.value); return ok();
      case 'submit_booking':
        if (!canGoNext()) return { ok: false, reason: 'incomplete' };
        if (params.granted !== true) return { ok: false, reason: 'need_confirm', label: t('nav.nextSubmit') };
        submitBooking(); return ok();
      case 'reset':
        resetAll(); state.step = 0; renderStep(); return ok();
      default:
        return reject();
    }
  }
  /* 成功执行一次能力后，顺手刷新右栏摘要 —— 点选走的是就地更新，不会触发 renderStep */
  function ok() { renderAside(); return { ok: true, state: getState() }; }
  function reject() { return { ok: false, reason: 'not_in_capability_list' }; }

  function getState() {
    return {
      step: state.step,
      lang: state.lang,
      font: state.font,
      symptom: state.symptom,
      dept: state.dept,
      doctor: state.doctor,
      date: state.date,
      slot: state.slot,
      patient: state.patient,
      pay: state.pay,
      ticketNo: state.ticketNo,
      deptName: state.dept ? pick(DEPTS[state.dept].name) : null,
      doctorName: currentDoctor() ? pick(currentDoctor().name) : null,
      timeText: state.date && state.slot ? slotText() : null
    };
  }

  window.XiaoYuEr = {
    version: '1.1.0',
    capabilities: CAPABILITIES,
    getState: getState,
    call: call,
    speak: speak,
    stopSpeak: stopSpeak,
    setLanguage: setLang,
    setFontScale: setFont,
    go: function (step) { state.step = Math.max(0, Math.min(5, step)); renderStep(); },
    /* 给外部智能体（语音助手等）用的扩展点：注册文案 / 订阅重绘 / 导航 / 可选项 */
    registerI18n: registerI18n,
    onRender: onRender,
    t: t,
    nav: uiNav,
    options: options,
    stepReady: stepReady,
    isConfirmOpen: function () { return pendingConfirm && !$('#modal').hidden; },
    /* 调试与自检接口：翻译表、翻译函数、语音文本，供自动化验证使用 */
    debug: { i18n: I18N, t: t, languages: LANGS, keys: Object.keys(I18N.zh), voiceOfStep: stepVoice, speechLang: SPEECH_LANG,
      persist: function () { return { font: read('xiaoyuer.font'), lang: read('xiaoyuer.lang') }; } }
  };

  /* ---------------- 启动 ---------------- */
  var savedLang = read('xiaoyuer.lang');
  if (savedLang && LANGS.indexOf(savedLang) >= 0) state.lang = savedLang;
  var savedFont = parseFloat(read('xiaoyuer.font') || '1');
  if (!isNaN(savedFont)) state.font = savedFont;

  $$('[data-lang-btn]').forEach(function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-lang-btn') === state.lang ? 'true' : 'false');
  });
  applyFont();
  render();
  syncTopbar();
  resetIdle();

  var idleHelp = $('#idlebar-help');
  if (idleHelp) idleHelp.addEventListener('click', function () { helpDialog(); });
  var idleClose = $('#idlebar-close');
  if (idleClose) idleClose.addEventListener('click', function () { hideIdle(); resetIdle(); });

  if (speechSupported()) {
    window.speechSynthesis.onvoiceschanged = function () { /* 语音列表异步就绪，无需处理 */ };
  }
})();
</script>

  /* ---------------- 文本归一 ---------------- */
  function norm(s) {
    return String(s || '').toLowerCase().replace(/[\s，。,.;；:：!！?？'"“”‘’、\-—_/\\()（）]/g, '');
  }
  function fixText(s) {
    for (var i = 0; i < FIX.length; i++) s = s.split(FIX[i][0]).join(FIX[i][1]);
    return s;
  }
  function longestHit(text, list) {
    var best = '';
    if (!list) return best;
    for (var i = 0; i < list.length; i++) {
      var w = norm(list[i]);
      if (w && text.indexOf(w) >= 0 && w.length > best.length) best = w;
    }
    return best;
  }
  function aliasHit(text, aliasTable, id) {
    var a = aliasTable[id];
    if (!a) return '';
    return longestHit(text, a[X.getState().lang] || a.zh);
  }
  function allLangHit(text, aliasTable, id) {
    var a = aliasTable[id] || {};
    var best = '';
    LANGS.forEach(function (l) {
      var m = longestHit(text, a[l] || []);
      if (m.length > best.length) best = m;
    });
    return best;
  }

  /* ---------------- 意图理解（规则引擎，离线可用） ---------------- */
  function understand(raw) {
    var text = fixText(norm(raw));
    if (!text) return { intent: 'empty', actions: [], score: 0 };

    var st = X.getState();
    var opt = X.options();
    var lang = st.lang;
    var order = [lang].concat(LANGS.filter(function (l) { return l !== lang; }));
    function group(name) {
      var g = KW[name] || {};
      for (var i = 0; i < order.length; i++) {
        var m = longestHit(text, g[order[i]] || []);
        if (m) return m;
      }
      return '';
    }
    function act(id, value, score) {
      return { kind: 'cap', id: id, params: { value: value }, steps: STEP_GUARD[id], score: score };
    }
    function nav(cmd, score) { return { kind: 'nav', nav: cmd, score: score }; }

    /* 1. 确认窗开着时，只听「确认 / 取消」，别的都不动 */
    if (X.isConfirmOpen()) {
      if (group('yes')) return { intent: 'confirm_yes', actions: [nav('confirmYes', 9)], score: 9 };
      if (group('no')) return { intent: 'confirm_no', actions: [{ kind: 'closeConfirm' }], score: 9 };
      return { intent: 'confirm_wait', actions: [], score: 0, reply: T('ai.needConfirm') };
    }

    /* 2. 控制类：念 / 停 / 帮助 / 字号 / 前后 / 重来 / 问进度，一句话只做一件事 */
    if (group('stop')) return { intent: 'stop', actions: [nav('stop', 5)], reply: T('ai.stopped'), score: 5 };
    if (group('read')) return { intent: 'read', actions: [nav('read', 5)], reply: T('ai.read'), score: 5 };
    if (group('help')) return { intent: 'help', actions: [nav('help', 5)], reply: T('ai.help'), score: 5 };
    if (group('fontUp')) return { intent: 'fontUp', actions: [nav('fontUp', 5)], reply: T('ai.fontUp'), score: 5 };
    if (group('fontDown')) return { intent: 'fontDown', actions: [nav('fontDown', 5)], reply: T('ai.fontDown'), score: 5 };
    if (group('status')) {
      return {
        intent: 'status', actions: [], score: 5,
        reply: T('ai.statusStep', { n: st.step, name: T('stepbar.' + st.step) })
      };
    }
    if (group('restart')) return { intent: 'restart', actions: [nav('restart', 6)], reply: T('ai.restart'), score: 6 };
    if (group('prev')) return { intent: 'prev', actions: [nav('prev', 5)], reply: T('ai.prev'), score: 5 };
    if (group('next')) return { intent: 'next', actions: [nav('next', 5)], reply: T('ai.next'), score: 5 };

    var actions = [];
    var score = 0;

    /* 3. 开始挂号 */
    var hitStart = group('start');
    if (hitStart && st.step <= 1) {
      actions.push(nav(st.step === 0 ? 'next' : 'noop', hitStart.length));
      score += hitStart.length;
    }

    /* 4. 症状（口语说法优先，其次页面上的选项名） */
    var symId = null, symScore = 0;
    Object.keys(SYM_ALIAS).forEach(function (id) {
      var m = allLangHit(text, SYM_ALIAS, id);
      if (m && m.length > symScore) { symScore = m.length; symId = id; }
    });
    opt.symptoms.forEach(function (s) {
      if (text.indexOf(norm(s.name)) >= 0 && norm(s.name).length > symScore) {
        symScore = norm(s.name).length; symId = s.id;
      }
    });
    if (symId) { actions.push(act('select_symptom', symId, symScore)); score += symScore; }

    /* 5. 科室（说得不够具体时，反过来问一句） */
    var deptId = null, deptScore = 0;
    Object.keys(DEPT_ALIAS).forEach(function (id) {
      var m = allLangHit(text, DEPT_ALIAS, id);
      if (m && m.length > deptScore) { deptScore = m.length; deptId = id; }
    });
    opt.depts.forEach(function (d) {
      var n = norm(d.name);
      if (n && text.indexOf(n) >= 0 && n.length > deptScore) { deptScore = n.length; deptId = d.id; }
    });
    if (deptId) { actions.push(act('select_department', deptId, deptScore)); score += deptScore; }
    else if (group('vague') && !symId) {
      return { intent: 'ask', actions: [], score: 2, reply: T('ai.askSymptom') };
    }

    /* 6. 医生：第几位 / 职称 / 姓名 / 姓 */
    var docId = null, docScore = 0;
    var ord = -1;
    if (text.indexOf('第一') >= 0 || text.indexOf('首位') >= 0) ord = 0;
    else if (text.indexOf('第二') >= 0) ord = 1;
    else if (text.indexOf('第三') >= 0) ord = 2;
    if (ord >= 0 && opt.doctors[ord]) { docId = opt.doctors[ord].id; docScore = 4; }
    if (!docId) {
      [['副主任', 1], ['主任', 0], ['主治', 2], ['专家', 0]].forEach(function (p) {
        if (!docId && text.indexOf(p[0]) >= 0 && opt.doctors[p[1]]) { docId = opt.doctors[p[1]].id; docScore = 3; }
      });
    }
    if (!docId) {
      opt.doctors.forEach(function (d) {
        var full = norm(d.name);
        var short = st.lang === 'en' ? full.split(' ')[0] : full.charAt(0);
        if (full && text.indexOf(full) >= 0 && full.length > docScore) { docScore = full.length; docId = d.id; }
        else if (short && short.length >= 1 && text.indexOf(short) >= 0 && short.length + 1 > docScore) { docScore = short.length + 1; docId = d.id; }
      });
    }
    if (docId) { actions.push(act('select_doctor', docId, docScore)); score += docScore; }

    /* 7. 日期与时段：一句话里可以同时有「明天上午」 */
    var dateId = null;
    if (group('today')) dateId = 'd0';
    else if (group('tomorrow')) dateId = 'd1';
    else if (group('dayAfter')) dateId = 'd2';
    if (dateId) { actions.push(act('select_date', dateId, 3)); score += 3; }
    var slotId = null;
    if (group('pm')) slotId = 'pm';
    else if (group('am')) slotId = 'am';
    if (slotId) { actions.push(act('select_slot', slotId, 3)); score += 3; }

    /* 8. 就诊人与付款方式 */
    var patId = null, patScore = 0;
    Object.keys(PAT_ALIAS).forEach(function (id) {
      var m = allLangHit(text, PAT_ALIAS, id);
      if (m && m.length > patScore) { patScore = m.length; patId = id; }
    });
    if (patId) { actions.push(act('select_patient', patId, patScore)); score += patScore; }

    var payId = null, payScore = 0;
    Object.keys(PAY_ALIAS).forEach(function (id) {
      var m = allLangHit(text, PAY_ALIAS, id);
      if (m && m.length > payScore) { payScore = m.length; payId = id; }
    });
    if (payId) { actions.push(act('select_payment', payId, payScore)); score += payScore; }

    /* 9. 提交（高危：只是把确认窗叫出来，仍要本人点或本人说确认） */
    var hitSubmit = group('submit') || (group('finish') && st.step === 4 ? '确认' : '');
    if (hitSubmit) {
      actions.push({ kind: 'cap', id: 'submit_booking', params: {}, steps: STEP_GUARD.submit_booking, score: 5 });
      score += 5;
    }
    if (group('finish') && st.step === 5) { actions.push(nav('home', 4)); score += 4; }

    if (!actions.length) return { intent: 'unknown', actions: [], score: 0 };
    return { intent: 'act', actions: actions, score: score };
  }

  /* ---------------- 执行：只走能力清单与导航白名单 ---------------- */
  function nameOf(kind, id) {
    var list = (X.options()[kind] || []);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name;
    return '';
  }
  function missingText() {
    var st = X.getState();
    if (!st.symptom) return T('dialog.needSymptom');
    if (!st.doctor) return T('dialog.needDoctor');
    if (!st.date) return T('dialog.needDate');
    if (!st.slot) return T('dialog.needSlot');
    if (!st.pay) return T('dialog.needPay');
    return '';
  }
  function replyOf(a, after) {
    switch (a.id) {
      case 'select_symptom': return T('ai.didSymptom', { symptom: nameOf('symptoms', a.params.value), dept: after.deptName });
      case 'select_department': return T('ai.didDept', { dept: after.deptName });
      case 'select_doctor': return T('ai.didDoctor', { doctor: after.doctorName });
      case 'select_date': return T('ai.didDate', { date: nameOf('dates', a.params.value) });
      case 'select_slot': return T('ai.didSlot', { slot: nameOf('slots', a.params.value) });
      case 'select_patient': return T('ai.didPatient', { patient: nameOf('patients', a.params.value) });
      case 'select_payment': return T('ai.didPay', { pay: nameOf('pays', a.params.value) });
      case 'submit_booking': return T('ai.confirmed', { no: after.ticketNo });
      default: return '';
    }
  }

  function runActions(actions) {
    var lines = [];
    for (var i = 0; i < actions.length; i++) {
      var a = actions[i];
      if (a.kind === 'closeConfirm') { X.nav('closeModal'); lines.push(T('ai.cancelBooking')); continue; }
      if (a.nav === 'noop') { lines.push(T('ai.didStart')); continue; }
      if (a.kind === 'nav') {
        if (NAV_WHITE.indexOf(a.nav) < 0 || !X.nav(a.nav)) { lines.push(T('ai.wrongStep')); break; }
        continue;
      }
      var st = X.getState();
      if (a.steps && a.steps.indexOf(st.step) < 0) { lines.push(T('ai.wrongStep')); break; }
      var r = X.call(a.id, a.params || {});
      if (!r.ok) {
        if (r.reason === 'slot_full') lines.push(T('ai.slotFull'));
        else if (r.reason === 'incomplete') lines.push(T('ai.incomplete', { what: missingText() }));
        else if (r.reason === 'need_confirm') { X.nav('confirm'); lines.push(T('ai.needConfirm')); }
        else lines.push(T('ai.guard'));
        break;
      }
      var line = replyOf(a, r.state || X.getState());
      if (line) lines.push(line);
    }
    return lines;
  }

  /* ---------------- 界面：悬浮按钮 + 对话面板 ---------------- */
  var wrap = document.createElement('div');
  wrap.innerHTML =
    '<div class="ai" id="ai-panel" hidden>' +
      '<div class="ai__mask" data-ai-close="1"></div>' +
      '<div class="ai__box" role="dialog" aria-modal="true" aria-labelledby="ai-title">' +
        '<div class="ai__head">' +
          '<span class="ai__mark" aria-hidden="true">鱼</span>' +
          '<div class="ai__headtext">' +
            '<h2 class="ai__title" id="ai-title"></h2>' +
            '<p class="ai__status" id="ai-status"></p>' +
          '</div>' +
          '<button type="button" class="ai__x" id="ai-close"></button>' +
        '</div>' +
        '<div class="ai__log" id="ai-log" role="log" aria-live="polite"></div>' +
        '<div class="ai__row">' +
          '<button type="button" class="ai__mic" id="ai-mic" data-state="off">' +
            '<span class="ai__ring" aria-hidden="true"></span>' +
            '<span id="ai-mic-label"></span>' +
          '</button>' +
          '<button type="button" class="ai__cancel" id="ai-cancel" hidden></button>' +
        '</div>' +
        '<p class="ai__chiplabel" id="ai-chiplabel"></p>' +
        '<div class="ai__chips" id="ai-chips"></div>' +
      '</div>' +
    '</div>' +
    '<button type="button" class="aifab" id="aifab" aria-haspopup="dialog">' +
      '<span class="aifab__mark" aria-hidden="true">鱼</span>' +
      '<span class="aifab__text" id="aifab-text"></span>' +
    '</button>';
  document.body.appendChild(wrap);

  var panel = document.getElementById('ai-panel');
  var logBox = document.getElementById('ai-log');
  var mic = document.getElementById('ai-mic');
  var micLabel = document.getElementById('ai-mic-label');
  var cancelBtn = document.getElementById('ai-cancel');
  var statusEl = document.getElementById('ai-status');
  var chipsBox = document.getElementById('ai-chips');
  var fab = document.getElementById('aifab');

  function bubble(who, text) {
    if (!text) return;
    var b = document.createElement('div');
    b.className = 'ai__bubble ai__bubble--' + who;
    b.textContent = text;
    logBox.appendChild(b);
    try { logBox.scrollTop = logBox.scrollHeight; } catch (e) { /* 忽略 */ }
  }
  function setStatus(text) { statusEl.textContent = text || ''; }

  /* 常说的话：既是降级方案，也是给老人看的示例 */
  function chipList() {
    var st = X.getState(), opt = X.options(), list = [];
    if (st.step === 0) list.push(T('chip.start'));
    if (st.step === 1) opt.symptoms.slice(0, 5).forEach(function (s) { list.push(T('chip.symptom', { name: s.name })); });
    if (st.step === 2) { list.push(T('chip.firstDoctor'), T('chip.secondDoctor'), T('chip.chief')); }
    if (st.step === 3) { list.push(T('chip.today'), T('chip.tomorrow'), T('chip.am'), T('chip.pm')); }
    if (st.step === 4) { opt.pays.forEach(function (p) { list.push(T('chip.pay', { name: p.name })); }); list.push(T('chip.confirm')); }
    if (st.step === 5) { list.push(T('chip.again'), T('chip.done')); }
    list.push(T('chip.read'));
    if (st.step > 0 && st.step < 5) list.push(T('chip.prev'));
    if (st.step > 0 && st.step < 4) list.push(T('chip.next'));
    return list;
  }

  function renderChips() {
    chipsBox.innerHTML = '';
    chipList().forEach(function (text) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = text;
      b.addEventListener('click', function () { hear(text); });
      chipsBox.appendChild(b);
    });
  }

  function renderTexts() {
    document.getElementById('ai-title').textContent = T('ai.title');
    document.getElementById('ai-chiplabel').textContent = T('ai.chips');
    document.getElementById('aifab-text').textContent = T('ai.fab');
    document.getElementById('ai-close').textContent = T('ai.close');
    cancelBtn.textContent = T('ai.stopListen');
    if (listening) { micLabel.textContent = T('ai.listening'); setStatus(T('ai.listening')); }
    else { micLabel.textContent = T('ai.talk'); if (!statusEl.textContent) setStatus(T('ai.sub')); }
    if (!SR) mic.hidden = true;
  }

  var greeted = false;
  function open() {
    panel.hidden = false;
    document.body.classList.add('ai-open');
    renderTexts();
    renderChips();
    if (!greeted) {
      greeted = true;
      bubble('ai', T('ai.hello'));
      X.speak(T('ai.hello'));
    }
    setStatus(T('ai.sub'));
    if (SR) { try { mic.focus(); } catch (e) {} }
    else { bubble('ai', T('ai.unsupported')); var c = chipsBox.querySelector('.chip'); if (c) c.focus(); }
  }
  function close() {
    stopListen();
    panel.hidden = true;
    document.body.classList.remove('ai-open');
  }
  function toggle() { if (panel.hidden) open(); else close(); }

  fab.addEventListener('click', open);
  var inlineOpen = document.getElementById('ai-inline-open');
  if (inlineOpen) inlineOpen.addEventListener('click', open);
  document.getElementById('ai-close').addEventListener('click', close);
  panel.addEventListener('click', function (ev) {
    var el = ev.target;
    if (el && el.getAttribute && el.getAttribute('data-ai-close')) close();
  });
  panel.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { close(); return; }
    if (ev.key !== 'Tab') return;
    var items = panel.querySelectorAll('button:not([disabled])');
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });

  /* ---------------- 语音识别 ---------------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var SPEECH_LANG = { zh: 'zh-CN', 'zh-Hant': 'zh-TW', en: 'en-US' };
  var rec = null, listening = false, lastEngine = 'rule', planner = null;

  function ensureRec() {
    if (rec || !SR) return rec;
    rec = new SR();
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    rec.onstart = function () { /* 等结果 */ };
    rec.onresult = function (ev) {
      var finals = [], interims = [];
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var r = ev.results[i];
        for (var j = 0; j < r.length; j++) {
          if (r.isFinal) finals.push(r[j].transcript);
          else interims.push(r[j].transcript);
        }
      }
      if (interims.length) setStatus(T('ai.hear') + interims[0]);
      if (!finals.length) return;
      /* 识别引擎给的多个候选里，挑「最说得通」的那个再执行 */
      var best = null;
      finals.forEach(function (txt) {
        var u = understand(txt);
        if (!u.actions.length && u.intent !== 'ask' && u.intent !== 'status') return;
        if (!best || u.score > best.u.score) best = { txt: txt, u: u };
      });
      var chosen = best ? best.txt : finals[0];
      stopListen();
      hear(chosen, best ? best.u : null);
    };
    rec.onerror = function (ev) {
      var code = ev && ev.error;
      var key = code === 'not-allowed' || code === 'service-not-allowed' || code === 'audio-capture' ? 'ai.denied'
        : code === 'no-speech' ? 'ai.noSpeech'
        : code === 'network' ? 'ai.netErr' : '';
      listening = false;
      mic.setAttribute('data-state', 'off');
      cancelBtn.hidden = true;
      micLabel.textContent = T('ai.talk');
      if (key) { setStatus(T(key)); bubble('ai', T(key)); }
    };
    rec.onend = function () {
      if (!listening) return;
      listening = false;
      mic.setAttribute('data-state', 'off');
      cancelBtn.hidden = true;
      micLabel.textContent = T('ai.talk');
      if (!statusEl.textContent || statusEl.textContent.indexOf(T('ai.hear')) === 0) setStatus(T('ai.sub'));
    };
    return rec;
  }

  function startListen() {
    if (!SR) { setStatus(T('ai.unsupported')); bubble('ai', T('ai.unsupported')); return; }
    X.stopSpeak();
    var r = ensureRec();
    if (!r) return;
    r.lang = SPEECH_LANG[X.getState().lang] || 'zh-CN';
    listening = true;
    mic.setAttribute('data-state', 'on');
    cancelBtn.hidden = false;
    micLabel.textContent = T('ai.listening');
    setStatus(T('ai.listening'));
    try { r.start(); } catch (e) { /* 已经在听，忽略 */ }
  }
  function stopListen() {
    listening = false;
    if (mic) mic.setAttribute('data-state', 'off');
    if (cancelBtn) cancelBtn.hidden = true;
    if (micLabel) micLabel.textContent = T('ai.talk');
    try { if (rec) rec.abort(); } catch (e) { /* 忽略 */ }
  }

  mic.addEventListener('click', function () { if (listening) stopListen(); else startListen(); });
  cancelBtn.addEventListener('click', stopListen);

  /* ---------------- 一句话进来 → 执行 → 回话 ---------------- */
  function setPlanner(fn) { planner = typeof fn === 'function' ? fn : null; }

  function normalizePlannerActions(list) {
    var capIds = X.capabilities.map(function (c) { return c.id; });
    var out = [];
    (list || []).forEach(function (a) {
      if (!a) return;
      if (a.nav && NAV_WHITE.indexOf(a.nav) >= 0) { out.push({ kind: 'nav', nav: a.nav, score: 9 }); return; }
      if (a.id && capIds.indexOf(a.id) >= 0) {
        out.push({ kind: 'cap', id: a.id, params: a.params || {}, steps: STEP_GUARD[a.id], score: 9 });
      }
    });
    return out;
  }

  function resolve(text) {
    if (planner) {
      try {
        var out = planner(text, { state: X.getState(), options: X.options(), capabilities: X.capabilities });
        return Promise.resolve(out).then(function (o) {
          var acts = normalizePlannerActions(o && o.actions);
          if (acts.length) { lastEngine = 'llm'; return { intent: 'act', actions: acts, reply: (o && o.reply) || '', score: 99 }; }
          lastEngine = 'rule';
          return understand(text);
        }).catch(function () { lastEngine = 'rule'; return understand(text); });
      } catch (e) { /* 大模型出错 → 规则引擎接管 */ }
    }
    lastEngine = 'rule';
    return Promise.resolve(understand(text));
  }

  function hear(text, known) {
    return (known ? Promise.resolve(known) : resolve(text)).then(function (u) {
      bubble('me', text);
      if (!u || u.intent === 'empty') { bubble('ai', T('ai.noSpeech')); return u; }
      var lines = runActions(u.actions || []);
      if (u.reply && !lines.length) lines.push(u.reply);
      var reply = lines.filter(Boolean).join('。');
      if (!reply && u.intent === 'unknown') reply = T('ai.unknown');
      if (reply) {
        bubble('ai', reply);
        /* 念一遍 / 上一步 / 帮助 这些动作页面自己会播报，别把它的声音盖掉 */
        if (!SILENT[u.intent]) X.speak(reply);
      }
      setStatus(T('ai.sub'));
      renderChips();
      return u;
    });
  }
  var SILENT = { read: 1, stop: 1, help: 1, next: 1, prev: 1, restart: 1, finish: 1, confirm_no: 1 };

  /* ---------------- 跟随界面语言与步骤 ---------------- */
  X.onRender(function () {
    renderTexts();
    if (!panel.hidden) renderChips();
  });

  renderTexts();
  renderChips();
  X.setLanguage(X.getState().lang); // 触发一次重绘，把助手注册进来的文案刷到页面上

  window.XiaoYuErAI = {
    version: '1.0.0',
    supported: !!SR,
    open: open,
    close: close,
    toggle: toggle,
    startListen: startListen,
    stopListen: stopListen,
    isListening: function () { return listening; },
    /* 把一句话当成「听到的话」灌进来：自检与后续接大模型都走这里 */
    say: hear,
    understand: understand,
    chipList: chipList,
    setPlanner: setPlanner,
    engine: function () { return lastEngine; }
  };
})();
</script>
</body>
</html>
