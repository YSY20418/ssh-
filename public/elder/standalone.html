    micStateEl.setAttribute('data-state', micStateNow);
  }
  function refreshMicState() {
    var OS = offline();
    if (!OS || !OS.micState) { renderMicState('unknown'); return; }
    Promise.resolve(OS.micState()).then(renderMicState).catch(function () { renderMicState('unknown'); });
  }
  /* 失败时把"怎么打开"摆出来；step 参数让"被拦住"类失败自动展开 */
  function showHowTo(show) {
    if (!howtoBox) return;
    howtoBox.hidden = !show;
    if (show) {
      document.getElementById('ai-mic-howto-title').textContent = T('ai.micHowTo');
      document.getElementById('ai-mic-step1').textContent = T('ai.micStep1');
      document.getElementById('ai-mic-step2').textContent = T('ai.micStep2');
      document.getElementById('ai-mic-step3').textContent = T('ai.micStep3');
      micRetryBtn.textContent = T('ai.micRetry');
    }
  }
  /* 按错误码说人话：每种原因一句话，且都保留"点下面的话"这条退路 */
  function sayMicFail(code) {
    if (code === 'denied') { say('ai.micDenied'); }
    else if (code === 'no-device') { say('ai.micNoDevice'); }
    else if (code === 'busy') { say('ai.micBusy'); }
    else if (code === 'insecure') { say('ai.micInsecure'); }
    else { say('ai.startFail'); }
  }

  /* 常说的话：既是降级方案，也是给老人看的示例 */
  function chipList() {
    var st = X.getState(), opt = X.options(), list = [];
    if (st.step === 0) list.push(T('chip.start'));
    if (st.step === 1) opt.symptoms.slice(0, 5).forEach(function (s) { list.push(T('chip.symptom', { name: s.name })); });
    if (st.step === 2) { list.push(T('chip.firstDoctor'), T('chip.secondDoctor'), T('chip.chief')); }
    if (st.step === 3) { list.push(T('chip.today'), T('chip.tomorrow'), T('chip.am'), T('chip.pm')); }
    if (st.step === 4) { opt.pays.forEach(function (p) { list.push(T('chip.pay', { name: p.name })); }); list.push(T('chip.confirm')); }
    if (st.step === 5) { list.push(T('chip.again'), T('chip.done')); }
    list.push(T('chip.read'));
    if (st.step > 0 && st.step < 5) list.push(T('chip.prev'));
    if (st.step > 0 && st.step < 4) list.push(T('chip.next'));
    return list;
  }

  function renderChips() {
    chipsBox.innerHTML = '';
    chipList().forEach(function (text) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = text;
      b.addEventListener('click', function () { hear(text); });
      chipsBox.appendChild(b);
    });
  }

  function renderTexts() {
    document.getElementById('ai-title').textContent = T('ai.title');
    document.getElementById('ai-chiplabel').textContent = T('ai.chips');
    /* 全页只保留一个可移动的悬浮语音模块（小医灵光点）；
       小鱼儿从流程里的入口卡片打开，不再放固定悬浮球。 */
    document.getElementById('ai-close').textContent = T('ai.close');
    cancelBtn.textContent = T('ai.stopListen');
    if (listening) { micLabel.textContent = T('ai.stopListen'); }
    else { micLabel.textContent = T('ai.talk'); }
    /* 麦克风按钮任何时候都不藏起来：老人找不到按钮 = 等于没有这个功能。
       本机识别用不了时，它会引导到「用离线识别」或下面的话。 */
    mic.disabled = false;
    mic.removeAttribute('aria-disabled');
    renderMicState();
    refreshMicState();
    renderOffline();
  }

  /* 「用离线识别」入口：本机识别还能装、或还没装好时出现。
     云端识别失败会把它强制摆出来（offlineHint）—— 这正是老人最需要的那一步。 */
  var offlineHint = false;
  function renderOffline() {
    if (!offBox) return;
    var OS = offline();
    var can = !!(OS && OS.supported());
    var st = OS ? String(OS.state()) : '';
    /* 已经装好就收起引导 —— 麦克风直接能用，不必再占地方 */
    var show = can && st !== 'ready' && !(OS && OS.ready());
    offBox.hidden = !show;
    if (!show) return;
    offBox.setAttribute('data-state', st === 'loading' ? 'loading' : 'idle');
    if (st === 'loading') {
      offBtn.textContent = T('ai.offlineLoading');
      offBtn.disabled = true;
    } else {
      offBtn.textContent = T('ai.offlineBtn');
      offBtn.disabled = false;
    }
    offNote.textContent = T('ai.offlineNote');
  }

  /* 之前装过离线识别的话，这次打开就不用再下载了：
     静默从本机缓存把它装配起来，老人第二次来点麦克风就直接能听。 */
  var cacheProbed = false;
  function autoLoadOffline() {
    var OS = offline();
    if (!OS || !OS.supported() || OS.ready() || OS.state() === 'loading' || cacheProbed) {
      return Promise.resolve(false);
    }
    cacheProbed = true;
    return Promise.resolve(OS.cached()).then(function (hit) {
      if (!hit || OS.ready()) return false;
      setStatus(T('ai.offlinePreparing'));
      renderOffline();
      return OS.prepare(function (pct) { setStatus(T('ai.offlineDown', { pct: pct })); }).then(function () {
        offlineHint = false;
        say('ai.offlineOk');
        micLabel.textContent = T('ai.talk');
        return true;
      });
    }).catch(function () { return false; /* 没装过 / 探测失败：等老人自己点「用离线识别」 */ })
      .then(function (r) { renderOffline(); return r; });
  }

  var greeted = false;
  /* autostart：点悬浮按钮就直接开始听 —— 老人的预期是"点一下就开始说"，
     而不是"点一下、再点一下、再说"。 */
  function open(autostart) {
    panel.hidden = false;
    document.body.classList.add('ai-open');
    renderTexts();
    renderChips();
    if (!greeted) {
      greeted = true;
      bubble('ai', T('ai.hello'));
      X.speak(T('ai.hello'));
    }
    setStatus(T('ai.sub'));
    if (autostart) {
      /* 这台设备要是装过离线识别，先把它从本机缓存装配好再开始听 ——
         不然老人会碰上"第一次点了没反应、第二次才行"，那正是最劝退的体验。 */
      autoLoadOffline().then(function () { startListen(); });
    } else {
      autoLoadOffline();
      try { mic.focus(); } catch (e) { /* 忽略 */ }
    }
  }
  function close() {
    stopListen();
    panel.hidden = true;
    document.body.classList.remove('ai-open');
  }
  function toggle() { if (panel.hidden) open(true); else close(); }

  /* 点入口卡片（流程里那张「小鱼兒」卡）打开；不再有固定悬浮球——
     全页只留小医灵那一个可移动的悬浮语音模块。 */
  var inlineOpen = document.getElementById('ai-inline-open');
  if (inlineOpen) inlineOpen.addEventListener('click', function () { open(true); });
  document.getElementById('ai-close').addEventListener('click', close);
  panel.addEventListener('click', function (ev) {
    var el = ev.target;
    if (el && el.getAttribute && el.getAttribute('data-ai-close')) close();
  });
  panel.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { close(); return; }
    if (ev.key !== 'Tab') return;
    var items = panel.querySelectorAll('button:not([disabled])');
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });
  /* Esc 不依赖焦点（与小医灵一致）：焦点不在面板里也要能关 */
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape' || panel.hidden) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;
    close();
  });

  /* ---------------- 语音识别（两条链路，谁可用用谁） ----------------
     ① 离线引擎 window.XiaoYuErSpeech：模型装在浏览器里，断网也能听，
        声音不出设备。装过一次就一直在。
     ② 浏览器自带 SpeechRecognition：把音频送到云端识别，国内网络
        基本连不上，所以它只是「备用」。
     两条都不可用 → 说清楚为什么，并把注意力引到「常说的话」点选上。

     老人的体验底线：点了必须有回应。所以每个出口都会给一句明确的话，
     并且有一个「迟迟没结果」的上限计时，绝不让页面静默地杵在那里。
     listening: false | 'cloud' | 'offline' */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var SPEECH_LANG = { zh: 'zh-CN', 'zh-Hant': 'zh-TW', en: 'en-US' };
  var rec = null, listening = false, lastEngine = 'rule', planner = null;
  /* 助手上一句说的话：「再说一遍」时原样奉还，也方便自检核对 */
  var lastReply = '';
  var watchdog = null, offlineRun = 0;

  function offline() { return window.XiaoYuErSpeech || null; }

  function micIdle() {
    if (mic) mic.setAttribute('data-state', 'off');
    if (cancelBtn) cancelBtn.hidden = true;
    if (micLabel) micLabel.textContent = T('ai.talk');
    /* 每次停下来都重新读一次权限：老人可能刚在浏览器里改过设置 */
    refreshMicState();
  }
  function focusChip() {
    var c = chipsBox.querySelector('.chip');
    if (c) { try { c.focus(); } catch (e) { /* 忽略 */ } }
  }
  function clearWatchdog() { if (watchdog) { clearTimeout(watchdog); watchdog = null; } }
  /* 兜底计时：开始听之后一直没结果，就明确告诉老人，而不是干等 */
  function armWatchdog(ms) {
    clearWatchdog();
    watchdog = setTimeout(function () {
      watchdog = null;
      if (!listening) return;
      var was = listening;
      stopListen();
      setStatus(T('ai.silent'));
      bubble('ai', T('ai.silent'));
      if (was === 'cloud') { offlineHint = true; renderOffline(); }
      focusChip();
    }, ms);
  }
  function say(key) { setStatus(T(key)); bubble('ai', T(key)); }

  function ensureRec() {
    if (rec || !SR) return rec;
    rec = new SR();
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    rec.onstart = function () { armWatchdog(15000); refreshMicState(); };
    rec.onresult = function (ev) {
      var finals = [], interims = [];
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var r = ev.results[i];
        for (var j = 0; j < r.length; j++) {
          if (r.isFinal) finals.push(r[j].transcript);
          else interims.push(r[j].transcript);
        }
      }
      if (interims.length) { clearWatchdog(); setStatus(T('ai.hear') + interims[0]); }
      if (!finals.length) return;
      /* 识别引擎给的多个候选里，挑「最说得通」的那个再执行 */
      var best = null;
      finals.forEach(function (txt) {
        var u = understand(txt);
        if (!u.actions.length && u.intent !== 'ask' && u.intent !== 'status') return;
        if (!best || u.score > best.u.score) best = { txt: txt, u: u };
      });
      var chosen = best ? best.txt : finals[0];
      stopListen();
      hear(chosen, best ? best.u : null);
    };
    rec.onerror = function (ev) {
      var code = ev && ev.error;
      /* 权限被拦：和离线链路用同一套话术 + 指引，两条路给老人的答案必须一致 */
      var denied = code === 'not-allowed' || code === 'service-not-allowed' || code === 'audio-capture';
      var key = denied ? 'ai.micDenied'
        : code === 'no-speech' ? 'ai.noSpeech'
        : code === 'network' ? 'ai.netErr' : '';
      listening = false;
      clearWatchdog();
      micIdle();
      /* 麦克风被拦住时，把状态行与恢复指引一并摆出来（并刷新一次真实状态） */
      if (denied) {
        refreshMicState();
        showHowTo(true);
      }
      /* 云端这条路走不通时，把「用离线识别」摆到老人眼前 */
      if (code === 'network' || code === 'not-allowed' || code === 'service-not-allowed' ||
          code === 'audio-capture') { offlineHint = true; renderOffline(); }
      if (key) { say(key); focusChip(); }
    };
    rec.onend = function () {
      if (!listening) return;
      clearWatchdog();
      var quiet = !statusEl.textContent || statusEl.textContent.indexOf(T('ai.hear')) === 0;
      listening = false;
      micIdle();
      /* 开始听了却什么都没回来：这正是不明所以的"点了没反应"，说清楚 */
      if (quiet) { say('ai.silent'); focusChip(); }
    };
    return rec;
  }

  /* ---------------- 链路②：本机离线识别 ---------------- */
  function startOfflineListen() {
    var OS = offline();
    if (!OS || !OS.ready()) return false;
    X.stopSpeak();
    clearWatchdog();
    var my = ++offlineRun;
    listening = 'offline';
    mic.setAttribute('data-state', 'on');
    cancelBtn.hidden = false;
    micLabel.textContent = T('ai.listening');
    setStatus(T('ai.recording'));
    var lang = X.getState().lang;
    Promise.resolve(OS.listen({
      language: lang === 'en' ? 'en' : 'zh',
      onTick: function (phase) {
        if (my !== offlineRun) return;
        if (phase === 'listening') setStatus(T('ai.recording'));
        else if (phase === 'recognizing') setStatus(T('ai.recognizing'));
      }
    })).then(function (text) {
      if (my !== offlineRun) return;
      listening = false;
      clearWatchdog();
      micIdle();
      if (!text) { say('ai.silent'); focusChip(); return; }
      hear(text);
    }).catch(function (err) {
      if (my !== offlineRun) return;
      listening = false;
      clearWatchdog();
      micIdle();
      /* 麦克风打不开：按真实错误码说清楚是哪回事，并给出恢复指引。
         以前这里只说"请再点一次"——权限被拦住时再点一百次也没用，老人会被困死。 */
      var code = (err && err.code) || 'unknown';
      sayMicFail(code);
      if (code === 'denied') {
        refreshMicState();
        showHowTo(true);
        offlineHint = true;
        renderOffline();
      }
      focusChip();
    });
    armWatchdog(25000);
    return true;
  }

  /* ---------------- 链路①：浏览器自带（云端）识别 ---------------- */
  function startListen() {
    if (listening) return;
    X.stopSpeak();
    var OS = offline();
    /* 离线引擎已就绪 → 优先用它：不联网也能听，声音也不送出去 */
    if (OS && OS.ready()) { startOfflineListen(); return; }
    if (!SR) {
      var canInstall = !!(OS && OS.supported());
      say(canInstall ? 'ai.noEngine' : 'ai.unsupported');
      offlineHint = canInstall;
      renderOffline();
      focusChip();
      return;
    }
    var r = ensureRec();
    if (!r) return;
    rec.lang = SPEECH_LANG[X.getState().lang] || 'zh-CN';
    listening = 'cloud';
    mic.setAttribute('data-state', 'on');
    cancelBtn.hidden = false;
    micLabel.textContent = T('ai.listening');
    setStatus(T('ai.listening'));
    try {
      r.start();
    } catch (e) {
      /* 有的浏览器 start() 会直接抛：不能装作没事 */
      listening = false;
      clearWatchdog();
      micIdle();
      say('ai.startFail');
      offlineHint = true;
      renderOffline();
      focusChip();
      return;
    }
    armWatchdog(12000);
  }

  function stopListen() {
    var was = listening;
    listening = false;
    offlineRun++;                 // 让正在等待的那次离线识别结果失效
    clearWatchdog();
    micIdle();
    /* 主动停下就走回待办提示，别让"正在听您说…"挂在那里骗人 */
    if (was) setStatus(T('ai.sub'));
    if (was === 'offline') {
      var OS = offline();
      if (OS) { try { OS.stop(); } catch (e) { /* 忽略 */ } }
    } else if (was) {
      try { if (rec) rec.abort(); } catch (e2) { /* 忽略 */ }
    }
  }

  /* ---------------- 「用离线识别」：下载并装配 ---------------- */
  function prepareOffline() {
    var OS = offline();
    if (!OS || !OS.supported()) return Promise.reject(new Error('不支持'));
    if (OS.ready()) return Promise.resolve(true);
    offBtn.disabled = true;
    offBtn.textContent = T('ai.offlineLoading');
    setStatus(T('ai.offlineDown', { pct: 0 }));
    bubble('ai', T('ai.offlineNote'));
    return Promise.resolve(OS.prepare(function (pct) {
      setStatus(T('ai.offlineDown', { pct: pct }));
      offBtn.textContent = T('ai.offlineLoading') + ' ' + pct + '%';
    })).then(function () {
      offlineHint = false;
      say('ai.offlineOk');
      X.speak(T('ai.offlineOk'));
      renderTexts();
      startOfflineListen();
      return true;
    }).catch(function (err) {
      say('ai.offlineFail');
      focusChip();
      offBtn.disabled = false;
      offBtn.textContent = T('ai.offlineBtn');
      throw err;
    });
  }

  if (offBtn) offBtn.addEventListener('click', function () {
    /* 云端还在听的时候点「用离线识别」也要有反应：先停掉，再装 */
    if (listening) stopListen();
    prepareOffline().catch(function () { /* 已提示过，不抛到控制台 */ });
  });

  /* 「再试一次麦克风」：看完指引回来点一下。
     有些浏览器（Chrome/Edge）在用户手动改过设置后，重新调 getUserMedia 就能直接拿到权限，
     所以这个按钮是真的去试，不是摆设。 */
  if (micRetryBtn) micRetryBtn.addEventListener('click', function () {
    showHowTo(false);
    if (listening) stopListen();
    refreshMicState();
    startListen();
  });

  mic.addEventListener('click', function () { if (listening) stopListen(); else startListen(); });
  cancelBtn.addEventListener('click', stopListen);

  /* ---------------- 一句话进来 → 执行 → 回话 ---------------- */
  function setPlanner(fn) { planner = typeof fn === 'function' ? fn : null; }

  function normalizePlannerActions(list) {
    var capIds = X.capabilities.map(function (c) { return c.id; });
    var out = [];
    (list || []).forEach(function (a) {
      if (!a) return;
      if (a.nav && NAV_WHITE.indexOf(a.nav) >= 0) { out.push({ kind: 'nav', nav: a.nav, score: 9 }); return; }
      if (a.id && capIds.indexOf(a.id) >= 0) {
        out.push({ kind: 'cap', id: a.id, params: a.params || {}, steps: STEP_GUARD[a.id], score: 9 });
      }
    });
    return out;
  }

  function resolve(text) {
    if (planner) {
      try {
        var out = planner(text, { state: X.getState(), options: X.options(), capabilities: X.capabilities });
        return Promise.resolve(out).then(function (o) {
          var acts = normalizePlannerActions(o && o.actions);
          if (acts.length) { lastEngine = 'llm'; return { intent: 'act', actions: acts, reply: (o && o.reply) || '', score: 99 }; }
          lastEngine = 'rule';
          return understand(text);
        }).catch(function () { lastEngine = 'rule'; return understand(text); });
      } catch (e) { /* 大模型出错 → 规则引擎接管 */ }
    }
    lastEngine = 'rule';
    return Promise.resolve(understand(text));
  }

  function hear(text, known) {
    return (known ? Promise.resolve(known) : resolve(text)).then(function (u) {
      bubble('me', text);
      if (!u || u.intent === 'empty') { bubble('ai', T('ai.noSpeech')); return u; }
      /* 一两个字的"识别结果"基本是环境音被听成了「好」「嗯」这种。
         这不是老人说的话，既不该拿去执行，也不该回"没听明白"——
         那会让老人以为自己说错了。直接按"没听到"请他再说一次。 */
      var bare = String(text || '').replace(/[\s，。、！？,.!?]/g, '');
      if (u.intent === 'unknown' && bare.length <= 2) {
        bubble('ai', T('ai.silent'));
        setStatus(T('ai.silent'));
        renderChips();
        return u;
      }
      var lines = runActions(u.actions || []);
      if (u.reply && !lines.length) lines.push(u.reply);
      var reply = lines.filter(Boolean).join('。');
      if (!reply && u.intent === 'unknown') reply = T('ai.unknown');
      if (reply) {
        bubble('ai', reply);
        lastReply = reply;
        /* 念一遍 / 上一步 / 帮助 这些动作页面自己会播报，别把它的声音盖掉 */
        if (!SILENT[u.intent]) X.speak(reply);
      }
      setStatus(T('ai.sub'));
      renderChips();
      return u;
    });
  }
  var SILENT = { read: 1, stop: 1, help: 1, next: 1, prev: 1, restart: 1, finish: 1, confirm_no: 1 };

  /* ---------------- 跟随界面语言与步骤 ---------------- */
  X.onRender(function () {
    renderTexts();
    if (!panel.hidden) renderChips();
  });

  renderTexts();
  renderChips();
  X.setLanguage(X.getState().lang); // 触发一次重绘，把助手注册进来的文案刷到页面上

  window.XiaoYuErAI = {
    version: '1.3.0',
    supported: !!SR,
    open: open,
    close: close,
    toggle: toggle,
    startListen: startListen,
    stopListen: stopListen,
    isListening: function () { return !!listening; },
    /* 两条识别链路的状态，供界面提示与自检使用 */
    engine: function () { return lastEngine; },
    listenPath: function () { return listening || 'idle'; },
    /* 麦克风权限状态（granted / denied / prompt / unknown），供自检与界面显示 */
    micState: function () { return micStateNow; },
    showHowTo: showHowTo,
    /* 本地对话语料库的状态与规模，供界面与自检使用 */
    corpus: {
      loaded: function () { return !!(window.XiaoYuErCorpus && window.XiaoYuErCorpus.match); },
      stats: function () {
        var c = window.XiaoYuErCorpus;
        return (c && typeof c.stats === 'function') ? c.stats() : null;
      }
    },
    offline: {
      loaded: function () { return !!offline(); },
      supported: function () { var OS = offline(); return !!(OS && OS.supported()); },
      ready: function () { var OS = offline(); return !!(OS && OS.ready()); },
      prepare: prepareOffline
    },
    /* 把一句话当成「听到的话」灌进来：自检与后续接大模型都走这里 */
    say: hear,
    understand: understand,
    chipList: chipList,
    setPlanner: setPlanner
  };
})();
</script>

,"叫不醒","抽搐","抽風","翻白眼","口吐白沫"],"reply":"暈倒、意識不清、抽搐都需要立刻由醫生判斷原因，耽誤不得。請立即撥打 120；在等人來的時候，讓病人側臥、清理口鼻、不要往嘴裡塞任何東西、不要掐人中。如果是別人在旁邊，請記下發作持續了多久。"},"en":{"patterns":["passed out","fainted","lost consciousness","cannot wake up","having a seizure","convulsions","unresponsive"],"reply":"Fainting, confusion, or seizures need a doctor to find the cause right away. Call 120 now. While waiting, lay the person on their side, keep the mouth clear, put nothing in the mouth, and note how long it lasted."}},{"id":"bleeding","priority":5,"zh":{"patterns":["大出血","流血不止","血止不住","呕血","吐血","黑色大便","黑便","便血","大便带血","大便出血","尿血","咳血","咯血"],"reply":"出血不止、呕血、黑便或便血都可能指向消化道出血这类危险情况，不能在家观察。请立即去急诊或拨打 120；这期间先别吃东西别喝水，保留呕吐物或排泄物的样子给医生看。正在吃阿司匹林、华法林这类药的，一定要告诉医生。"},"zh-Hant":{"patterns":["大出血","流血不止","血止不住","嘔血","吐血","黑色大便","黑便","便血","大便帶血","大便出血","尿血","咳血","咯血"],"reply":"出血不止、嘔血、黑便或便血都可能指向消化道出血這類危險情況，不能在家觀察。請立即去急診或撥打 120；這期間先別吃東西別喝水，保留嘔吐物或排泄物的樣子給醫生看。正在吃阿司匹林、華法林這類藥的，一定要告訴醫生。"},"en":{"patterns":["heavy bleeding","bleeding will not stop","vomiting blood","black stool","blood in stool","blood in urine","coughing up blood"],"reply":"Uncontrolled bleeding, vomiting blood, black stool, or blood in stool can mean dangerous internal bleeding. Go to the ER or call 120 now. Do not eat or drink, and show the doctor what you vomited or passed. Mention blood thinners like aspirin or warfarin."}},{"id":"allergy","priority":6,"zh":{"patterns":["严重过敏","过敏性休克","喉头紧缩","喉咙发紧","喉咙肿了","全身起疹子还喘不上气","皮疹伴呼吸困难","被蜜蜂蜇了之后肿","吃药后全身肿"],"reply":"喉咙发紧、全身肿、喘不上气，可能是会快速恶化的严重过敏反应，请立即拨打 120 或去急诊，一刻都不要等。如果刚刚吃过药、被虫子蜇过、或接触过明显过敏原，把时间和物品说给医生听。不要自己先吃抗过敏药硬扛。"},"zh-Hant":{"patterns":["嚴重過敏","過敏性休克","喉頭緊縮","喉嚨發緊","喉嚨腫了","全身起疹子還喘不上氣","皮疹伴呼吸困難","被蜜蜂蜇了之後腫","吃藥後全身腫"],"reply":"喉嚨發緊、全身腫、喘不上氣，可能是會快速惡化的嚴重過敏反應，請立即撥打 120 或去急診，一刻都不要等。如果剛剛吃過藥、被蟲子蜇過、或接觸過明顯過敏原，把時間和物品說給醫生聽。不要自己先吃抗過敏藥硬扛。"},"en":{"patterns":["severe allergic reaction","anaphylaxis","throat is closing","swollen throat","hives and cannot breathe","swollen after a bee sting","swollen after taking medicine"],"reply":"A tightening throat, swelling, and hard breathing can be a severe allergic reaction that worsens fast. Call 120 or go to the ER now. Tell the doctor about any new medicine, sting, or food. Do not just take antihistamines and wait."}},{"id":"high_fever","priority":7,"zh":{"patterns":["高烧不退","持续高热","发烧超过三天","烧了三天不退","四十度","四十度五","41度","40度","烧到抽搐","退烧药不管用","高烧三天","高烧几天","烧了三天","一直高烧","反复高烧","退烧药也没用","吃了退烧药还烧"],"reply":"持续高烧不退，尤其是吃了退烧药还是压不下来，需要尽快让医生查找原因。请今天就去医院发热门诊或急诊；老人、孩子、孕妇和慢性病患者更不要拖。去医院时把体温记录和正在吃的药带上。"},"zh-Hant":{"patterns":["高燒不退","持續高熱","發燒超過三天","燒了三天不退","四十度","四十度五","41度","40度","燒到抽搐","退燒藥不管用","高燒三天","高燒幾天","燒了三天","一直高燒","反覆高燒","退燒藥也沒用","吃了退燒藥還燒"],"reply":"持續高燒不退，尤其是吃了退燒藥還是壓不下來，需要盡快讓醫生查找原因。請今天就去醫院發熱門診或急診；老人、孩子、孕婦和慢性病患者更不要拖。去醫院時把體溫記錄和正在吃的藥帶上。"},"en":{"patterns":["fever will not go down","high fever for days","fever over three days","41 degrees","40 degrees","fever medicine is not working","high fever for three days","fever keeps coming back","fever medicine is not helping"],"reply":"A fever that stays high, especially when medicine does not bring it down, needs a doctor to find the cause. Go to a fever clinic or the ER today. Bring your temperature record and the medicines you are taking."}},{"id":"pregnancy","priority":8,"zh":{"patterns":["怀孕了肚子痛","怀孕肚子疼","孕期出血","见红了","产后大出血","阴道大出血","怀孕了胸痛","胎动不见了"],"reply":"孕期的腹痛、出血、胸痛都可能是母婴双方的急症，请立即去有产科的急诊，不要等、不要自己用药。去医院时带上产检本，说清楚怀孕多少周、最后一次产检是什么时候。"},"zh-Hant":{"patterns":["懷孕了肚子痛","懷孕肚子疼","孕期出血","見紅了","產後大出血","陰道大出血","懷孕了胸痛","胎動不見了"],"reply":"孕期的腹痛、出血、胸痛都可能是母嬰雙方的急症，請立即去有產科的急診，不要等、不要自己用藥。去醫院時帶上產檢本，說清楚懷孕多少周、最後一次產檢是什麼時候。"},"en":{"patterns":["pregnant and have abdominal pain","pregnant with belly pain","bleeding during pregnancy","heavy bleeding after giving birth","pregnant with chest pain","baby stopped moving"],"reply":"Belly pain, bleeding, or chest pain during pregnancy can endanger both you and the baby. Go to an ER with obstetrics now. Bring your maternity record and say how many weeks along you are."}},{"id":"child","priority":9,"zh":{"patterns":["孩子惊厥","小孩抽搐","婴儿抽搐","孩子抽风","孩子叫不醒","婴儿精神差","孩子嘴唇发紫","小孩喘不过气"],"reply":"孩子抽搐、叫不醒、嘴唇发紫，请立即拨打 120 或直奔儿科急诊。发作时让孩子侧卧、不要往嘴里塞东西、记录开始和结束的时间；精神特别差、不肯吃奶、尿量明显减少也要尽快就医。"},"zh-Hant":{"patterns":["孩子驚厥","小孩抽搐","嬰兒抽搐","孩子抽風","孩子叫不醒","嬰兒精神差","孩子嘴唇發紫","小孩喘不過氣"],"reply":"孩子抽搐、叫不醒、嘴唇發紫，請立即撥打 120 或直奔兒科急診。發作時讓孩子側臥、不要往嘴裡塞東西、記錄開始和結束的時間；精神特別差、不肯吃奶、尿量明顯減少也要盡快就醫。"},"en":{"patterns":["my child has a seizure","child is convulsing","baby is having a fit","child will not wake up","baby seems very weak","child lips turned blue"],"reply":"Seizures, unresponsiveness, or blue lips in a child need emergency care. Call 120 or go to a pediatric ER now. Lay the child on their side, put nothing in the mouth, and time the episode."}},{"id":"selfharm","priority":10,"zh":{"patterns":["想自杀","不想活了","活着没意思","想自残","想伤害自己","割腕","想从楼上跳下去"],"reply":"谢谢您愿意说出来，这很重要。您现在最需要的是有人陪在身边：请马上联系一位信得过的家人或朋友，或拨打当地心理援助热线（如北京 010-82951332、上海 021-12320-5、全国 12355 青少年服务台），情况紧急请直接拨打 120 或去最近的急诊。请把家里可能伤到自己的东西先交给别人保管。"},"zh-Hant":{"patterns":["想自殺","不想活了","活著沒意思","想自殘","想傷害自己","割腕","想從樓上跳下去"],"reply":"謝謝您願意說出來，這很重要。您現在最需要的是有人陪在身邊：請馬上聯繫一位信得過的家人或朋友，或撥打當地心理援助熱線（如北京 010-82951332、上海 021-12320-5、全國 12355 青少年服務台），情況緊急請直接撥打 120 或去最近的急診。請把家裡可能傷到自己的東西先交給別人保管。"},"en":{"patterns":["i want to kill myself","i want to die","do not want to live anymore","i want to hurt myself","thinking about suicide"],"reply":"Thank you for telling me. What you need most right now is a person beside you. Please reach out to someone you trust, or call a local crisis hotline; if you are in immediate danger, call 120 or go to the nearest ER. Ask someone to hold onto anything that could hurt you."}}],"topics":[{"id":"headache","priority":10,"dept":{"zh":"神经内科","zh-Hant":"神經內科","en":"Neurology"},"zh":{"patterns":["头痛","头疼","头很痛","头好痛","脑壳疼","脑袋疼","偏头痛","头一阵一阵疼","两边太阳穴疼","后脑勺疼"],"empathy":"头痛起来真折磨人，我陪您一条一条理清楚，先看看有没有危险信号。","redflagHint":"如果头痛是突然发作、剧烈得从来没有过，或者伴着发烧、呕吐、看东西模糊、一边手脚没力气，请不要继续问我，立即去急诊或拨打 120。","questions":[{"q":"头痛是什么时候开始的？","options":["刚刚开始","今天开始的","已经好几天了","记不清了"]},{"q":"痛起来是什么感觉？","options":["胀胀地痛","一跳一跳地痛","像被勒住","说不上来"]},{"q":"有没有伴着发烧、呕吐，或者看东西模糊？","options":["都没有","有发烧","有呕吐","看东西模糊"]}],"triage":"大多数头痛和没睡好、用脑太久、血压波动、感冒发烧有关，歇一歇、睡一觉能缓解。如果反复发作、越来越痛、影响到睡觉和吃饭，建议近期预约神经内科门诊，带上平时的血压记录。出现上面说的危险信号，请立即去急诊。","edu":"头痛的原因非常多：睡眠不足、疲劳、情绪紧张、血压波动、感冒发烧都可能引起，也有偏头痛这类会反复发作的毛病。到底是哪一种，需要医生结合检查和您的病史来判断，我不能替您下结论。","sources":[{"org":"中华医学会神经病学分会","title":"中国偏头痛诊治指南"},{"org":"英国国家医疗服务体系（NHS）","title":"Headaches 症状说明"}]},"zh-Hant":{"patterns":["頭痛","頭疼","頭很痛","頭好痛","腦殼疼","腦袋疼","偏頭痛","頭一陣一陣疼","兩邊太陽穴疼","後腦勺疼"],"empathy":"頭痛起來真折磨人，我陪您一條一條理清楚，先看看有沒有危險信號。","redflagHint":"如果頭痛是突然發作、劇烈得從來沒有過，或者伴著發燒、嘔吐、看東西模糊、一邊手腳沒力氣，請不要繼續問我，立即去急診或撥打 120。","questions":[{"q":"頭痛是什麼時候開始的？","options":["剛剛開始","今天開始的","已經好幾天了","記不清了"]},{"q":"痛起來是什麼感覺？","options":["脹脹地痛","一跳一跳地痛","像被勒住","說不上來"]},{"q":"有沒有伴著發燒、嘔吐，或者看東西模糊？","options":["都沒有","有發燒","有嘔吐","看東西模糊"]}],"triage":"大多數頭痛和沒睡好、用腦太久、血壓波動、感冒發燒有關，歇一歇、睡一覺能緩解。如果反覆發作、越來越痛、影響到睡覺和吃飯，建議近期預約神經內科門診，帶上平時的血壓記錄。出現上面說的危險信號，請立即去急診。","edu":"頭痛的原因非常多：睡眠不足、疲勞、情緒緊張、血壓波動、感冒發燒都可能引起，也有偏頭痛這類會反覆發作的毛病。到底是哪一種，需要醫生結合檢查和您的病史來判斷，我不能替您下結論。","sources":[{"org":"中華醫學會神經病學分會","title":"中國偏頭痛診治指南"},{"org":"英國國家醫療服務體系（NHS）","title":"Headaches 症狀說明"}]},"en":{"patterns":["headache","my head hurts","head is pounding","migraine","splitting headache"],"empathy":"A headache is miserable. Let me walk through it with you and check for warning signs first.","redflagHint":"If the headache came on suddenly, is the worst you have ever had, or comes with fever, vomiting, blurred vision, or one-sided weakness, stop here and go to the ER or call 120.","questions":[{"q":"When did the headache start?","options":["Just now","Today","Several days ago","Not sure"]},{"q":"What does it feel like?","options":["Pressing or tight","Throbbing","Like a band","Hard to describe"]},{"q":"Any fever, vomiting, or blurred vision with it?","options":["None","Fever","Vomiting","Blurred vision"]}],"triage":"Most headaches are linked to poor sleep, strain, blood-pressure changes, or a cold, and ease with rest. If they keep coming back, get worse, or disturb sleep and meals, book a neurology outpatient visit soon and bring your blood-pressure records. With any warning sign above, go to the ER now.","edu":"Headaches have many causes: lack of sleep, fatigue, stress, blood-pressure swings, colds and fever, and recurring conditions such as migraine. Which one it is needs a doctor's exam and your history. I cannot decide for you.","sources":[{"org":"Chinese Medical Association, Neurology Branch","title":"Chinese guideline for migraine diagnosis and treatment"},{"org":"UK National Health Service (NHS)","title":"Headaches condition page"}]}},{"id":"dizziness","priority":11,"dept":{"zh":"神经内科 / 耳鼻喉科","zh-Hant":"神經內科 / 耳鼻喉科","en":"Neurology / ENT"},"zh":{"patterns":["头晕","头昏","晕乎乎","天旋地转","眩晕","站起来眼黑","站不稳","感觉要摔倒","一动就晕"],"empathy":"头晕起来确实让人不放心，我先把最危险的情况排掉。","redflagHint":"头晕同时伴着胸痛、说话不清楚、一边手脚没力气、剧烈头痛，或者直接晕过去了，请立即拨打 120。","questions":[{"q":"晕起来是天旋地转，还是头昏沉沉？","options":["天旋地转","头昏沉沉","站起来那一下晕","说不上来"]},{"q":"每次晕持续多久？","options":["几秒钟","几分钟","几十分钟以上","一直晕"]},{"q":"有没有伴着耳鸣、听力下降，或者恶心想吐？","options":["都没有","有耳鸣","听力下降","恶心想吐"]}],"triage":"体位变化时短短几秒的眩晕，多数和内耳功能有关；反复发作、伴着耳鸣听力下降，建议预约耳鼻喉科或神经内科门诊，查清原因。晕持续时间长、站不稳、老人独自在家容易摔伤，建议 24 小时内就诊，外出有人陪。","edu":"头晕既可能是内耳平衡器官的问题，也可能和血压、血糖、贫血或脑血管有关，老年人尤其常见。原因不同，治疗完全不同，需要医生做体格检查和必要的化验才能分清。","sources":[{"org":"默沙东诊疗手册（MSD Manual）大众版","title":"头晕"},{"org":"国家卫生健康委员会","title":"老年健康科普服务平台"}]},"zh-Hant":{"patterns":["頭暈","頭昏","暈乎乎","天旋地轉","眩暈","站起來眼黑","站不穩","感覺要摔倒","一動就暈"],"empathy":"頭暈起來確實讓人不放心，我先把最危險的情況排掉。","redflagHint":"頭暈同時伴著胸痛、說話不清楚、一邊手腳沒力氣、劇烈頭痛，或者直接暈過去了，請立即撥打 120。","questions":[{"q":"暈起來是天旋地轉，還是頭昏沉沉？","options":["天旋地轉","頭昏沉沉","站起來那一下暈","說不上來"]},{"q":"每次暈持續多久？","options":["幾秒鐘","幾分鐘","幾十分鐘以上","一直暈"]},{"q":"有沒有伴著耳鳴、聽力下降，或者惡心想吐？","options":["都沒有","有耳鳴","聽力下降","惡心想吐"]}],"triage":"體位變化時短短幾秒的眩暈，多數和內耳功能有關；反覆發作、伴著耳鳴聽力下降，建議預約耳鼻喉科或神經內科門診，查清原因。暈持續時間長、站不穩、老人獨自在家容易摔傷，建議 24 小時內就診，外出有人陪。","edu":"頭暈既可能是內耳平衡器官的問題，也可能和血壓、血糖、貧血或腦血管有關，老年人尤其常見。原因不同，治療完全不同，需要醫生做體格檢查和必要的化驗才能分清。","sources":[{"org":"默沙東診療手冊（MSD Manual）大眾版","title":"頭暈"},{"org":"國家衛生健康委員會","title":"老年健康科普服務平台"}]},"en":{"patterns":["dizzy","dizziness","the room is spinning","lightheaded when i stand up","cannot stand steady"],"empathy":"Dizziness is worrying. Let me rule out the dangerous causes first.","redflagHint":"If dizziness comes with chest pain, slurred speech, one-sided weakness, a severe headache, or fainting, call 120 now.","questions":[{"q":"Is the room spinning, or is your head just heavy?","options":["Room spinning","Head feels heavy","Only when standing","Hard to say"]},{"q":"How long does each episode last?","options":["Seconds","Minutes","Tens of minutes","All the time"]},{"q":"Any ringing in the ears, hearing loss, or nausea?","options":["None","Ringing ears","Hearing loss","Nausea"]}],"triage":"Brief spinning when changing position is often linked to the inner ear. Repeated episodes with ringing or hearing loss should be checked by ENT or neurology. Long episodes or unsteadiness in an older adult risk falls, so aim for a visit within 24 hours and do not go out alone.","edu":"Dizziness can come from the inner ear, or from blood pressure, blood sugar, anemia, or brain blood-vessel problems, and it is common in older adults. The treatments differ completely, so a doctor's exam and tests are needed.","sources":[{"org":"MSD Manual, Consumer Version","title":"Dizziness"},{"org":"National Health Commission of China","title":"Elderly health public-education platform"}]}},{"id":"fever","priority":12,"dept":{"zh":"发热门诊 / 呼吸内科","zh-Hant":"發熱門診 / 呼吸內科","en":"Fever clinic / Respiratory"},"zh":{"patterns":["发热","发烧","身上烫","体温高","发烧了","低烧","反复发烧","怕冷发抖"],"empathy":"发烧最熬人，我陪您看看该怎么办，先问清楚要紧的情况。","redflagHint":"高烧不退、吃了退烧药还是压不下来、喘不上气、意识模糊、抽搐，或者皮肤按压不褪色的小红点，请立即去急诊。","questions":[{"q":"体温大概多少度、烧了几天了？","options":["不到 38 度，一两天","38 到 39 度","39 度以上","好几天了"]},{"q":"除了发烧，还有哪里不舒服？","options":["咳嗽嗓子疼","头痛浑身酸","拉肚子","说不上来"]},{"q":"有没有高血压、糖尿病，或者在吃免疫抑制剂、激素？","options":["都没有","有慢性病","在吃免疫抑制剂","怀孕了"]}],"triage":"低烧一两天、精神还好，可以先多喝水多休息、观察体温变化；38.5 度以上或明显难受，建议 24 小时内到发热门诊就诊。老人、孕妇、慢性病患者和免疫功能差的人，别拖，尽早就医。就医时请戴口罩，说清楚体温记录和接触史。","edu":"发烧本身不是病，是身体在对抗感染或炎症的信号，感冒、流感、新冠、尿路感染等都可能引起。要紧的是找到原因，而不是把体温压下去就当没事，这需要医生判断。","sources":[{"org":"中国疾病预防控制中心","title":"流感等呼吸道传染病防控科普"},{"org":"默沙东诊疗手册（MSD Manual）大众版","title":"发热"}]},"zh-Hant":{"patterns":["發熱","發燒","身上燙","體溫高","發燒了","低燒","反覆發燒","怕冷發抖"],"empathy":"發燒最熬人，我陪您看看該怎麼辦，先問清楚要緊的情況。","redflagHint":"高燒不退、吃了退燒藥還是壓不下來、喘不上氣、意識模糊、抽搐，或者皮膚按壓不褪色的小紅點，請立即去急診。","questions":[{"q":"體溫大概多少度、燒了幾天了？","options":["不到 38 度，一兩天","38 到 39 度","39 度以上","好幾天了"]},{"q":"除了發燒，還有哪裡不舒服？","options":["咳嗽嗓子疼","頭痛渾身酸","拉肚子","說不上來"]},{"q":"有沒有高血壓、糖尿病，或者在吃免疫抑制劑、激素？","options":["都沒有","有慢性病","在吃免疫抑制劑","懷孕了"]}],"triage":"低燒一兩天、精神還好，可以先多喝水多休息、觀察體溫變化；38.5 度以上或明顯難受，建議 24 小時內到發熱門診就診。老人、孕婦、慢性病患者和免疫功能差的人，別拖，盡早就醫。就醫時請戴口罩，說清楚體溫記錄和接觸史。","edu":"發燒本身不是病，是身體在對抗感染或發炎的信號，感冒、流感、新冠、尿路感染等都可能引起。要緊的是找到原因，而不是把體溫壓下去就當沒事，這需要醫生判斷。","sources":[{"org":"中國疾病預防控制中心","title":"流感等呼吸道傳染病防控科普"},{"org":"默沙東診療手冊（MSD Manual）大眾版","title":"發熱"}]},"en":{"patterns":["fever","i have a fever","burning up","high temperature","chills and fever"],"empathy":"Fevers are exhausting. Let me sort out what to do, starting with the urgent parts.","redflagHint":"A fever that stays high despite medicine, hard breathing, confusion, seizures, or a rash that does not fade when pressed needs the ER now.","questions":[{"q":"What is the temperature and for how many days?","options":["Under 38C, 1-2 days","38-39C","Above 39C","Several days"]},{"q":"What else do you feel?","options":["Cough and sore throat","Headache and body aches","Diarrhea","Hard to say"]},{"q":"Any diabetes, high blood pressure, immune-suppressing drugs, or pregnancy?","options":["None","Chronic illness","On immune suppressants","Pregnant"]}],"triage":"A mild fever for a day or two with normal energy can be watched at home with fluids and rest. At 38.5C or higher, or feeling clearly unwell, visit a fever clinic within 24 hours. Older adults, pregnant women, and people with chronic illness should not wait. Wear a mask and bring your temperature record.","edu":"Fever is not a disease itself; it is the body fighting infection or inflammation. Colds, flu, COVID-19, and urinary infections can all cause it. The key is finding the cause, which needs a doctor.","sources":[{"org":"Chinese Center for Disease Control and Prevention","title":"Influenza and respiratory infection prevention"},{"org":"MSD Manual, Consumer Version","title":"Fever"}]}},{"id":"cough","priority":13,"dept":{"zh":"呼吸内科","zh-Hant":"呼吸內科","en":"Respiratory medicine"},"zh":{"patterns":["咳嗽","咳得厉害","老咳嗽","干咳","咳痰","咳黄痰","半夜咳","一咳就停不下来"],"empathy":"咳嗽久了最影响休息，我帮您理一理，先排除要紧的情况。","redflagHint":"咳血、喘不上气、嘴唇发紫、胸痛伴大汗，请立即去急诊。","questions":[{"q":"咳嗽多久了，有痰吗？","options":["几天，没痰","几天，有白痰","超过两周","有黄绿痰"]},{"q":"什么情况下咳得厉害？","options":["夜里平躺时","早上起床时","一遇到冷空气","说不清"]},{"q":"有没有喘不上气、胸痛，或者咳出血？","options":["都没有","有点喘","胸口疼","咳出血了"]}],"triage":"感冒后一两周的咳嗽很常见，注意休息、多喝温水、避开烟雾刺激；超过两周不好、有黄绿痰、发烧反复，建议预约呼吸内科门诊。出现喘不上气、胸痛或咳血，请立即就医。吸烟的人建议借这次机会和医生谈谈戒烟。","edu":"咳嗽是身体的保护反射，感冒、支气管炎、哮喘、过敏、甚至胃食管反流都可能引起，病程不同原因也不同。是否需要拍片、用什么药，必须医生看过才能定。","sources":[{"org":"中华医学会呼吸病学分会","title":"中国咳嗽的诊断与治疗指南"},{"org":"英国国家医疗服务体系（NHS）","title":"Cough 症状说明"}]},"zh-Hant":{"patterns":["咳嗽","咳得厲害","老咳嗽","乾咳","咳痰","咳黃痰","半夜咳","一咳就停不下來"],"empathy":"咳嗽久了最影響休息，我幫您理一理，先排除要緊的情況。","redflagHint":"咳血、喘不上氣、嘴唇發紫、胸痛伴大汗，請立即去急診。","questions":[{"q":"咳嗽多久了，有痰嗎？","options":["幾天，沒痰","幾天，有白痰","超過兩週","有黃綠痰"]},{"q":"什麼情況下咳得厲害？","options":["夜裡平躺時","早上起床時","一遇到冷空氣","說不清"]},{"q":"有沒有喘不上氣、胸痛，或者咳出血？","options":["都沒有","有點喘","胸口疼","咳出血了"]}],"triage":"感冒後一兩週的咳嗽很常見，注意休息、多喝溫水、避開煙霧刺激；超過兩週不好、有黃綠痰、發燒反覆，建議預約呼吸內科門診。出現喘不上氣、胸痛或咳血，請立即就醫。吸煙的人建議借這次機會和醫生談談戒煙。","edu":"咳嗽是身體的保護反射，感冒、支氣管炎、哮喘、過敏、甚至胃食道反流都可能引起，病程不同原因也不同。是否需要拍片、用什麼藥，必須醫生看過才能定。","sources":[{"org":"中華醫學會呼吸病學分會","title":"中國咳嗽的診斷與治療指南"},{"org":"英國國家醫療服務體系（NHS）","title":"Cough 症狀說明"}]},"en":{"patterns":["cough","coughing a lot","dry cough","coughing up phlegm","cough at night"],"empathy":"A lasting cough wrecks your sleep. Let me sort it out and rule out the urgent causes.","redflagHint":"Coughing up blood, hard breathing, blue lips, or chest pain with sweating needs the ER now.","questions":[{"q":"How long, and is there phlegm?","options":["A few days, no phlegm","A few days, white phlegm","Over two weeks","Green or yellow phlegm"]},{"q":"When is the cough worst?","options":["Lying down at night","Right after waking","In cold air","Not sure"]},{"q":"Any breathlessness, chest pain, or blood?","options":["None","A bit breathless","Chest pain","Coughed blood"]}],"triage":"A cough for one to two weeks after a cold is common; rest, warm fluids, and avoiding smoke help. Beyond two weeks, green phlegm, or repeated fever, book a respiratory clinic visit. Breathlessness, chest pain, or blood means go now.","edu":"Coughing is a protective reflex. Colds, bronchitis, asthma, allergies, and even acid reflux can cause it, and the cause varies with duration. Whether you need an X-ray or medicine is for the doctor to decide.","sources":[{"org":"Chinese Medical Association, Respiratory Branch","title":"Chinese guideline for cough diagnosis and treatment"},{"org":"UK National Health Service (NHS)","title":"Cough condition page"}]}},{"id":"sore_throat","priority":14,"dept":{"zh":"耳鼻喉科","zh-Hant":"耳鼻喉科","en":"ENT"},"zh":{"patterns":["嗓子疼","喉咙痛","咽喉痛","咽口水疼","嗓子哑","喉咙肿痛","扁桃体疼"],"empathy":"嗓子疼起来连喝水都受罪，我陪您看看要不要紧。","redflagHint":"喉咙肿得喘不上气、说不出话、口水往外流、脖子僵硬发硬，请立即去急诊。","questions":[{"q":"嗓子疼几天了，发烧吗？","options":["一两天，不烧","两三天，有点烧","超过一周","高烧"]},{"q":"除了嗓子，还有哪里不舒服？","options":["鼻塞流涕","咳嗽","耳朵里面疼","说不上来"]},{"q":"有没有呼吸不畅、嘴巴张不开，或者脖子发硬？","options":["都没有","呼吸有点费劲","嘴巴张不开","脖子发硬"]}],"triage":"普通感冒引起的嗓子疼，多数一周内自己好转，多喝温水、淡盐水漱口、少说话。高烧不退、张不开嘴、吞咽困难到水都喝不下、呼吸不畅，请立即就医；反复发作的扁桃体炎建议预约耳鼻喉科评估。","edu":"嗓子疼大多是病毒感染，抗生素对病毒无效，这也是为什么不建议一疼就自己吃消炎药。是否需要化验、用什么治疗，要医生看过喉咙再定。","sources":[{"org":"美国梅奥诊所（Mayo Clinic）","title":"Sore throat 疾病科普"},{"org":"英国国家医疗服务体系（NHS）","title":"Sore throat 症状说明"}]},"zh-Hant":{"patterns":["嗓子疼","喉嚨痛","咽喉痛","吞口水疼","嗓子啞","喉嚨腫痛","扁桃體疼"],"empathy":"嗓子疼起來連喝水都受罪，我陪您看看要不要緊。","redflagHint":"喉嚨腫得喘不上氣、說不出話、口水往外流、脖子僵硬發硬，請立即去急診。","questions":[{"q":"嗓子疼幾天了，發燒嗎？","options":["一兩天，不燒","兩三天，有點燒","超過一週","高燒"]},{"q":"除了嗓子，還有哪裡不舒服？","options":["鼻塞流涕","咳嗽","耳朵裡面疼","說不上來"]},{"q":"有沒有呼吸不暢、嘴巴張不開，或者脖子發硬？","options":["都沒有","呼吸有點費勁","嘴巴張不開","脖子發硬"]}],"triage":"普通感冒引起的嗓子疼，多數一週內自己好轉，多喝溫水、淡鹽水漱口、少說話。高燒不退、張不開嘴、吞嚥困難到水都喝不下、呼吸不暢，請立即就醫；反覆發作的扁桃體炎建議預約耳鼻喉科評估。","edu":"嗓子疼大多是病毒感染，抗生素對病毒無效，這也是為什麼不建議一疼就自己吃消炎藥。是否需要化驗、用什麼治療，要醫生看過喉嚨再定。","sources":[{"org":"美國梅奧診所（Mayo Clinic）","title":"Sore throat 疾病科普"},{"org":"英國國家醫療服務體系（NHS）","title":"Sore throat 症狀說明"}]},"en":{"patterns":["sore throat","throat hurts","painful swallowing","hoarse voice","swollen tonsils"],"empathy":"A sore throat makes even drinking painful. Let me see whether it needs urgent care.","redflagHint":"A swollen throat with hard breathing, drooling, a stiff neck, or inability to open the mouth needs the ER now.","questions":[{"q":"How many days, and any fever?","options":["1-2 days, no fever","2-3 days, slight fever","Over a week","High fever"]},{"q":"Anything else bothering you?","options":["Runny nose","Cough","Ear pain","Hard to say"]},{"q":"Any trouble breathing, opening your mouth, or a stiff neck?","options":["None","Breathing is harder","Cannot open mouth","Stiff neck"]}],"triage":"Most sore throats from colds settle within a week with warm fluids, salt-water gargles, and voice rest. High fever, drooling, inability to swallow water, or breathing trouble needs care now. Recurrent tonsillitis is worth an ENT assessment.","edu":"Most sore throats are viral, and antibiotics do nothing against viruses, which is why self-medicating with them is not advised. Whether you need a test or treatment is for the doctor after examining your throat.","sources":[{"org":"Mayo Clinic","title":"Sore throat condition page"},{"org":"UK National Health Service (NHS)","title":"Sore throat condition page"}]}},{"id":"abdominal_pain","priority":15,"dept":{"zh":"消化内科 / 普外科","zh-Hant":"消化內科 / 普通外科","en":"Gastroenterology / General surgery"},"zh":{"patterns":["肚子疼","肚子痛","腹痛","肚脐周围疼","右下腹疼","胃疼","胃痛","小肚子疼","一阵一阵绞痛"],"empathy":"肚子疼最难忍，我帮您一条一条问清楚，危险的情况先排掉。","redflagHint":"肚子硬得像木板、一按就痛得厉害、呕血或便血、疼得打滚冒冷汗，请立即去急诊。","questions":[{"q":"疼在哪个位置，什么时候开始的？","options":["上腹部，今天开始","右下腹，刚出现","到处都疼","说不清"]},{"q":"是什么性质的疼？","options":["一阵一阵绞痛","一直隐隐作痛","烧灼样疼","说不清"]},{"q":"有没有发烧、呕吐，或者大便带血？","options":["都没有","有发烧","呕吐","大便带血"]}],"triage":"饮食不当引起的胃痛、受凉后的肚子疼，多数一两天内缓解，可以先清淡饮食、别吃凉的辣的。疼痛持续超过一天不缓解、越来越重、固定在右下腹、伴发烧呕吐，建议 24 小时内就诊；出现危险信号请立即去急诊。老人和孕妇的腹痛一律不要拖。","edu":"肚子疼从吃坏肚子、便秘到阑尾炎、胆结石、胰腺炎都可能，位置和性质能提供重要线索，但单凭描述无法确诊，需要医生查体甚至影像检查。在没弄清之前，不要盲目吃止痛药。","sources":[{"org":"默沙东诊疗手册（MSD Manual）大众版","title":"急性腹痛"},{"org":"中华医学会消化病学分会","title":"中国慢性胃炎诊治指南"}]},"zh-Hant":{"patterns":["肚子疼","肚子痛","腹痛","肚臍周圍疼","右下腹疼","胃疼","胃痛","小肚子疼","一陣一陣絞痛"],"empathy":"肚子疼最難忍，我幫您一條一條問清楚，危險的情況先排掉。","redflagHint":"肚子硬得像木板、一按就痛得厲害、嘔血或便血、疼得打滾冒冷汗，請立即去急診。","questions":[{"q":"疼在哪個位置，什麼時候開始的？","options":["上腹部，今天開始","右下腹，剛出現","到處都疼","說不清"]},{"q":"是什麼性質的疼？","options":["一陣一陣絞痛","一直隱隱作痛","燒灼樣疼","說不清"]},{"q":"有沒有發燒、嘔吐，或者大便帶血？","options":["都沒有","有發燒","嘔吐","大便帶血"]}],"triage":"飲食不當引起的胃痛、受涼後的肚子疼，多數一兩天內緩解，可以先清淡飲食、別吃涼的辣的。疼痛持續超過一天不緩解、越來越重、固定在右下腹、伴發燒嘔吐，建議 24 小時內就診；出現危險信號請立即去急診。老人和孕婦的腹痛一律不要拖。","edu":"肚子疼從吃壞肚子、便祕到闌尾炎、膽結石、胰臟炎都可能，位置和性質能提供重要線索，但單憑描述無法確診，需要醫生查體甚至影像檢查。在沒弄清之前，不要盲目吃止痛藥。","sources":[{"org":"默沙東診療手冊（MSD Manual）大眾版","title":"急性腹痛"},{"org":"中華醫學會消化病學分會","title":"中國慢性胃炎診治指南"}]},"en":{"patterns":["stomach ache","stomach pain","belly hurts","pain in my abdomen","cramping pain","lower abdominal pain"],"empathy":"Belly pain is hard to bear. Let me ask a few things and rule out danger first.","redflagHint":"A board-like rigid belly, severe tenderness, vomiting blood or blood in stool, or drenching sweats need the ER now.","questions":[{"q":"Where is the pain and when did it start?","options":["Upper belly, today","Lower right, just now","Everywhere","Not sure"]},{"q":"What kind of pain is it?","options":["Cramping waves","Constant dull ache","Burning","Not sure"]},{"q":"Any fever, vomiting, or blood in stool?","options":["None","Fever","Vomiting","Blood in stool"]}],"triage":"Stomach aches from food or a chill often ease in a day or two with light food and nothing cold or spicy. Pain lasting more than a day, worsening, fixed in the lower right, or with fever and vomiting needs a visit within 24 hours. Never ignore belly pain in older adults or pregnancy.","edu":"Belly pain ranges from bad food and constipation to appendicitis, gallstones, or pancreatitis. Location and character give clues, but description alone cannot confirm anything; a doctor's exam and imaging decide. Do not blindly take painkillers first.","sources":[{"org":"MSD Manual, Consumer Version","title":"Acute abdominal pain"},{"org":"Chinese Medical Association, Gastroenterology Branch","title":"Chinese guideline for chronic gastritis"}]}},{"id":"diarrhea","priority":16,"dept":{"zh":"消化内科 / 肠道门诊","zh-Hant":"消化內科 / 腸道門診","en":"Gastroenterology"},"zh":{"patterns":["拉肚子","腹泻","跑肚","拉稀","一天拉好几次","水样便","拉水"],"empathy":"拉肚子最怕脱水，我帮您看看现在该怎么办。","redflagHint":"拉得站不起来、口干尿少、便血、高烧不退、意识模糊，请立即就医。","questions":[{"q":"一天拉几次，大便是什么样？","options":["三四次，稀便","次数很多，水样","有黏液脓血","记不清"]},{"q":"有没有发烧、呕吐？","options":["都没有","有发烧","有呕吐","又烧又吐"]},{"q":"最近有没有吃不新鲜的东西、外出就餐，或者有人在吃同样的饭？","options":["都没有","吃了剩菜或凉菜","外出就餐过","家人也这样"]}],"triage":"大多数腹泻是病毒或吃坏东西引起，关键是把水补上：口服补液盐或淡盐水加糖，少量多次喝，别只喝白开水。一两天内好转可以先观察；高烧、便血、脱水明显、老人孩子孕妇腹泻超过一天，请尽快就医。","edu":"腹泻时身体丢的不只是水，还有盐分，所以补液比止泻更重要，这也是不建议一腹泻就吃强力止泻药的原因。是否需要化验大便、用什么药，要医生定。","sources":[{"org":"中国疾病预防控制中心","title":"感染性腹泻防控科普"},{"org":"世界卫生组织（WHO）","title":"腹泻病（Diarrhoeal disease）专题"}]},"zh-Hant":{"patterns":["拉肚子","腹瀉","跑肚","拉稀","一天拉好幾次","水樣便","拉水"],"empathy":"拉肚子最怕脫水，我幫您看看現在該怎麼辦。","redflagHint":"拉得站不起來、口乾尿少、便血、高燒不退、意識模糊，請立即就醫。","questions":[{"q":"一天拉幾次，大便是什麼樣？","options":["三四次，稀便","次數很多，水樣","有黏液膿血","記不清"]},{"q":"有沒有發燒、嘔吐？","options":["都沒有","有發燒","有嘔吐","又燒又吐"]},{"q":"最近有沒有吃不新鮮的東西、外出就餐，或者有人在吃同樣的飯？","options":["都沒有","吃了剩菜或涼菜","外出就餐過","家人也這樣"]}],"triage":"大多數腹瀉是病毒或吃壞東西引起，關鍵是把水補上：口服補液鹽或淡鹽水加糖，少量多次喝，別只喝白開水。一兩天內好轉可以先觀察；高燒、便血、脫水明顯、老人孩子孕婦腹瀉超過一天，請盡快就醫。","edu":"腹瀉時身體丟的不只是水，還有鹽分，所以補液比止瀉更重要，這也是不建議一腹瀉就吃強力止瀉藥的原因。是否需要化驗大便、用什麼藥，要醫生定。","sources":[{"org":"中國疾病預防控制中心","title":"感染性腹瀉防控科普"},{"org":"世界衛生組織（WHO）","title":"腹瀉病（Diarrhoeal disease）專題"}]},"en":{"patterns":["diarrhea","the runs","loose stools","pooping many times a day","watery stool"],"empathy":"Diarrhea's biggest risk is dehydration. Let me work out what to do.","redflagHint":"Too weak to stand, dry mouth with little urine, blood in stool, persistent high fever, or confusion needs care now.","questions":[{"q":"How many times a day, and what does it look like?","options":["3-4 times, loose","Many times, watery","Mucus or blood","Not sure"]},{"q":"Any fever or vomiting?","options":["None","Fever","Vomiting","Both"]},{"q":"Any spoiled food, eating out, or others with the same meal?","options":["None","Leftovers or cold dishes","Ate out","Family too"]}],"triage":"Most diarrhea is viral or food-related; the priority is fluids: oral rehydration salts or lightly salted sweetened water, sipped often, not plain water alone. Watch for a day or two if it is mild. High fever, blood, clear dehydration, or diarrhea over a day in older adults, children, or pregnancy needs care.","edu":"Diarrhea loses water and salts, so rehydration matters more than stopping the stool, which is why strong anti-diarrheals are not advised first. Stool tests and medicines are for the doctor to decide.","sources":[{"org":"Chinese Center for Disease Control and Prevention","title":"Infectious diarrhea prevention"},{"org":"World Health Organization (WHO)","title":"Diarrhoeal disease topic page"}]}},{"id":"nausea_vomit","priority":17,"dept":{"zh":"消化内科","zh-Hant":"消化內科","en":"Gastroenterology"},"zh":{"patterns":["恶心","想吐","呕吐","吐了","反胃","干呕","吃不下饭还想吐"],"empathy":"恶心呕吐最耗人，我陪您看看是哪儿出了问题。","redflagHint":"呕血、吐到脱水、腹痛剧烈、伴胸痛大汗、意识不清，请立即去急诊。","questions":[{"q":"吐出来的是食物、苦水，还是带血？","options":["食物","苦水或酸水","带血丝","说不上来"]},{"q":"一天吐几次，还能喝水吗？","options":["一两次，能喝水","好几次，勉强能喝","喝不进去","说不上来"]},{"q":"吐之前有没有吃坏东西、头部受伤，或者剧烈头痛？","options":["都没有","吃坏东西了","撞过头","头痛得厉害"]}],"triage":"吃坏东西、晕车、早孕反应引起的恶心呕吐，多数一两天缓解，可以先禁食一两顿、少量多次喝淡盐水或补液盐。反复呕吐、喝水都吐、伴腹痛或头痛、老人和慢性病患者，建议 24 小时内就诊。","edu":"恶心呕吐的原因从吃坏东西、胃肠炎、晕车到头部问题、代谢问题都可能，吐出来的样子和伴随症状是重要线索。反复呕吐时别急着吃止吐药，先防脱水，让医生判断原因。","sources":[{"org":"默沙东诊疗手册（MSD Manual）大众版","title":"恶心与呕吐"},{"org":"英国国家医疗服务体系（NHS）","title":"Feeling sick (nausea) 症状说明"}]},"zh-Hant":{"patterns":["噁心","想吐","嘔吐","吐了","反胃","乾嘔","吃不下飯還想吐"],"empathy":"噁心嘔吐最耗人，我陪您看看是哪兒出了問題。","redflagHint":"嘔血、吐到脫水、腹痛劇烈、伴胸痛大汗、意識不清，請立即去急診。","questions":[{"q":"吐出來的是食物、苦水，還是帶血？","options":["食物","苦水或酸水","帶血絲","說不上來"]},{"q":"一天吐幾次，還能喝水嗎？","options":["一兩次，能喝水","好幾次，勉強能喝","喝不進去","說不上來"]},{"q":"吐之前有沒有吃壞東西、頭部受傷，或者劇烈頭痛？","options":["都沒有","吃壞東西了","撞過頭","頭痛得厲害"]}],"triage":"吃壞東西、暈車、早孕反應引起的噁心嘔吐，多數一兩天緩解，可以先禁食一兩頓、少量多次喝淡鹽水或補液鹽。反覆嘔吐、喝水都吐、伴腹痛或頭痛、老人和慢性病患者，建議 24 小時內就診。","edu":"噁心嘔吐的原因從吃壞東西、胃腸炎、暈車到頭部問題、代謝問題都可能，吐出來的樣子和伴隨症狀是重要線索。反覆嘔吐時別急著吃止吐藥，先防脫水，讓醫生判斷原因。","sources":[{"org":"默沙東診療手冊（MSD Manual）大眾版","title":"噁心與嘔吐"},{"org":"英國國家醫療服務體系（NHS）","title":"Feeling sick (nausea) 症狀說明"}]},"en":{"patterns":["nausea","feel like throwing up","vomiting","throwing up","retching"],"empathy":"Nausea and vomiting wear you out. Let me find where the problem is.","redflagHint":"Vomiting blood, vomiting until dehydrated, severe belly pain, chest pain with sweating, or confusion needs the ER now.","questions":[{"q":"Is it food, bitter fluid, or blood?","options":["Food","Bitter or sour fluid","Streaks of blood","Not sure"]},{"q":"How many times, and can you keep water down?","options":["Once or twice, water stays","Several times, barely","Cannot keep water","Not sure"]},{"q":"Bad food, a head injury, or a severe headache before this?","options":["None","Bad food","Hit my head","Severe headache"]}],"triage":"Nausea from bad food, motion sickness, or early pregnancy usually settles in a day or two: skip a meal or two, then sip lightly salted water or rehydration solution. Repeated vomiting, unable to keep water down, or pain and headache in older adults or chronic illness needs a visit within 24 hours.","edu":"Causes range from bad food and gastroenteritis to motion sickness, head problems, and metabolic issues. What comes up and the accompanying symptoms are important clues. With repeated vomiting, prevent dehydration first and let the doctor find the cause.","sources":[{"org":"MSD Manual, Consumer Version","title":"Nausea and vomiting"},{"org":"UK National Health Service (NHS)","title":"Feeling sick (nausea) page"}]}},{"id":"rash","priority":18,"dept":{"zh":"皮肤科","zh-Hant":"皮膚科","en":"Dermatology"},"zh":{"patterns":["皮疹","起疹子","身上痒","长疙瘩","风团","红斑","一抓一道痕"],"empathy":"又痒又难看最闹心，我帮您看看要不要紧。","redflagHint":"皮疹伴着喘不上气、喉咙发紧、脸肿、高烧不退，请立即去急诊。","questions":[{"q":"疹子长什么样、痒不痒？","options":["一片红，很痒","一个个疙瘩","风团一样，来得快去得快","说不上来"]},{"q":"长了多久，范围在扩大吗？","options":["一两天，没扩大","一两天，在扩大","超过一周","反复发作"]},{"q":"出现前有没有吃新药、吃特别的东西，或者被虫子咬？","options":["都没有","吃了新药","吃了海鲜等食物","被虫子咬过"]}],"triage":"小范围、不扩散、不发烧的疹子可以先观察，避免搔抓、热水烫洗和乱涂药膏。范围扩大、反复发作、影响睡眠，或说不清原因，建议预约皮肤科门诊；用药后出现的皮疹更要尽快就诊，并把药名告诉医生。","edu":"皮疹的原因很多：过敏、湿疹、病毒或细菌感染、药物反应都可能，单凭样子很难定性。是否需要吃药、涂什么，必须医生看过才能定，自己乱涂激素药膏可能越涂越糟。","sources":[{"org":"默沙东诊疗手册（MSD Manual）大众版","title":"皮疹与瘙痒"},{"org":"国家卫生健康委员会","title":"健康科普平台"}]},"zh-Hant":{"patterns":["皮疹","起疹子","身上癢","長疙瘩","風團","紅斑","一抓一道痕"],"empathy":"又癢又難看最鬧心，我幫您看看要不要緊。","redflagHint":"皮疹伴著喘不上氣、喉嚨發緊、臉腫、高燒不退，請立即去急診。","questions":[{"q":"疹子長什麼樣、癢不癢？","options":["一片紅，很癢","一個個疙瘩","風團一樣，來得快去得快","說不上來"]},{"q":"長了多久，範圍在擴大嗎？","options":["一兩天，沒擴大","一兩天，在擴大","超過一週","反覆發作"]},{"q":"出現前有沒有吃新藥、吃特別的東西，或者被蟲子咬？","options":["都沒有","吃了新藥","吃了海鮮等食物","被蟲子咬過"]}],"triage":"小範圍、不擴散、不發燒的疹子可以先觀察，避免搔抓、熱水燙洗和亂塗藥膏。範圍擴大、反覆發作、影響睡眠，或說不清原因，建議預約皮膚科門診；用藥後出現的皮疹更要盡快就診，並把藥名告訴醫生。","edu":"皮疹的原因很多：過敏、濕疹、病毒或細菌感染、藥物反應都可能，單憑樣子很難定性。是否需要吃藥、塗什麼，必須醫生看過才能定，自己亂塗激素藥膏可能越塗越糟。","sources":[{"org":"默沙東診療手冊（MSD Manual）大眾版","title":"皮疹與瘙癢"},{"org":"國家衛生健康委員會","title":"健康科普平台"}]},"en":{"patterns":["rash","skin rash","breaking out in hives","itchy bumps","red patches on skin"],"empathy":"Itchy, ugly rashes are upsetting. Let me see if this needs urgent care.","redflagHint":"A rash with hard breathing, a tight throat, facial swelling, or persistent high fever needs the ER now.","questions":[{"q":"What do the spots look like, and are they itchy?","options":["Red patches, very itchy","Individual bumps","Hives that come and go","Hard to say"]},{"q":"How long, and is it spreading?","options":["1-2 days, not spreading","1-2 days, spreading","Over a week","Keeps coming back"]},{"q":"Any new medicine, unusual food, or insect bites before it?","options":["None","New medicine","Seafood or new food","Insect bite"]}],"triage":"Small, non-spreading rashes without fever can be watched: no scratching, no hot water, and no random creams. Spreading, recurring, sleep-disturbing, or unexplained rashes deserve a dermatology appointment; a rash after a new medicine needs to be seen soon, with the drug name.","edu":"Rashes have many causes: allergy, eczema, viral or bacterial infection, drug reactions. Looks alone rarely settle it. What to take or apply is for the doctor, and random steroid creams can make things worse.","sources":[{"org":"MSD Manual, Consumer Version","title":"Rashes and itching"},{"org":"National Health Commission of China","title":"Health public-education platform"}]}},{"id":"back_pain","priority":19,"dept":{"zh":"骨科 / 康复科","zh-Hant":"骨科 / 復健科","en":"Orthopedics / Rehabilitation"},"zh":{"patterns":["腰疼","腰痛","腰酸","闪了腰","腰直不起来","腰疼得动不了"],"empathy":"腰疼起来连翻身都难，我陪您一步步来。","redflagHint":"腰疼伴着两条腿没力气、大小便失控或排不出、会阴发麻，请立即去急诊。","questions":[{"q":"疼了多久，是怎么引起的？","options":["刚扭伤","几天了","超过两周","说不清原因"]},{"q":"疼在什么位置？","options":["正中间一束","一边屁股大腿","整片都疼","说不上来"]},{"q":"有没有腿麻、腿没力气，或者大小便不正常？","options":["都没有","腿麻","腿没力气","大小便不正常"]}],"triage":"扭伤、受凉、劳累引起的腰疼，多数一两周缓解：卧床别超过一两天，温热敷、慢慢活动，避免弯腰搬重物。两周不好、夜里痛醒、伴着腿麻无力，建议预约骨科或康复科门诊；出现危险信号请立即就医。","edu":"腰疼最常见的原因是肌肉韧带劳损和腰椎退变，少数情况涉及神经压迫甚至更严重的问题。腿麻无力和大小便改变是区别「能不能先观察」的关键信号，出现就不要拖。","sources":[{"org":"美国梅奥诊所（Mayo Clinic）","title":"Back pain 疾病科普"},{"org":"默沙东诊疗手册（MSD Manual）大众版","title":"腰痛"}]},"zh-Hant":{"patterns":["腰疼","腰痛","腰酸","閃了腰","腰直不起來","腰疼得動不了"],"empathy":"腰疼起來連翻身都難，我陪您一步步來。","redflagHint":"腰疼伴著兩條腿沒力氣、大小便失控或排不出、會陰發麻，請立即去急診。","questions":[{"q":"疼了多久，是怎麼引起的？","options":["剛扭傷","幾天了","超過兩週","說不清原因"]},{"q":"疼在什麼位置？","options":["正中間一束","一邊屁股大腿","整片都疼","說不上來"]},{"q":"有沒有腿麻、腿沒力氣，或者大小便不正常？","options":["都沒有","腿麻","腿沒力氣","大小便不正常"]}],"triage":"扭傷、受涼、勞累引起的腰疼，多數一兩週緩解：臥床別超過一兩天，溫熱敷、慢慢活動，避免彎腰搬重物。兩週不好、夜裡痛醒、伴著腿麻無力，建議預約骨科或復健科門診；出現危險信號請立即就醫。","edu":"腰疼最常見的原因是肌肉韌帶勞損和腰椎退變，少數情況涉及神經壓迫甚至更嚴重的問題。腿麻無力和大小便改變是區別「能不能先觀察」的關鍵信號，出現就不要拖。","sources":[{"org":"美國梅奧診所（Mayo Clinic）","title":"Back pain 疾病科普"},{"org":"默沙東診療手冊（MSD Manual）大眾版","title":"腰痛"}]},"en":{"patterns":["back pain","lower back hurts","my back is sore","threw my back out","cannot straighten my back"],"empathy":"Back pain makes even turning over hard. Let me take it step by step.","redflagHint":"Back pain with weakness in both legs, loss of bladder or bowel control, or numbness in the saddle area needs the ER now.","questions":[{"q":"How long, and what caused it?","options":["Just twisted it","A few days","Over two weeks","No clear cause"]},{"q":"Where is the pain?","options":["Center strip","One side into the leg","Whole area","Hard to say"]},{"q":"Any leg numbness, leg weakness, or bladder or bowel changes?","options":["None","Leg numbness","Leg weakness","Bladder or bowel changes"]}],"triage":"Back pain from strain, cold, or overwork usually eases in one to two weeks: bed rest no more than a day or two, warm compresses, gentle movement, no heavy lifting. Pain beyond two weeks, night pain, or leg numbness and weakness needs orthopedics or rehabilitation. Red flags mean go now.","edu":"Most back pain comes from muscle and ligament strain and degenerative change; a minority involves nerve compression or worse. Leg weakness and bladder or bowel changes are what separate watch-and-wait from urgent care.","sources":[{"org":"Mayo Clinic","title":"Back pain condition page"},{"org":"MSD Manual, Consumer Version","title":"Low back pain"}]}},{"id":"insomnia","priority":20,"dept":{"zh":"神经内科 / 心理科","zh-Hant":"神經內科 / 心理科","en":"Neurology / Psychology"},"zh":{"patterns":["失眠","睡不着","入睡困难","半夜老醒","睡眠浅","天天做梦","睡不好"],"empathy":"睡不着最熬人，我陪您看看能从哪里改善。","redflagHint":"长期睡不着伴情绪低落、觉得活着没意思，请尽快联系家人陪伴并就医，必要时拨打心理援助热线。","questions":[{"q":"主要是睡不着，还是半夜老醒？","options":["躺下睡不着","半夜老醒","早早就醒","说不上来"]},{"q":"这样的情况持续多久了？","options":["最近几天","一两周","一两个月","半年以上"]},{"q":"睡前有没有喝浓茶咖啡、想事情想得太多，或者在吃药？","options":["都没有","喝茶或咖啡","心里有事","在吃药"]}],"triage":"短期睡不好，先从睡眠习惯入手：固定作息、睡前不喝浓茶咖啡、白天少躺少睡、卧室安静遮光。持续一个月以上、白天没精神、情绪低落，建议预约神经内科或心理科门诊，让医生评估是否需要干预。","edu":"失眠常常是压力、情绪、慢性病或药物影响的结果，也可能反过来加重血压和心脏负担。要不要用药、用什么，必须医生评估后决定，不建议自己反复吃安眠药。","sources":[{"org":"中华医学会神经病学分会","title":"中国成人失眠诊断与治疗指南"},{"org":"国家卫生健康委员会","title":"健康科普平台·睡眠健康"}]},"zh-Hant":{"patterns":["失眠","睡不著","入睡困難","半夜老醒","睡眠淺","天天做夢","睡不好"],"empathy":"睡不著最熬人，我陪您看看能從哪裡改善。","redflagHint":"長期睡不著伴情緒低落、覺得活著沒意思，請盡快聯繫家人陪伴並就醫，必要時撥打心理援助熱線。","questions":[{"q":"主要是睡不著，還是半夜老醒？","options":["躺下睡不著","半夜老醒","早早就醒","說不上來"]},{"q":"這樣的情況持續多久了？","options":["最近幾天","一兩週","一兩個月","半年以上"]},{"q":"睡前有沒有喝濃茶咖啡、想事情想得太多，或者在吃藥？","options":["都沒有","喝茶或咖啡","心裡有事","在吃藥"]}],"triage":"短期睡不好，先從睡眠習慣入手：固定作息、睡前不喝濃茶咖啡、白天少躺少睡、臥室安靜遮光。持續一個月以上、白天沒精神、情緒低落，建議預約神經內科或心理科門診，讓醫生評估是否需要干預。","edu":"失眠常常是壓力、情緒、慢性病或藥物影響的結果，也可能反過來加重血壓和心臟負擔。要不要用藥、用什麼，必須醫生評估後決定，不建議自己反覆吃安眠藥。","sources":[{"org":"中華醫學會神經病學分會","title":"中國成人失眠診斷與治療指南"},{"org":"國家衛生健康委員會","title":"健康科普平台·睡眠健康"}]},"en":{"patterns":["insomnia","cannot sleep","trouble falling asleep","keep waking at night","light sleeper"],"empathy":"Not sleeping is exhausting. Let me look at what can be improved.","redflagHint":"Long-term poor sleep with low mood or feeling life is not worth living needs family support and a doctor, and a crisis hotline if urgent.","questions":[{"q":"Is it falling asleep, or waking at night?","options":["Cannot fall asleep","Wake at night","Wake too early","Hard to say"]},{"q":"How long has this been going on?","options":["A few days","One to two weeks","One to two months","Over six months"]},{"q":"Tea or coffee before bed, a lot on your mind, or any medicines?","options":["None","Tea or coffee","Something on my mind","Taking medicines"]}],"triage":"For short-term poor sleep, start with habits: a fixed schedule, no strong tea or coffee before bed, less daytime napping, a quiet dark bedroom. Beyond a month, with low energy or low mood, book a neurology or psychology visit for assessment.","edu":"Insomnia often follows stress, mood, chronic illness, or medicines, and can worsen blood pressure and heart strain in turn. Whether to use medicine is a doctor's decision; repeated self-medication with sleeping pills is not advised.","sources":[{"org":"Chinese Medical Association, Neurology Branch","title":"Chinese guideline for adult insomnia diagnosis and treatment"},{"org":"National Health Commission of China","title":"Health public-education platform, sleep health"}]}},{"id":"indigestion","priority":21,"dept":{"zh":"消化内科","zh-Hant":"消化內科","en":"Gastroenterology"},"zh":{"patterns":["胃胀","肚子胀","反酸","烧心","打嗝","消化不良","吃一点就饱","胃里堵得慌"],"empathy":"胃里堵得慌最影响胃口，我帮您看看怎么调。","redflagHint":"呕血、黑便、吞咽困难、体重明显下降、持续疼痛不缓解，请立即就医。","questions":[{"q":"主要是胀、反酸，还是烧心？","options":["胀","反酸","烧心","都有"]},{"q":"和吃饭有关系吗？","options":["吃饱就犯","空腹夜里犯","没关系","说不上来"]},{"q":"有没有消瘦、黑便，或者吞咽困难？","options":["都没有","瘦了不少","大便发黑","咽东西费劲"]}],"triage":"多数胀气反酸和饮食快、吃得多、油腻刺激有关：细嚼慢咽、少食多餐、睡前两小时不进食、枕头稍垫高。反复发作超过两周、影响吃饭、伴消瘦黑便，建议预约消化内科门诊，别自己长期吃抑酸药。","edu":"腹胀反酸烧心大多和胃动力、胃酸分泌或生活习惯有关，少数情况需要排除溃疡等器质性问题。要不要做胃镜、用什么药，由医生根据情况决定。","sources":[{"org":"中华医学会消化病学分会","title":"中国慢性胃炎诊治指南"},{"org":"默沙东诊疗手册（MSD Manual）大众版","title":"消化不良"}]},"zh-Hant":{"patterns":["胃脹","肚子脹","反酸","燒心","打嗝","消化不良","吃一點就飽","胃裡堵得慌"],"empathy":"胃裡堵得慌最影響胃口，我幫您看看怎麼調。","redflagHint":"嘔血、黑便、吞嚥困難、體重明顯下降、持續疼痛不緩解，請立即就醫。","questions":[{"q":"主要是脹、反酸，還是燒心？","options":["脹","反酸","燒心","都有"]},{"q":"和吃飯有關係嗎？","options":["吃飽就犯","空腹夜裡犯","沒關係","說不上來"]},{"q":"有沒有消瘦、黑便，或者吞嚥困難？","options":["都沒有","瘦了不少","大便發黑","吞東西費勁"]}],"triage":"多數脹氣反酸和飲食快、吃得多、油膩刺激有關：細嚼慢嚥、少食多餐、睡前兩小時不進食、枕頭稍墊高。反覆發作超過兩週、影響吃飯、伴消瘦黑便，建議預約消化內科門診，別自己長期吃抑酸藥。","edu":"腹脹反酸燒心大多和胃動力、胃酸分泌或生活習慣有關，少數情況需要排除潰瘍等器質性問題。要不要做胃鏡、用什麼藥，由醫生根據情況決定。","sources":[{"org":"中華醫學會消化病學分會","title":"中國慢性胃炎診治指南"},{"org":"默沙東診療手冊（MSD Manual）大眾版","title":"消化不良"}]},"en":{"patterns":["bloating","stomach bloated","acid reflux","heartburn","belching","indigestion"],"empathy":"A stuffed, burning stomach ruins your appetite. Let me see how to adjust it.","redflagHint":"Vomiting blood, black stool, trouble swallowing, clear weight loss, or pain that will not ease needs care now.","questions":[{"q":"Is it bloating, reflux, or burning?","options":["Bloating","Acid reflux","Burning","All of them"]},{"q":"Is it linked to meals?","options":["After big meals","Empty stomach at night","No pattern","Hard to say"]},{"q":"Any weight loss, black stool, or trouble swallowing?","options":["None","Lost weight","Black stool","Hard to swallow"]}],"triage":"Most bloating and reflux relate to eating fast, large or greasy meals: chew slowly, smaller portions, nothing within two hours of bed, a slightly raised pillow. Symptoms beyond two weeks, poor appetite, weight loss, or black stool deserve a gastroenterology visit, and long-term self-medication with acid suppressants is not advised.","edu":"Bloating, reflux, and heartburn usually involve stomach motility, acid, and habits, while a minority need exclusion of ulcers or other structural problems. Endoscopy and medicines are the doctor's call.","sources":[{"org":"Chinese Medical Association, Gastroenterology Branch","title":"Chinese guideline for chronic gastritis"},{"org":"MSD Manual, Consumer Version","title":"Indigestion"}]}}],"generic":{"zh":{"empathy":"我在听。为了不耽误您，我先把最危险的情况排掉。","questions":[{"q":"您主要是哪里不舒服？","options":["头上","胸口","肚子","说不上来"]},{"q":"这样的情况持续多久了？","options":["今天刚开始","两三天了","一周以上","记不清了"]}],"triage":"不确定的时候，宁可稳妥一点：如果不舒服的感觉一直存在、越来越重，或者您拿不准，建议您到就近医院门诊挂个号，让医生当面看看。","edu":"同样的不舒服可能对应很多种原因，有轻有重，仅凭几句话没法分清。我能做的是帮您把症状理清楚、提醒危险信号，具体判断要靠医生。","sources":[{"org":"国家卫生健康委员会","title":"健康科普平台"}]},"zh-Hant":{"empathy":"我在聽。為了不耽誤您，我先把最危險的情況排掉。","questions":[{"q":"您主要是哪裡不舒服？","options":["頭上","胸口","肚子","說不上來"]},{"q":"這樣的情況持續多久了？","options":["今天剛開始","兩三天了","一週以上","記不清了"]}],"triage":"不確定的時候，寧可穩妥一點：如果不舒服的感覺一直存在、越來越重，或者您拿不準，建議您到就近醫院門診掛個號，讓醫生當面看看。","edu":"同樣的不舒服可能對應很多種原因，有輕有重，僅憑幾句話沒法分清。我能做的是幫您把症狀理清楚、提醒危險信號，具體判斷要靠醫生。","sources":[{"org":"國家衛生健康委員會","title":"健康科普平台"}]},"en":{"empathy":"I am listening. To be safe, let me rule out the dangerous causes first.","questions":[{"q":"Where do you feel unwell?","options":["Head","Chest","Belly","Not sure"]},{"q":"How long has this been going on?","options":["Since today","Two to three days","Over a week","Not sure"]}],"triage":"When in doubt, choose the safe option: if the feeling persists, worsens, or you are unsure, book an appointment at a nearby hospital and let a doctor look at you.","edu":"The same symptom can have many causes, mild or serious, and a few sentences cannot tell them apart. I can organize your symptoms and flag danger signs; the judgment belongs to a doctor.","sources":[{"org":"National Health Commission of China","title":"Health public-education platform"}]}}};

  /* 与语料库同一套归一化：小写 + 去空白与标点；中文不分词，靠子串匹配 */
  var RE_PUNCT = /[\s，。,.;；:：!！?？'"“”‘’、\-_/\\()（）[\]]/g;
  function norm(s) { return String(s || '').toLowerCase().replace(RE_PUNCT, ''); }

  var LANGS = (DATA.meta && DATA.meta.langs) || ['zh', 'zh-Hant', 'en'];

  /* 兜底话术的数据先存一份：下面 DATA.generic 要让位给取值函数，
     不存这份的话数据会被同名函数覆盖，页面里就走不了兜底流程。 */
  var GENERIC = DATA.generic;

  /* 每种语言的说法提前归一化：匹配时不再做正则，纯字符串 indexOf */
  var PREP = {
    redflags: (DATA.redflags || []).map(function (it) {
      var per = {};
      LANGS.forEach(function (lg) {
        per[lg] = (it[lg] && it[lg].patterns || []).map(function (raw) {
          var p = norm(raw);
          return { p: p, len: p.length, raw: raw };
        }).filter(function (x) { return x.p; });
      });
      return { id: it.id, priority: it.priority || 0, per: per };
    }),
    topics: (DATA.topics || []).map(function (it) {
      var per = {};
      LANGS.forEach(function (lg) {
        per[lg] = (it[lg] && it[lg].patterns || []).map(function (raw) {
          var p = norm(raw);
          return { p: p, len: p.length, raw: raw };
        }).filter(function (x) { return x.p; });
      });
      return { id: it.id, priority: it.priority || 0, dept: it.dept || null, per: per };
    })
  };

  function langOrder(lang) {
    var l = LANGS.indexOf(lang) >= 0 ? lang : LANGS[0];
    return [l].concat(LANGS.filter(function (x) { return x !== l; }));
  }

  /* 在一组条目里找「最长说法赢」，平手看 priority（小的赢），再平手看语言顺序 */
  function scan(list, t, order) {
    var best = null;
    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      for (var li = 0; li < order.length; li++) {
        var lg = order[li];
        var arr = it.per[lg];
        if (!arr) continue;
        for (var k = 0; k < arr.length; k++) {
          if (t.indexOf(arr[k].p) < 0) continue;
          var cand = { item: it, lang: lg, pattern: arr[k].raw, len: arr[k].len, li: li };
          if (!best) { best = cand; continue; }
          if (cand.len > best.len) { best = cand; continue; }
          if (cand.len === best.len && it.priority < best.item.priority) best = cand;
        }
      }
    }
    return best;
  }

  /* 对外主入口：先红旗（安全优先），后主题；命中返回 { kind, id, pattern, lang } */
  DATA.match = function (text, lang) {
    var t = norm(text);
    if (!t) return null;
    var order = langOrder(lang);
    var rf = scan(PREP.redflags, t, order);
    if (rf) {
      return { kind: 'redflag', id: rf.item.id, lang: rf.lang, pattern: rf.pattern, score: rf.len };
    }
    var tp = scan(PREP.topics, t, order);
    if (tp) {
      return { kind: 'topic', id: tp.item.id, lang: tp.lang, pattern: tp.pattern, score: tp.len };
    }
    return null;
  };

  function block(id, lang, kind) {
    var list = kind === 'redflag' ? DATA.redflags : DATA.topics;
    var order = langOrder(lang);
    for (var i = 0; i < list.length; i++) {
      if (list[i].id !== id) continue;
      for (var li = 0; li < order.length; li++) {
        var b = list[i][order[li]];
        if (b) return { entry: list[i], body: b, lang: order[li] };
      }
    }
    return null;
  }

  /* 取一条红旗 / 一个主题 / 兜底话术（语言跟随，界面语言没有就退回中文） */
  DATA.redflag = function (id, lang) { return block(id, lang, 'redflag'); };
  DATA.topic = function (id, lang) { return block(id, lang, 'topic'); };
  DATA.generic = function (lang) {
    var order = langOrder(lang);
    for (var i = 0; i < order.length; i++) {
      if (GENERIC && GENERIC[order[i]]) return { body: GENERIC[order[i]], lang: order[i] };
    }
    return null;
  };

  /* 把来源数组格式化成「来源：机构 · 资料名（年份）」；年份宁缺勿编 */
  DATA.cite = function (sources, lang) {
    if (!Array.isArray(sources) || !sources.length) return '';
    var parts = sources.map(function (s) {
      return s.title ? (s.org + ' · ' + s.title) : s.org;
    });
    return parts.join('；');
  };

  /* 主题名（用于点选 chips 与回显） */
  DATA.topicName = function (id, lang) {
    var tp = DATA.topic(id, lang);
    if (!tp || !tp.body || !tp.body.patterns || !tp.body.patterns.length) return id;
    return tp.body.patterns[0];
  };

  DATA.stats = function () {
    var rf = 0, tp = 0;
    LANGS.forEach(function (lg) {
      (DATA.redflags || []).forEach(function (x) { rf += (x[lg] && x[lg].patterns || []).length; });
      (DATA.topics || []).forEach(function (x) { tp += (x[lg] && x[lg].patterns || []).length; });
    });
    return {
      redflags: (DATA.redflags || []).length,
      topics: (DATA.topics || []).length,
      patterns: rf + tp,
      redflagPatterns: rf,
      topicPatterns: tp,
      langs: LANGS.length
    };
  };

  g.XiaoYiLingKB = DATA;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ============================================================
   小医灵 · 医疗预问诊智能体（挂在适老预约挂号页上的「健康顾问」）

   它是谁：
   网页里一个会漂浮的医疗蓝绿色小光点，点一下变成小机器人，
   陪老人把症状一条一条理清楚——先排危险信号，再问关键问题，
   最后给分级建议和公开科普。它不诊断、不开药、不处理急症，
   只是把「该不该去医院、多快、大概看哪一科」帮老人想明白。

   形态状态机（与前端控制器约定，顺序不可乱）：
     idle      漂浮：20-40px/s 缓慢移动、随机转向、碰视口边缘反弹；
                同时避开输入框、按钮、弹窗关闭钮、视频控件和重要文字，
                不遮挡老人操作。
     hover     悬停：轻微放大、发光，气泡提示「点击问诊 / 长按拖动」。
