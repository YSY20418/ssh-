<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<!-- 单文件版：样式与脚本已内联，可单独上传或传到手机直接打开 -->
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D62">
<meta name="description" content="小鱼兒 · 面向高龄老人的预约挂号服务，全程只需点选，可语音朗读、可对它说话让它代办，可调大字体。">
<title>小鱼兒 · 预约挂号</title>
<style>
/* ============================================================
   小鱼兒 · 预约挂号（适老版）
   配色：背景暖米白 #F2F0EA / 卡片纯白 / 主色深青绿 #2F5D62 /
        提示区淡米黄 #FAF3E4。不使用高饱和纯黄纯红。
   字号：正文 19.5px 起、标题 29px 起，可整体放大缩小。
   自适应：电脑优先 —— ≥1024px 左流程 + 右常驻摘要双栏；
           窄屏自动收成单列，等比缩放兜底。
   ============================================================ */

:root {
  --bg: #f2f0ea;
  --card: #ffffff;
  --brand: #2f5d62;
  --brand-dark: #22474b;
  --brand-soft: #e3edec;
  --notice: #faf3e4;
  --notice-line: #e6dcc0;
  --ink: #1f2b33;          /* 正文主色，与白底对比度 > 12:1 */
  --ink-2: #43535c;        /* 次要文字，加深以提升可读性 */
  --muted: #5e5c54;        /* 辅助说明，加深后仍保持柔和 */
  --line: #d5d0c5;
  --off-bg: #e9e5dc;       /* 约满 / 不可用 */
  --off-ink: #7a766c;
  --ok: #3f6b52;
  --ok-soft: #e8f1ea;
  --warn-ink: #7d5426;
  --radius: 16px;
  --radius-sm: 12px;
  --radius-lg: 22px;
  --tap: 64px;             /* 按钮最小高度 */
  --fs: 1;                 /* 字体缩放系数，由按钮控制 */
  --shell: 1160px;         /* 宽屏内容总宽 */
  --shadow: 0 2px 8px rgba(31, 43, 51, 0.07);
  --shadow-lift: 0 10px 28px rgba(31, 43, 51, 0.13);
}

* { box-sizing: border-box; }

html {
  font-size: calc(17px * var(--fs));
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC",
               "Noto Sans CJK SC", "Heiti SC", system-ui, sans-serif;
  font-size: 1.15rem;         /* ≈19.5px */
  line-height: 1.75;
  padding-bottom: 8.5rem;     /* 让底部固定栏不遮内容 */
}

/* 医院氛围背景：纯内联 SVG 绘制的抽象图形（楼宇轮廓 + 十字 + 心电线），
   不含任何文字与真实医院标识，透明度极低，不影响正文对比度 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.06;
  background-repeat: no-repeat;
  background-position: center bottom;
  background-size: 1200px auto;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='760' viewBox='0 0 1200 760'><g fill='%232f5d62'><path opacity='.55' d='M0 640 L0 470 L92 470 L92 402 L198 402 L198 470 L300 470 L300 522 L418 522 L418 430 L520 430 L520 522 L642 522 L642 452 L760 452 L760 522 L880 522 L880 480 L1000 480 L1000 542 L1200 542 L1200 640 Z'/><path opacity='.32' d='M150 128 h58 v-58 h48 v58 h58 v48 h-58 v58 h-48 v-58 h-58 z'/><path opacity='.26' d='M905 206 h42 v-42 h34 v42 h42 v34 h-42 v42 h-34 v-42 h-42 z'/><path opacity='.22' fill='none' stroke='%232f5d62' stroke-width='7' d='M0 706 h250 l28-72 l38 142 l44-192 l38 118 l30-4 h296 l30-58 l34 88 l38-28 h312'/></g></svg>");
}

/* 背景之上的所有内容需要抬升一层 */
.topbar, .stepbar, .wrap, .actionbar, .idlebar, .modal, .aifab, .ai { position: relative; z-index: 1; }
.topbar { z-index: 30; }
.stepbar { z-index: 29; }
.actionbar { z-index: 40; }
.idlebar { z-index: 41; }
.modal { z-index: 50; }

/* ---------- 通用排版 ---------- */
.title {
  font-size: 1.75rem;         /* ≈29px */
  line-height: 1.4;
  font-weight: 700;
  margin: 0.2rem 0 0.5rem;
  letter-spacing: 0.01em;
}
.title--success { color: var(--ok); }

.subtitle {
  font-size: 1.3rem;          /* ≈22px */
  font-weight: 700;
  margin: 1.6rem 0 0.7rem;
  color: var(--ink);
}

.lead {
  font-size: 1.2rem;          /* ≈20px */
  color: var(--ink-2);
  margin: 0 0 1.2rem;
}

.hint {
  font-size: 1.05rem;
  color: var(--muted);
  margin: 0.8rem 0 0;
}

/* 电脑优先：宽屏给主内容包一张「纸」，让层次更清楚 */
.wrap {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 1.2rem 1.1rem 2rem;
}
.shell { display: grid; gap: 1.1rem; grid-template-columns: 1fr; }

.skip-link {
  position: absolute;
  left: -9999px;
  background: #fff;
  color: var(--brand);
  padding: 0.6rem 1rem;
  border-radius: var(--radius-sm);
  z-index: 60;
}
.skip-link:focus { left: 1rem; top: 1rem; outline: 3px solid var(--brand); }

.sr-live {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- 顶部 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
/* 顶部一条主色渐变，增加层次与「医疗机构」的观感 */
.topbar::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--brand-dark), var(--brand) 45%, #528f93);
}
.topbar__inner {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0.8rem 1.1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 0.7rem; }
.brand__mark {
  width: 3rem; height: 3rem;
  display: grid; place-items: center;
  background: var(--brand);
  color: #fff;
  border-radius: var(--radius-sm);
  font-size: 1.6rem;
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(47, 93, 98, 0.28);
}
.brand__text { display: flex; flex-direction: column; line-height: 1.2; }
.brand__name { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.04em; }
.brand__sub { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.25em; }

/* 虚构院名（不指向任何现实医院） */
.brand__sep {
  width: 1px;
  align-self: stretch;
  min-height: 2.4rem;
  background: var(--line);
  margin: 0 0.2rem;
}
.brand__text--hospital { border-left: 0; }
.brand__hospital {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: 0.02em;
}
.brand__hospital-sub {
  font-size: 0.85rem;
  color: var(--muted);
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.topbar__tools { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.toolgroup {
  display: flex;
  gap: 0.35rem;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 0.25rem;
}
.toolbtn {
  min-height: 2.9rem;
  min-width: 3.2rem;
  padding: 0 0.75rem;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink-2);
  font-size: 1.05rem;
  font-family: inherit;
  cursor: pointer;
}
.toolbtn[aria-pressed="true"] {
  background: var(--brand);
  color: #fff;
  font-weight: 700;
}

/* ---------- 步骤条（跟着顶栏吸顶，走过的步骤可以点回去改） ---------- */
.stepbar {
  background: var(--bg);
  position: sticky;
  top: var(--topbar-h, 6.2rem);
  z-index: 29;
  border-bottom: 1px solid var(--line);
}
.stepbar__list {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0.7rem 1.1rem;
  list-style: none;
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
}
.stepbar__item {
  flex: 1 0 auto;
  display: flex;
  align-items: center;
  border-radius: 999px;
  background: #fff;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 1rem;
  white-space: nowrap;
  overflow: hidden;
}
.stepbar__btn {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  width: 100%;
  min-height: 2.6rem;
  padding: 0.3rem 0.7rem;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: inherit;
  font-family: inherit;
  font-size: 1rem;
  white-space: nowrap;
  cursor: pointer;
}
.stepbar__btn:disabled { cursor: default; }
.stepbar__btn:not(:disabled):hover { background: var(--brand-soft); }
.stepbar__btn:focus-visible { outline: 3px solid var(--brand); outline-offset: -2px; }
.stepbar__no {
  width: 1.6rem; height: 1.6rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--off-bg);
  color: var(--off-ink);
  font-size: 0.95rem;
  font-weight: 700;
}
.stepbar__item[data-state="active"] {
  border-color: var(--brand);
  border-width: 2px;
  background: var(--brand-soft);
  color: var(--brand);
  font-weight: 700;
}
.stepbar__item[data-state="active"] .stepbar__no { background: var(--brand); color: #fff; }
.stepbar__item[data-state="done"] { color: var(--ok); border-color: var(--ok-soft); }
.stepbar__item[data-state="done"] .stepbar__no { background: var(--ok); color: #fff; }

/* ---------- 卡片 / 网格 ---------- */
.grid { display: grid; gap: 0.9rem; grid-template-columns: 1fr; }

.bigcard {
  display: flex;
  align-items: center;
  gap: 1rem;
  width: 100%;
  min-height: var(--tap);
  padding: 1.15rem 1.2rem;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: inherit;
  font-size: 1.25rem;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
}
.bigcard:hover { box-shadow: var(--shadow-lift); }
.bigcard:active { transform: scale(0.985); }
.bigcard:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }

/* 选中态：主色底 + 深描边 + 投影，老人一眼能看出选了哪个 */
.bigcard[aria-pressed="true"] {
  background: var(--brand);
  border-color: var(--brand-dark);
  color: #fff;
  box-shadow: 0 6px 18px rgba(47, 93, 98, 0.28);
}
.bigcard[aria-pressed="true"] .bigcard__desc,
.bigcard[aria-pressed="true"] .bigcard__meta { color: #eaf3f2; }

.bigcard__icon {
  flex: 0 0 auto;
  width: 3.4rem; height: 3.4rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--brand-soft);
  color: var(--brand);
  font-size: 1.5rem;
  font-weight: 700;
}
/* 选中态：主色底 + 深描边 + 投影，老人一眼能看出选了哪个。
   图标位改浅青底而非纯白：内联 SVG 是白底图标，纯白底会让它「化掉」。 */
.bigcard[aria-pressed="true"] .bigcard__icon { background: #eef5f4; color: var(--brand); }

.bigcard__main { display: flex; flex-direction: column; gap: 0.15rem; flex: 1 1 auto; }
.bigcard__title { font-size: 1.3rem; font-weight: 700; line-height: 1.4; }
.bigcard__desc { font-size: 1.05rem; color: var(--ink-2); line-height: 1.55; }
.bigcard__meta { font-size: 1rem; color: var(--muted); }
.bigcard__check {
  flex: 0 0 auto;
  font-size: 1.6rem;
  font-weight: 700;
  color: transparent;
}
.bigcard[aria-pressed="true"] .bigcard__check { color: #fff; }

.bigcard--start {
  border-color: var(--brand);
  background: var(--brand-soft);
  font-size: 1.4rem;
  min-height: 6rem;
}
.bigcard--start .bigcard__icon { background: var(--brand); color: #fff; }

/* 不可用（约满） */
.bigcard--off {
  background: var(--off-bg);
  border-color: var(--off-bg);
  color: var(--off-ink);
  cursor: not-allowed;
  box-shadow: none;
}
.bigcard--off .bigcard__icon { background: #d8d3c8; color: var(--off-ink); }
.bigcard--off .bigcard__desc { color: var(--off-ink); }
.bigcard--off:active { transform: none; }

/* 医生头像（用姓氏首字生成，不依赖图片，离线可用） */
.avatar {
  flex: 0 0 auto;
  width: 4.2rem; height: 4.2rem;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 1.7rem;
  font-weight: 700;
  color: #fff;
  background: var(--brand);
}
.bigcard[aria-pressed="true"] .avatar { box-shadow: 0 0 0 3px #fff; }

/* ---------- 图标：全部为内联 SVG ----------
   不加载任何图片，离线可用；矢量所以放到多大都清楚；
   轻轻一层投影，让图标像贴在卡片上，而不是压在上面。 */
.ico {
  display: block;
  flex: 0 0 auto;
  width: 1.45rem; height: 1.45rem;
  filter: drop-shadow(0 1px 1.5px rgba(47, 93, 98, 0.22));
}
.bigcard__icon .ico { width: 2.2rem; height: 2.2rem; }
.bigcard__icon--lg .ico { width: 2.8rem; height: 2.8rem; }
.notice__strong .ico { width: 2.3rem; height: 2.3rem; }
.brand__ico .ico { width: 1.5rem; height: 1.5rem; }
.ability__ico .ico { width: 2.5rem; height: 2.5rem; }
.tips__ico .ico { width: 2.1rem; height: 2.1rem; }
.protect__ico .ico { width: 2.3rem; height: 2.3rem; }

/* 顶栏院名前的院徽 */
.brand__hospital-row { display: flex; align-items: center; gap: 0.35rem; }
.brand__ico { flex: 0 0 auto; display: grid; place-items: center; width: 1.5rem; height: 1.5rem; }

/* 第 0 步：本页能替您做什么（四个智能体各管一段） */
.ability {
  margin-top: 1.3rem;
  padding: 1.1rem 1.2rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.ability__title { margin: 0 0 0.8rem; font-size: 1.1rem; font-weight: 700; color: var(--brand); }
.ability__list { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
.ability__item { display: flex; align-items: center; gap: 0.8rem; }
.ability__ico {
  flex: 0 0 auto;
  width: 3.3rem; height: 3.3rem;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  background: var(--brand-soft);
}
.ability__text { font-size: 1.05rem; color: var(--ink-2); line-height: 1.6; }

/* 成功页：到院那天的小提醒 */
.protect {
  margin-top: 1.2rem;
  padding: 1.1rem 1.2rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.protect__title { margin: 0 0 0.7rem; font-size: 1.1rem; font-weight: 700; color: var(--brand); }
.protect__row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.protect__item { display: flex; align-items: center; gap: 0.6rem; font-size: 1.05rem; color: var(--ink-2); line-height: 1.45; }
.protect__ico {
  flex: 0 0 auto;
  width: 2.7rem; height: 2.7rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--brand-soft);
}

/* ---------- 语音条 ---------- */
.voicebar {
  display: flex;
  gap: 0.7rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.btn--voice {
  flex: 1 1 auto;
  background: var(--brand-soft);
  border-color: var(--brand);
  color: var(--brand);
}
.btn--voice:hover { background: #d6e6e5; }
.btn__icon--brand { background: var(--brand); }
/* 正在朗读：按钮变成「停止朗读」的样子，老人一眼看得出 */
.btn--voice[data-speaking="1"] { background: var(--brand); color: #fff; }
.btn--voice[data-speaking="1"] .btn__icon--brand { background: #fff; color: var(--brand); }

.footnote {
  margin: 2rem 0 0;
  font-size: 0.95rem;
  color: #79766d;
  text-align: center;
  line-height: 1.6;
}

/* ---------- 提示区 / 结果区 ---------- */
.notice {
  background: var(--notice);
  border: 1px solid var(--notice-line);
  border-radius: var(--radius);
  padding: 1.1rem 1.2rem;
  margin: 0 0 1.2rem;
}
.notice--result { background: var(--card); border-color: var(--brand); border-width: 2px; }
.notice--tips { margin-top: 1.4rem; }
.notice__label { font-size: 1.05rem; color: var(--warn-ink); margin: 0 0 0.2rem; font-weight: 700; }
.notice__strong {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-size: 1.55rem; font-weight: 700; color: var(--brand);
  margin: 0.1rem 0 0.3rem;
}
.notice__text { font-size: 1.15rem; color: var(--ink-2); margin: 0; line-height: 1.7; }
.notice__row { margin-top: 0.8rem; display: flex; gap: 0.7rem; flex-wrap: wrap; }

/* ---------- 摘要表 ---------- */
.summary {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 0.4rem 1.2rem;
  margin: 0;
}
.summary__row {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--line);
}
.summary__row:last-child { border-bottom: 0; }
.summary__k { color: var(--muted); font-size: 1.05rem; flex: 0 0 auto; }
.summary__v { font-size: 1.2rem; font-weight: 700; text-align: right; }

/* ---------- 成功页 ---------- */
.success { text-align: center; padding: 0.5rem 0 0.3rem; }
.success__badge {
  width: 5.4rem; height: 5.4rem;
  margin: 0 auto 0.7rem;
  display: grid; place-items: center;
  background: transparent;
  color: var(--ok);
}
.success__badge .ico { width: 5.4rem; height: 5.4rem; }
.ticket {
  background: var(--card);
  border: 2px solid var(--ok);
  border-radius: var(--radius-lg);
  padding: 1.2rem 1.3rem;
  margin-top: 1rem;
}
.ticket__hospital {
  margin: 0 0 0.2rem;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: 0.02em;
}
.ticket__no {
  font-size: 2.1rem; font-weight: 700; color: var(--ok);
  letter-spacing: 0.04em;
}
.ticket__label { font-size: 1rem; color: var(--muted); }

.tips { list-style: none; margin: 0.6rem 0 0; padding: 0; display: grid; gap: 0.55rem; }
.tips__item {
  display: flex; align-items: flex-start; gap: 0.7rem;
  font-size: 1.2rem; color: var(--ink); line-height: 1.6;
}
/* 每条提醒前面放一个图形：不认字也看得懂要带什么、去哪 */
.tips__ico {
  flex: 0 0 auto;
  width: 2.2rem; height: 2.2rem;
  display: grid; place-items: center;
  margin-top: 0.15rem;
}

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: var(--tap);
  padding: 0.7rem 1.3rem;
  border-radius: var(--radius);
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-family: inherit;
  font-size: 1.25rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.12s ease, transform 0.12s ease;
}
.btn:active { transform: scale(0.985); }
.btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-dark); }
.btn--primary:disabled,
.btn:disabled {
  background: var(--off-bg);
  border-color: var(--off-bg);
  color: var(--off-ink);
  cursor: not-allowed;
}
.btn--help { background: var(--notice); border-color: var(--notice-line); color: var(--warn-ink); }
.btn--sm { min-height: 3.2rem; padding: 0.35rem 1rem; font-size: 1.1rem; }
/* 必选项做完了，「下一步」轻轻呼吸一下，告诉老人可以点了 */
.btn--ready { animation: readyPulse 2s ease-in-out infinite; }
@keyframes readyPulse {

  function svg(name) {

    return '<svg class="ico ico--' + name + '" viewBox="0 0 48 48" role="img" aria-hidden="true" focusable="false">' +

  }

  /* 取一个可直接 appendChild 的元素；图标名不存在时返回 null，由调用方兜底 */
  function element(name) {
    if (typeof document === 'undefined') return null;
    var markup = svg(name);
    if (!markup) return null;
    var box = document.createElement('span');
    box.className = 'ico-box';
    box.setAttribute('aria-hidden', 'true');
    box.innerHTML = markup;
    return box.firstChild || null;
  }

    names: NAMES,
    has: function (name) { return Object.prototype.hasOwnProperty.call(ICONS, name); },
    svg: svg,

  };

  /* 就诊人：虚构演示数据，身份证与手机号一律脱敏 */
  var PATIENTS = [
    { id: 'self', relKey: 'patient.self', name: { zh: '张桂英', 'zh-Hant': '張桂英', en: 'Zhang Guiying' }, sex: { zh: '女', 'zh-Hant': '女', en: 'F' }, age: 72, idCard: '4401**********1234', phone: '138****5678' },
    { id: 'spouse', relKey: 'patient.spouse', name: { zh: '李国强', 'zh-Hant': '李國強', en: 'Li Guoqiang' }, sex: { zh: '男', 'zh-Hant': '男', en: 'M' }, age: 75, idCard: '4401**********0871', phone: '139****2460' },
    { id: 'family', relKey: 'patient.family', name: { zh: '张小明', 'zh-Hant': '張小明', en: 'Zhang Xiaoming' }, sex: { zh: '男', 'zh-Hant': '男', en: 'M' }, age: 41, idCard: '4401**********3355', phone: '135****8899' }
  ];

  var PAYS = [
    { id: 'medical', icon: '保', ico: 'shield-cross', key: 'pay.medical', descKey: 'pay.medicalDesc' },
    { id: 'wechat', icon: '微', ico: 'phone', key: 'pay.wechat', descKey: 'pay.wechatDesc' },
    { id: 'alipay', icon: '支', ico: 'qr-code', key: 'pay.alipay', descKey: 'pay.alipayDesc' },
    { id: 'hospital', icon: '院', ico: 'cash', key: 'pay.hospital', descKey: 'pay.hospitalDesc' }
  ];

  /* ---------------- 状态 ---------------- */
  var state = {
    step: 0,
    lang: 'zh',
    font: 1,
    symptom: null,
    dept: null,
    deptPicked: false,
    doctor: null,
    date: null,
    slot: null,
    patient: 'self',
    pay: null,
    ticketNo: null
  };

  var autoSpeak = false; // 首次交互后才自动朗读，避免浏览器拦截

  /* ---------------- 工具 ---------------- */
  /* 往容器里放一个内联 SVG 图标。
     图标库没加载、或图标名不存在时返回 false，由调用方用文字兜底 —— 页面不会因此空掉。 */
  function fillIcon(host, name) {
    var lib = window.XiaoYuErIcons;
    if (!host || !lib || !name) return false;
    var el = lib.element(name);
    if (!el) return false;
    host.textContent = '';
    host.appendChild(el);
    return true;
  }
  function $(sel) { return document.querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  function t(key, vars) {
    var dict = I18N[state.lang] || I18N.zh;
    var raw = dict[key] != null ? dict[key] : (I18N.zh[key] != null ? I18N.zh[key] : key);
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        raw = raw.split('{' + k + '}').join(vars[k]);
      });
    }
    return raw;
  }
  function pick(obj) {
    if (obj == null) return '';
    if (typeof obj === 'string') return obj;
    return obj[state.lang] != null ? obj[state.lang] : obj.zh;
  }
  function fmtTpl(key, vars) { return t(key, vars); }

  /* ---------------- 扩展点 ----------------
     外部模块（如语音助手）可以：
       1) 注册自己的三语文案 registerI18n
       2) 订阅重绘 onRender
     主程序的翻译表与渲染时机保持唯一来源，避免文案漂移。 */
  var renderHooks = [];
  function registerI18n(extra) {
    LANGS.forEach(function (l) {
      if (!extra[l]) return;
      Object.keys(extra[l]).forEach(function (k) { I18N[l][k] = extra[l][k]; });
    });
  }
  function onRender(fn) { if (typeof fn === 'function') renderHooks.push(fn); }

  function colorOf(id) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 9973;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initialOf(person) {
    var n = pick(person.name);
    return n.charAt(0);
  }

  /* 号源：确定性伪随机，保证同一医生同一天至少有一个时段可选 */
  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h;
  }
  function slotLeft(doctorId, dateId, slotId) {
    var n = hash(doctorId + '|' + dateId + '|' + slotId) % 13;
    var other = hash(doctorId + '|' + dateId + '|' + (slotId === 'am' ? 'pm' : 'am')) % 13;
    if (n === 0 && other === 0) n = 4;
    return n;
  }

  function dateOptions() {
    var now = new Date();
    var weekZh = ['日', '一', '二', '三', '四', '五', '六'];
    var weekEn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var keys = ['date.today', 'date.tomorrow', 'date.dayAfter'];
    return [0, 1, 2].map(function (i) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
      var md = state.lang === 'en'
        ? (d.getMonth() + 1) + '/' + d.getDate()
        : (d.getMonth() + 1) + '月' + d.getDate() + '日';
      var week = state.lang === 'en' ? weekEn[d.getDay()] : weekZh[d.getDay()];
      return {
        id: 'd' + i,
        iso: d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(),
        label: t(keys[i]),
        text: t('date.fmt', { label: t(keys[i]), md: md, week: week }),
        week: week
      };
    });
  }

  function currentDoctor() {
    if (!state.doctor || !state.dept) return null;
    var list = DOCTORS[state.dept] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === state.doctor) return list[i];
    return null;
  }
  function currentPatient() {
    for (var i = 0; i < PATIENTS.length; i++) if (PATIENTS[i].id === state.patient) return PATIENTS[i];
    return PATIENTS[0];
  }
  function currentPay() {
    for (var i = 0; i < PAYS.length; i++) if (PAYS[i].id === state.pay) return PAYS[i];
    return null;
  }
  function slotText() {
    if (!state.date || !state.slot) return '';
    var d = dateOptions().filter(function (o) { return o.id === state.date; })[0];
    var s = SLOTS.filter(function (o) { return o.id === state.slot; })[0];
    if (!d || !s) return '';
    return d.text + ' · ' + t(s.labelKey) + ' ' + t(s.timeKey);
  }

  /* ---------------- 语音 ---------------- */
  function speechSupported() { return typeof window !== 'undefined' && 'speechSynthesis' in window; }

  /** 朗读按钮在「念」与「停」之间切换，老人不用找另一个按钮 */
  function setSpeaking(on) {
    var btn = $('#btn-speak');
    if (!btn) return;
    var lbl = btn.querySelector('[data-i18n]');
    btn.setAttribute('data-speaking', on ? '1' : '0');
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (lbl) lbl.textContent = on ? t('voice.stop') : t('voice.listen');
  }

  function speak(text) {
    setLive(text);
    if (!speechSupported()) { setLive(t('voice.unsupported')); return false; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = SPEECH_LANG[state.lang] || 'zh-CN';
      u.rate = 0.92;
      u.onend = function () { setSpeaking(false); };
      u.onerror = function () { setSpeaking(false); };
      setSpeaking(true);
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang && voices[i].lang.replace('_', '-').toLowerCase().indexOf(u.lang.toLowerCase().slice(0, 2)) === 0) {
          u.voice = voices[i];
          break;
        }
      }
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) {
      return false;
    }
  }
  function stopSpeak() {
    if (speechSupported()) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    setSpeaking(false);
  }
  function setLive(text) { var el = $('#live'); if (el) el.textContent = text; }

  function stepVoice() {
    var lines = [];
    if (state.step === 0) {
      lines.push(t('step0.title'), t('step0.lead'), t('step0.cta'));
    } else if (state.step === 1) {
      lines.push(t('step1.title'), t('step1.lead'));
      SYMPTOMS.forEach(function (s) { lines.push(pick(s.name)); });
      if (state.dept) lines.push(t('step1.recommend', { symptom: pick(currentSymptom().name), dept: pick(DEPTS[state.dept].name) }));
    } else if (state.step === 2) {
      lines.push(t('step2.title'), t('step2.lead', { dept: state.dept ? pick(DEPTS[state.dept].name) : PLACEHOLDER }));
      (DOCTORS[state.dept] || []).forEach(function (d) { lines.push(pick(d.name) + '，' + pick(d.title) + '，' + pick(d.good)); });
    } else if (state.step === 3) {
      lines.push(t('step3.title'), t('step3.lead'));
      dateOptions().forEach(function (d) { lines.push(d.text); });
      SLOTS.forEach(function (s) {
        var left = state.doctor ? slotLeft(state.doctor, state.date || 'd0', s.id) : 1;
        lines.push(t(s.labelKey) + ' ' + t(s.timeKey) + '，' + (left > 0 ? t('slot.left', { n: left }) : t('slot.full')));
      });
      lines.push(t('step3.fullHint'));
    } else if (state.step === 4) {
      lines.push(t('step4.title'), t('step4.lead'));
      var p = currentPatient();
      var dept4 = state.dept ? DEPTS[state.dept] : null;
      var doc4 = currentDoctor();
      lines.push(t('summary.patient') + ' ' + pick(p.name) + '，' + t('patient.idCard') + ' ' + p.idCard);
      lines.push(t('summary.dept') + ' ' + (dept4 ? pick(dept4.name) : PLACEHOLDER) + '，' + t('summary.doctor') + ' ' + (doc4 ? pick(doc4.name) : PLACEHOLDER) + '，' + t('summary.time') + ' ' + (slotText() || PLACEHOLDER));
      PAYS.forEach(function (pay) { lines.push(t(pay.key) + '，' + t(pay.descKey)); });
    } else if (state.step === 5) {
      lines.push(t('step5.title'), t('step5.lead'));
      lines.push(t('ticket.no') + ' ' + state.ticketNo);
      lines.push(t('step5.tip1'), t('step5.tip2'), t('step5.tip3'));
    }
    return lines.join('。');
  }

  function currentSymptom() {
    for (var i = 0; i < SYMPTOMS.length; i++) if (SYMPTOMS[i].id === state.symptom) return SYMPTOMS[i];
    return SYMPTOMS[0];
  }

  /* ---------------- 渲染 ---------------- */
  function applyStaticI18n() {
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    $$('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    /* 页面里写死的图标占位（顶栏院名、能力带、到院提醒等）在这里补成内联 SVG */
    $$('[data-icon]').forEach(function (el) { fillIcon(el, el.getAttribute('data-icon')); });
    document.title = t('doc.title');
    document.documentElement.lang = HTML_LANG[state.lang] || 'zh-CN';
    document.documentElement.setAttribute('data-lang', state.lang);
  }

  function renderStepbar() {
    var bar = $('#stepbar');
    bar.innerHTML = '';
    var steps = [0, 1, 2, 3, 4, 5];
    steps.forEach(function (i) {
      var done = i < state.step;
      var li = document.createElement('li');
      li.className = 'stepbar__item';
      li.setAttribute('data-state', i === state.step ? 'active' : (done ? 'done' : 'todo'));

      /* 走过的步骤可以点回去改，没走过的不能跳——防止老人误触跳步 */
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'stepbar__btn';
      btn.setAttribute('data-action', 'gostep');
      btn.setAttribute('data-value', String(i));
      if (i === state.step) btn.setAttribute('aria-current', 'step');
      btn.disabled = !done || state.step === 5;
      btn.setAttribute('aria-label', t('stepbar.' + i) + (btn.disabled ? '' : '（可回去修改）'));

      var no = document.createElement('span');
      no.className = 'stepbar__no';
      no.textContent = done ? '✓' : String(i);
      var label = document.createElement('span');
      label.textContent = t('stepbar.' + i);
      btn.appendChild(no);
      btn.appendChild(label);
      li.appendChild(btn);
      bar.appendChild(li);
    });
  }

  function optionCard(opts) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bigcard' + (opts.off ? ' bigcard--off' : '');
    btn.setAttribute('aria-pressed', opts.selected ? 'true' : 'false');
    if (opts.off) { btn.disabled = true; btn.setAttribute('aria-disabled', 'true'); }
    if (opts.action) btn.setAttribute('data-action', opts.action);
    if (opts.value) btn.setAttribute('data-value', opts.value);

    if (opts.avatarColor) {
      var av = document.createElement('span');
      av.className = 'avatar';
      av.style.background = opts.avatarColor;
      av.setAttribute('aria-hidden', 'true');
      av.textContent = opts.avatarText || '';
      btn.appendChild(av);
    } else if (opts.icon || opts.iconSvg) {
      var ic = document.createElement('span');
      ic.className = 'bigcard__icon';
      ic.setAttribute('aria-hidden', 'true');
      if (!fillIcon(ic, opts.iconSvg)) ic.textContent = opts.icon || '';
      btn.appendChild(ic);
    }

    var main = document.createElement('span');
    main.className = 'bigcard__main';
    var ti = document.createElement('span');
    ti.className = 'bigcard__title';
    ti.textContent = opts.title;
    main.appendChild(ti);
    if (opts.desc) {
      var de = document.createElement('span');
      de.className = 'bigcard__desc';
      de.textContent = opts.desc;
      main.appendChild(de);
    }
    if (opts.meta) {
      var me = document.createElement('span');
      me.className = 'bigcard__meta';
      me.textContent = opts.meta;
      main.appendChild(me);
    }
    btn.appendChild(main);

    if (!opts.off) {
      var ck = document.createElement('span');
      ck.className = 'bigcard__check';
      ck.setAttribute('aria-hidden', 'true');
      ck.textContent = '✓';
      btn.appendChild(ck);
    }
    return btn;
  }

    dl.style.border = 'none';
    dl.style.padding = '0';
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'summary__row';
      var k = document.createElement('dt');
      k.className = 'summary__k';
      k.textContent = r[0];
      var v = document.createElement('dd');
      v.className = 'summary__v';
      v.textContent = r[1];
      row.appendChild(k);
      row.appendChild(v);
      dl.appendChild(row);
    });
    box.appendChild(dl);
  }

  /**
   * 就地更新勾选状态：不重建列表，焦点与朗读位置不丢，
   * 老人用键盘或读屏时不会「跳到别处」。
   */
  function markSelected(containerSel, value) {
    var cards = $$(containerSel + ' .bigcard');
    for (var i = 0; i < cards.length; i++) {
      var isOn = cards[i].getAttribute('data-value') === value;
      cards[i].setAttribute('aria-pressed', isOn ? 'true' : 'false');
    }
  }

  /** 当前这一步的必选项是否已做完（做完才让「下一步」亮起来，引导老人点） */
  function stepReady() {
    if (state.step === 0) return true;
    if (state.step === 1) return !!state.symptom || !!state.deptPicked;
    if (state.step === 2) return !!state.doctor;
    if (state.step === 3) return !!state.date && !!state.slot;
    if (state.step === 4) return !!state.pay;
    return false;
  }
  function updateNextState() {
    var next = $('#btn-next');
    if (next && state.step < 5) next.classList.toggle('btn--ready', stepReady());
  }

  var PLACEHOLDER = '—'; /* 字段缺失时的占位符，避免渲染整块崩掉 */

  /* 单块渲染隔离：某一块数据缺失时，不让它拖垮整页渲染 */
  function safeRender(fn) { try { fn(); } catch (e) { /* 忽略单块异常 */ } }

  /* 底部操作栏高度：供悬浮按钮避让，避免遮住「需要帮助」等按钮 */
  function syncActionbar() {
    var bar = $('#actionbar');
    var h = (bar && !bar.hidden) ? bar.offsetHeight : 0;
    document.documentElement.style.setProperty('--actionbar-h', h + 'px');
  }

  function renderStep() {
    for (var i = 0; i <= 5; i++) {
      var el = $('#step-' + i);
      if (el) el.hidden = (i !== state.step);
    }
    document.body.setAttribute('data-step', String(state.step));
    var bar = $('#actionbar');
    bar.hidden = (state.step === 5);
    var prev = $('#btn-prev');
    prev.disabled = (state.step === 0);

    var next = $('#btn-next');
    var nextLabel = next.querySelector('[data-i18n]');
    nextLabel.textContent = state.step === 4 ? t('nav.nextSubmit') : t('nav.next');
    updateNextState();

    if (state.step === 1) safeRender(renderSymptoms);
    if (state.step === 2) safeRender(renderDoctors);
    if (state.step === 3) { safeRender(renderDates); safeRender(renderSlots); }
    if (state.step === 4) { safeRender(renderPatients); safeRender(renderSummary); safeRender(renderPays); }
    if (state.step === 5) safeRender(renderTicket);

    renderStepbar();
    renderAside();
    syncActionbar();
    window.scrollTo(0, 0);
    if (autoSpeak) { var voice = ''; try { voice = stepVoice(); } catch (e) { /* 播报文案异常不阻断渲染 */ } if (voice) speak(voice); }
    renderHooks.forEach(function (fn) { try { fn(); } catch (e) { /* 外部模块出错不影响主流程 */ } });
  }

  function render() { applyStaticI18n(); renderStep(); }

  /* ---------------- 弹窗 ---------------- */
  var pendingConfirm = false; // 确认窗开着时，语音助手的「确认」才生效
  function openModal(title, bodyHtml, actions) {
    var modal = $('#modal');
    $('#modal-title').textContent = title;
    var body = $('#modal-body');
    body.innerHTML = '';
    if (typeof bodyHtml === 'string') {
      body.innerHTML = bodyHtml;
    } else {
      body.appendChild(bodyHtml);
    }
    var act = $('#modal-actions');
    act.innerHTML = '';
    actions.forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn ' + (a.primary ? 'btn--primary' : 'btn--ghost');
      b.textContent = a.label;
      b.addEventListener('click', function () { closeModal(); if (a.onClick) a.onClick(); });
      act.appendChild(b);
    });
    modal.hidden = false;
    var first = act.querySelector('.btn');
    if (first) first.focus();
  }
  function closeModal() { $('#modal').hidden = true; pendingConfirm = false; }

  /** 焦点锁在弹窗里：老人按 Tab 不会跑到背后的页面上 */
  function trapFocus(container, ev) {
    var items = container.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }

  function alertDialog(text) {
    openModal(t('dialog.needTitle'), '<p>' + text + '</p>', [
      { label: t('dialog.ok'), primary: true }
    ]);
  }

  function helpDialog() {
    var ul = document.createElement('div');
    var list = document.createElement('ul');
    [t('dialog.help1'), t('dialog.help2'), t('dialog.help3')].forEach(function (line) {
      var li = document.createElement('li');
      li.textContent = line;
      list.appendChild(li);
    });
    ul.appendChild(list);
    openModal(t('dialog.helpTitle'), ul, [
      { label: t('dialog.helpSpeak'), onClick: function () { speak(t('dialog.helpTitle') + '。' + t('dialog.help1') + t('dialog.help2') + t('dialog.help3')); } },
      { label: t('dialog.close'), primary: true }
    ]);
    speak(t('dialog.helpTitle') + '。' + t('dialog.help1') + t('dialog.help2') + t('dialog.help3'));
  }

  function confirmDialog() {
    if (!canGoNext()) return; // 信息不全时不弹确认窗，先提示缺什么
    var body = t('dialog.confirmBody', {
      dept: pick(DEPTS[state.dept].name),
      doctor: pick(currentDoctor().name),
      time: slotText(),
      patient: pick(currentPatient().name),
      pay: t(currentPay().key)
    });
    openModal(t('dialog.confirmTitle'), '<p>' + body + '</p>', [
      { label: t('dialog.confirmNo') },
      { label: t('dialog.confirmYes'), primary: true, onClick: submitBooking }
    ]);
    pendingConfirm = true;
    speak(t('dialog.confirmTitle') + '。' + body);
  }

  function submitBooking() {
    pendingConfirm = false;
    var seed = hash(state.dept + state.doctor + state.date + state.slot + state.patient);
    state.ticketNo = 'A' + String(100 + (seed % 800));
    state.step = 5;
    renderStep();
    speak(stepVoice());
  }

  /* ---------------- 流程控制 ---------------- */
  function canGoNext() {
    if (state.step === 1) {
      if (!state.symptom && !state.deptPicked) { alertDialog(t('dialog.needSymptom')); return false; }
    } else if (state.step === 2) {
      if (!state.doctor) { alertDialog(t('dialog.needDoctor')); return false; }
    } else if (state.step === 3) {
      if (!state.date) { alertDialog(t('dialog.needDate')); return false; }
      if (!state.slot) { alertDialog(t('dialog.needSlot')); return false; }
    } else if (state.step === 4) {
      if (!state.pay) { alertDialog(t('dialog.needPay')); return false; }
    }
    return true;
  }

  function next() {
    if (state.step === 0) { state.step = 1; renderStep(); return; }
    if (!canGoNext()) return;
    if (state.step === 4) { confirmDialog(); return; } // 提交前强制确认，防误操作
    state.step = Math.min(5, state.step + 1);
    renderStep();
  }

  function prev() {
    if (state.step === 0) return;
    state.step -= 1;
    renderStep();
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (ev) {
    var el = ev.target;
    autoSpeak = true; // 任何一次点选之后即可自动朗读

    var close = el.closest ? el.closest('[data-close]') : null;
    if (close) { closeModal(); return; }

    var btn = el.closest ? el.closest('[data-action]') : null;
    if (btn) {
      var action = btn.getAttribute('data-action');
      var value = btn.getAttribute('data-value');
      handleAction(action, value);
      return;
    }

    var langBtn = el.closest ? el.closest('[data-lang-btn]') : null;
    if (langBtn) { setLang(langBtn.getAttribute('data-lang-btn')); return; }
  });

  function handleAction(action, value) {
    stopSpeak();
    switch (action) {
      case 'start':
        state.step = 1; renderStep(); break;
      case 'symptom':
        state.symptom = value;
        state.deptPicked = false;
        state.dept = SYMPTOMS.filter(function (s) { return s.id === value; })[0].dept;
        state.doctor = null; state.slot = null;
        markSelected('#symptom-list', value);
        ensureVisible('#symptom-list', value);
        showDeptResult();
        speak(t('step1.recommend', { symptom: pick(currentSymptom().name), dept: pick(DEPTS[state.dept].name) }));
        break;
      case 'dept':
        state.dept = value; state.doctor = null; state.slot = null;
        state.deptPicked = true;
        markSelected('#symptom-list', null);
        showDeptResult();
        $('#dept-alts').hidden = true;
        speak(pick(DEPTS[state.dept].name));
        break;
      case 'doctor':
        state.doctor = value; state.slot = null;
        markSelected('#doctor-list', value);
        ensureVisible('#doctor-list', value);
        speak(pick(currentDoctor().name) + '，' + pick(currentDoctor().title));
        break;
      case 'date':
        state.date = value; state.slot = null;
        markSelected('#date-list', value);
        ensureVisible('#date-list', value);
        renderSlots(); // 余量随日期变化，时段需重算
        speak(dateOptions().filter(function (d) { return d.id === value; })[0].text);
        break;
      case 'slot':
        if (state.doctor && slotLeft(state.doctor, state.date || 'd0', value) === 0) {
          alertDialog(t('dialog.slotFull'));
          updateNextState();
          return;
        }
        state.slot = value;
        markSelected('#slot-list', value);
        ensureVisible('#slot-list', value);
        speak(t(value === 'am' ? 'slot.am' : 'slot.pm'));
        break;
      case 'patient':
        state.patient = value;
        markSelected('#patient-list', value);
        ensureVisible('#patient-list', value);
        renderSummary();
        speak(pick(currentPatient().name));
        break;
      case 'pay':
        state.pay = value;
        markSelected('#pay-list', value);
        ensureVisible('#pay-list', value);
        speak(t(currentPay().key) + '，' + t(currentPay().descKey));
        break;
      case 'gostep':
        /* 只允许回到已经走过的步骤，不能跳过没完成的步骤 */
        var target = parseInt(value, 10);
        if (isNaN(target) || target >= state.step || state.step === 5) return;
        state.step = target;
        renderStep();
        break;
      case 'restart':
        resetAll(); state.step = 1; renderStep(); break;
      case 'done':
        resetAll(); state.step = 0; renderStep(); break;
    }
    updateNextState();
  }

  /** 刚点中的卡片如果滚出屏幕，轻轻带回可视区（不抢焦点，读屏位置不丢） */
  function ensureVisible(sel, value) {
    try {
      var el = $(sel + ' .bigcard[data-value="' + value + '"]');
      if (el && typeof el.scrollIntoView === 'function') el.scrollIntoView({ block: 'nearest' });
    } catch (e) { /* 部分浏览器不支持，忽略 */ }
  }

  function resetAll() {
    state.symptom = null; state.dept = null; state.deptPicked = false; state.doctor = null;
    state.date = null; state.slot = null; state.pay = null;
    state.patient = 'self'; state.ticketNo = null;
  }

  $('#btn-next').addEventListener('click', next);
  $('#btn-prev').addEventListener('click', function () { stopSpeak(); prev(); });
  $('#btn-help').addEventListener('click', function () { stopSpeak(); helpDialog(); });
  $('#btn-speak').addEventListener('click', function () { speak(stepVoice()); });
  $('#btn-stop').addEventListener('click', function () { stopSpeak(); setLive(''); });
  $('#dept-change').addEventListener('click', function () {
    var box = $('#dept-alts');
    if (box.hidden) renderAlts(); else { box.hidden = true; box.innerHTML = ''; }
  });

  document.addEventListener('keydown', function (ev) {
    if ($('#modal').hidden) return;
    if (ev.key === 'Escape') { closeModal(); return; }
    if (ev.key === 'Tab') trapFocus($('#modal'), ev);
  });

  /* ---------------- 字体缩放 ---------------- */
  var FONT_MIN = 0.9, FONT_MAX = 1.5, FONT_STEP = 0.15;
  function applyFont() {
    document.documentElement.style.setProperty('--fs', String(state.font));
    store('xiaoyuer.font', String(state.font));
    syncTopbar(); // 字号变了顶栏高度也变，步骤条吸顶位置要跟着走
  }
  function setFont(v) {
    state.font = Math.min(FONT_MAX, Math.max(FONT_MIN, Math.round(v * 100) / 100));
    applyFont();
  }
  $('#font-plus').addEventListener('click', function () { setFont(state.font + FONT_STEP); });
  $('#font-minus').addEventListener('click', function () { setFont(state.font - FONT_STEP); });
  $('#font-reset').addEventListener('click', function () { setFont(1); });

  /* ---------------- 语言 ---------------- */
  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) return;
    state.lang = lang;
    store('xiaoyuer.lang', lang);
    stopSpeak();
    $$('[data-lang-btn]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang-btn') === lang ? 'true' : 'false');
    });
    render();
  }

  /* ---------------- 本地记忆 ---------------- */
  var memStore = {}; // localStorage 不可用（隐私模式、file:// 限制）时的内存回退
  function store(key, value) {
    memStore[key] = String(value);
    try { window.localStorage.setItem(key, String(value)); } catch (e) { /* 隐私模式下忽略 */ }
  }
  function read(key) {
    try {
      var v = window.localStorage.getItem(key);
      if (v != null) return v;
    } catch (e) { /* 忽略，走内存回退 */ }
    return memStore[key] != null ? memStore[key] : null;
  }

  /* ---------------- 对外导航动作 ----------------
     智能体（含语音助手）只能走这份白名单：
     要么调「能力清单」里的动作，要么调这里的界面导航，绝不能直接碰页面。 */
  function uiNav(cmd) {
    stopSpeak();
    switch (cmd) {
      case 'next': next(); return true;
      case 'prev': prev(); return true;
      case 'help': helpDialog(); return true;
      case 'read': speak(stepVoice()); return true;
      case 'stop': stopSpeak(); setLive(''); return true;
      case 'confirm': if (state.step !== 4) return false; confirmDialog(); return true; // 仍要人工点
      case 'confirmYes': if (state.step !== 4) return false; closeModal(); submitBooking(); return true;
      case 'closeModal': closeModal(); return true;
      case 'fontUp': setFont(state.font + FONT_STEP); return true;
      case 'fontDown': setFont(state.font - FONT_STEP); return true;
      case 'fontReset': setFont(1); return true;
      case 'restart': resetAll(); state.step = 1; renderStep(); return true;
      case 'home': resetAll(); state.step = 0; renderStep(); return true;
      default: return false;
    }
  }

  /** 当前每一步的「可选项」——智能体只能从这里取值，防止说出一个页面上没有的选项 */
  function options() {
    return {
      symptoms: SYMPTOMS.map(function (s) { return { id: s.id, name: pick(s.name) }; }),
      depts: Object.keys(DEPTS).map(function (d) { return { id: d, name: pick(DEPTS[d].name) }; }),
      doctors: (DOCTORS[state.dept] || []).map(function (d) { return { id: d.id, name: pick(d.name), title: pick(d.title) }; }),
      dates: dateOptions().map(function (d) { return { id: d.id, name: d.label, text: d.text }; }),
      slots: SLOTS.map(function (s) { return { id: s.id, name: t(s.labelKey), text: t(s.timeKey) }; }),
      patients: PATIENTS.map(function (p) { return { id: p.id, name: pick(p.name), rel: t(p.relKey) }; }),
      pays: PAYS.map(function (p) { return { id: p.id, name: t(p.key) }; })
    };
  }

  /* ---------------- 空闲关怀：老人停住不动时，轻轻提示一句 ---------------- */
  var IDLE_MS = 75000;
  var idleTimer = null;
  function hideIdle() {
    var bar = $('#idlebar');
    if (bar) bar.hidden = true;
    document.body.classList.remove('idle-on');
  }
  function resetIdle() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    hideIdle();
    if (state.step >= 1 && state.step <= 4) {
      idleTimer = setTimeout(function () {
        if (state.step < 1 || state.step > 4) return;
        var b = $('#idlebar');
        if (!b) return;
        b.hidden = false;
        document.body.classList.add('idle-on');
      }, IDLE_MS);
    }
  }
  ['click', 'keydown', 'touchstart'].forEach(function (evt) {
    document.addEventListener(evt, resetIdle, { passive: true });
  });

  /* ---------------- 步骤条吸顶跟随：按顶栏实际高度对齐 ---------------- */
  function syncTopbar() {
    var el = $('.topbar');
    if (!el || !el.offsetHeight) return;
    document.documentElement.style.setProperty('--topbar-h', el.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncTopbar);
  window.addEventListener('resize', syncActionbar);
  if (typeof window.ResizeObserver === 'function') {
    try { new window.ResizeObserver(syncActionbar).observe($('#actionbar')); } catch (e) { /* 忽略 */ }
  }
  if (typeof window.ResizeObserver === 'function') {
    try { new window.ResizeObserver(syncTopbar).observe($('.topbar')); } catch (e) { /* 忽略 */ }
  }

  /* ---------------- 对外能力清单（供智能体代驾） ----------------
     模型只负责「选哪个」，执行一律由下面这些确定性函数完成。 */
  var CAPABILITIES = [
    { id: 'select_symptom', risk: 'low', options: SYMPTOMS.map(function (s) { return s.id; }) },
    { id: 'select_department', risk: 'low', options: Object.keys(DEPTS) },
    { id: 'select_doctor', risk: 'low', note: 'options depend on department' },
    { id: 'select_date', risk: 'low', options: ['d0', 'd1', 'd2'] },
    { id: 'select_slot', risk: 'low', options: ['am', 'pm'] },
    { id: 'select_patient', risk: 'medium', options: PATIENTS.map(function (p) { return p.id; }) },
    { id: 'select_payment', risk: 'medium', options: PAYS.map(function (p) { return p.id; }) },
    { id: 'submit_booking', risk: 'high', note: 'requires granted=true' },
    { id: 'reset', risk: 'low' }
  ];

  /** 确定性执行：只接受能力清单内的动作，参数不在取值范围内直接拒绝 */
  function call(actionId, params) {
    params = params || {};
    switch (actionId) {
      case 'select_symptom':
        if (!SYMPTOMS.some(function (s) { return s.id === params.value; })) return reject();
        handleAction('symptom', params.value); return ok();
      case 'select_department':
        if (!DEPTS[params.value]) return reject();
        handleAction('dept', params.value); return ok();
      case 'select_doctor':
        if (!state.dept || !(DOCTORS[state.dept] || []).some(function (d) { return d.id === params.value; })) return reject();
        handleAction('doctor', params.value); return ok();
      case 'select_date':
        if (['d0', 'd1', 'd2'].indexOf(params.value) < 0) return reject();
        handleAction('date', params.value); return ok();
      case 'select_slot':
        if (['am', 'pm'].indexOf(params.value) < 0) return reject();
        if (state.doctor && slotLeft(state.doctor, state.date || 'd0', params.value) === 0) {
          return { ok: false, reason: 'slot_full' };
        }
        handleAction('slot', params.value); return ok();
      case 'select_patient':
        if (!PATIENTS.some(function (p) { return p.id === params.value; })) return reject();
        handleAction('patient', params.value); return ok();
      case 'select_payment':
        if (!PAYS.some(function (p) { return p.id === params.value; })) return reject();
        handleAction('pay', params.value); return ok();
      case 'submit_booking':
        if (!canGoNext()) return { ok: false, reason: 'incomplete' };
        if (params.granted !== true) return { ok: false, reason: 'need_confirm', label: t('nav.nextSubmit') };
        submitBooking(); return ok();
      case 'reset':
        resetAll(); state.step = 0; renderStep(); return ok();
      default:
        return reject();
    }
  }
  /* 成功执行一次能力后，顺手刷新右栏摘要 —— 点选走的是就地更新，不会触发 renderStep */
  function ok() { renderAside(); return { ok: true, state: getState() }; }
  function reject() { return { ok: false, reason: 'not_in_capability_list' }; }

  function getState() {
    return {
      step: state.step,
      lang: state.lang,
      font: state.font,
      symptom: state.symptom,
      dept: state.dept,
      doctor: state.doctor,
      date: state.date,
      slot: state.slot,
      patient: state.patient,
      pay: state.pay,
      ticketNo: state.ticketNo,
      deptName: state.dept ? pick(DEPTS[state.dept].name) : null,
      doctorName: currentDoctor() ? pick(currentDoctor().name) : null,
      timeText: state.date && state.slot ? slotText() : null
    };
  }

  window.XiaoYuEr = {
    version: '1.1.0',
    capabilities: CAPABILITIES,
    getState: getState,
    call: call,
    speak: speak,
    stopSpeak: stopSpeak,
    setLanguage: setLang,
    setFontScale: setFont,
    go: function (step) { state.step = Math.max(0, Math.min(5, step)); renderStep(); },
    /* 给外部智能体（语音助手等）用的扩展点：注册文案 / 订阅重绘 / 导航 / 可选项 */
    registerI18n: registerI18n,
    onRender: onRender,
    t: t,
    nav: uiNav,
    options: options,
    stepReady: stepReady,
    isConfirmOpen: function () { return pendingConfirm && !$('#modal').hidden; },
    /* 调试与自检接口：翻译表、翻译函数、语音文本，供自动化验证使用 */
    debug: { i18n: I18N, t: t, languages: LANGS, keys: Object.keys(I18N.zh), voiceOfStep: stepVoice, speechLang: SPEECH_LANG,
      persist: function () { return { font: read('xiaoyuer.font'), lang: read('xiaoyuer.lang') }; } }
  };

  /* ---------------- 启动 ---------------- */
  var savedLang = read('xiaoyuer.lang');
  if (savedLang && LANGS.indexOf(savedLang) >= 0) state.lang = savedLang;
  var savedFont = parseFloat(read('xiaoyuer.font') || '1');
  if (!isNaN(savedFont)) state.font = savedFont;

  $$('[data-lang-btn]').forEach(function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-lang-btn') === state.lang ? 'true' : 'false');
  });
  applyFont();
  render();

<script>
/* ============================================================
   小鱼兒 · 离线语音识别（浏览器内跑，数据不出本地）

   为什么需要它：
   浏览器自带的 SpeechRecognition 是把音频送到云端识别的，在国内网络下
   基本连不上，老人点了麦克风会说"没反应"。这个模块把识别模型直接放进
   浏览器（Whisper 的 ONNX 量化版），断网也能用，音频不离开设备。

   三条硬约束（与主项目一致）：
   1. 懒加载：只有用户主动点「用离线识别」才会去下载库与模型；
      没下载、没加载成功、浏览器不支持，一律返回失败，由 ai.js 回落到
      浏览器自带识别或「常说的话」点选 —— 页面永远不会卡死。
   2. 零密钥：不需要任何账号与 Key；模型走公开的镜像站，国内可直连。
   3. 纯 ES5 + 无构建：和页面其它脚本一样，双击文件就能跑。

   对外接口（window.XiaoYuErSpeech）：
     state()                       → idle | loading | ready | failed
     ready()                       → 模型已加载好、可以听
     cached()                      → 探测磁盘缓存里有没有模型（不下载）
     prepare(onProgress)           → 下载 + 初始化，返回 Promise
     listen(opts)                  → 录一段话并识别，返回 Promise<文本>
                                      opts.language: 'zh'（默认）| 'en'
                                      opts.onTick(阶段, 信息): listening / recognizing
     stop()                        → 停止录音 / 中断识别
     setModel('fast'|'best')      → 换模型（fast≈41MB / best≈77MB）
   ============================================================ */
(function () {
  'use strict';

  var LIB_DEFAULT = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5/dist/transformers.min.js';
  /* 库的地址同样可以覆盖（?asrLib= / localStorage）：
     内网部署或把整套识别夹带在 U 盘里时，可以指到自己人放的副本上 */
  function libUrl() {
    try {
      var m = /[?&]asrLib=([^&]+)/i.exec(window.location.search);
      if (m) return decodeURIComponent(m[1]);
    } catch (e) { /* 忽略 */ }
    try {
      var s = window.localStorage && window.localStorage.getItem('xye.asr.lib');
      if (s) return String(s);
    } catch (e2) { /* 忽略 */ }
    return LIB_DEFAULT;
  }

  /* 模型下载源，按顺序探测，谁先通就用谁 —— 
     国内直连 huggingface.co 基本不通，所以镜像排第一；
     镜像偶尔也会抽风，所以留官方源兜底。实测不可用时页面会自动降级，
     老人在面板里还能看到现实可点的「常说的话」，不会卡住。 */
  var HOSTS = [
    { host: 'https://hf-mirror.com', label: '国内镜像' },
    { host: 'https://huggingface.co', label: '官方源' }
  ];
  var MODELS = {
    fast: { id: 'onnx-community/whisper-tiny', size: '约 41 MB' },
    best: { id: 'onnx-community/whisper-base', size: '约 77 MB' }
  };

  var state = 'idle';
  var lib = null;          // 动态加载进来的 transformers 库
  var libPromise = null;
  var asr = null;          // 语音识别管线
  var asrPromise = null;
  var currentKey = 'fast';
  var host = null;         // 探测出来的可用模型源
  var hostPromise = null;

  /* 允许用 ?asrHost=... 或 localStorage 指定模型源：方便内网部署与离线夹带 */
  function forcedHost() {
    try {
      var m = /[?&]asrHost=([^&]+)/i.exec(window.location.search);
      if (m) return decodeURIComponent(m[1]).replace(/\/+$/, '');
    } catch (e) { /* 忽略 */ }
    try {
      var s = window.localStorage && window.localStorage.getItem('xye.asr.host');
      if (s) return String(s).replace(/\/+$/, '');
    } catch (e2) { /* 忽略 */ }
    return '';
  }

  function probe(h, ms) {
    var url = h + '/' + modelId() + '/resolve/main/config.json';
    var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 8000);
    return fetch(url, { method: 'GET', cache: 'force-cache', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { clearTimeout(timer); return r && r.ok ? h : null; })
      .catch(function () { clearTimeout(timer); return null; });
  }

  /* 顺序探测：任何一个源能返回 config.json 就认为可用 */
  function pickHost() {
    if (host) return Promise.resolve(host);
    if (hostPromise) return hostPromise;
    var forced = forcedHost();
    var list = forced ? [forced] : HOSTS.map(function (x) { return x.host; });
    hostPromise = list.reduce(function (chain, h) {
      return chain.then(function (found) { return found || probe(h); });
    }, Promise.resolve(null)).then(function (found) {
      if (!found) throw new Error('模型源都连不上：' + list.join(' / '));
      host = found;
      return host;
    }).catch(function (err) { hostPromise = null; throw err; });
    return hostPromise;
  }

  /* 浏览器能不能用：要能录麦克风、能跑 WebAssembly */
  function supported() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
      window.WebAssembly && (window.AudioContext || window.webkitAudioContext));
  }

  function pickKey() {
    try {
      var m = /[?&]asr=([a-z]+)/i.exec(window.location.search);
      if (m && MODELS[m[1]]) return m[1];
    } catch (e) { /* 忽略 */ }
    try {
      var saved = window.localStorage && window.localStorage.getItem('xye.asr.model');
      if (saved && MODELS[saved]) return saved;
    } catch (e2) { /* 忽略 */ }
    return currentKey;
  }

  function setModel(key) {
    if (!MODELS[key] || key === currentKey) return;
    currentKey = key;
    asr = null; asrPromise = null; state = 'idle';
    try { if (window.localStorage) window.localStorage.setItem('xye.asr.model', key); } catch (e) { /* 忽略 */ }
  }

  function modelId() { return MODELS[currentKey].id; }
  function modelSize() { return MODELS[currentKey].size; }

  /* 磁盘缓存探测：命中说明之前下载过，第二次打开不用再下 */
  function cached() {
    if (!window.caches) return Promise.resolve(false);
    var files = ['config.json', 'onnx/encoder_model_quantized.onnx', 'onnx/decoder_model_merged_quantized.onnx'];
    var id = modelId();
    var forced = forcedHost();
    var list = forced ? [forced] : HOSTS.map(function (x) { return x.host; });
    return Promise.all(list.map(function (h) {
      return Promise.all(files.map(function (f) {
        return window.caches.match(h + '/' + id + '/resolve/main/' + f)
          .then(function (r) { return !!r; }).catch(function () { return false; });
      })).then(function (rs) { return rs.every(Boolean); });
    })).then(function (rs) {
      return rs.some(Boolean);
    }).catch(function () { return false; });
  }

  /* ---------------- 动态加载库 ----------------
     注意：@huggingface/transformers 的浏览器构建是 ESM 包（内部用了 import.meta），
     用普通 <script src> 加载会直接报 "Cannot use 'import.meta' outside a module"。
     所以这里用动态 import() 把它当模块取回来 —— 经典脚本里也能用，
     比 <script type="module"> 好在：失败了能被 catch 住，交给上层回落。 */
  function loadLib(h, onProgress) {
    if (lib) return Promise.resolve(lib);
    if (libPromise) return libPromise;
    var lu = libUrl();
    libPromise = Promise.resolve().then(function () {
      return import(lu);
    }).then(function (mod) {
      var L = (mod && mod.pipeline) ? mod : (mod && mod.default);
      if (!L || typeof L.pipeline !== 'function') throw new Error('识别库加载了但没有 pipeline');
      try {
        L.env.allowLocalModels = false;
        L.env.allowRemoteModels = true;
        L.env.remoteHost = h;                               // 探测出来的可用模型源
        L.env.remotePathTemplate = '{model}/resolve/{revision}/';
        L.env.useBrowserCache = true;
        // onnxruntime 的 wasm 默认从库自己的 CDN 取；换了库的地址就得跟着换目录，
        // 否则内网部署时"库在本地、wasm 还往外网要"。
        if (lu !== LIB_DEFAULT) L.env.backends.onnx.wasm.wasmPaths = lu.replace(/[^/]*$/, '');
        // 页面没开 COOP/COEP，多线程 wasm 起不来，直接按单线程走，省一次无谓的等待
        L.env.backends.onnx.wasm.numThreads = 1;
      } catch (e) { /* 环境变量名变了也不致命 */ }
      lib = L;
      window.transformers = L;                              // 便于在控制台里排查
      return L;
    }).catch(function (err) { libPromise = null; throw err; });
    return libPromise;
  }

  /* ---------------- 下载并初始化模型 ---------------- */
  function prepare(onProgress) {
    if (asr) { state = 'ready'; return Promise.resolve(true); }
    if (asrPromise) return asrPromise;
    if (!supported()) { state = 'failed'; return Promise.reject(new Error('这台设备不支持本地识别')); }
    state = 'loading';
    var last = 0;
    asrPromise = pickHost().then(function (h) {
      return loadLib(h, onProgress);
    }).then(function (L) {
      return L.pipeline('automatic-speech-recognition', modelId(), {
        device: 'wasm',   // WebGPU 下 8 位量化不稳定，统一走 WASM：慢一点，但什么机器都能跑
        dtype: 'q8',
        progress_callback: function (p) {
          if (typeof onProgress !== 'function') return;
          if (p && p.status === 'progress' && typeof p.progress === 'number') {
            var pct = Math.max(0, Math.min(100, Math.round(p.progress)));
            if (pct >= last + 5 || pct === 100) { last = pct; onProgress(pct, p.file || ''); }
          } else if (p && p.status === 'ready') {
            onProgress(100, '');
          }
        }
      });
    }).then(function (pipe) {
      asr = pipe;
      state = 'ready';
      return true;
    }).catch(function (err) {
      state = 'failed';
      asrPromise = null;
      throw err;
    });
    return asrPromise;
  }

  /* ---------------- 录音（自带静音自动停止） ---------------- */
  function Recorder(opts) {
    this.opts = opts || {};
    this.chunks = [];
    this.total = 0;
    this.spoken = false;
    this.quietMs = 0;
    this.timer = null;
    this.stopped = false;
  }

  Recorder.prototype.start = function () {
    var self = this;
    var o = self.opts;
    var constraints = {
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    };
    return navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
      self.stream = stream;
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC({ sampleRate: 16000 });     // Whisper 要 16kHz，让浏览器替我们重采样
      self.ctx = ctx;
      var src = ctx.createMediaStreamSource(stream);
      var proc = ctx.createScriptProcessor(4096, 1, 1);
      var mute = ctx.createGain();
      mute.gain.value = 0;                          // 不把麦克风声音放出来（避免啸叫）
      self.proc = proc;
      self.mute = mute;

      var frameMs = 4096 / 16000 * 1000;
      var maxMs = o.maxMs || 12000;
      var quietStopMs = o.quietMs || 1100;          // 说完停顿 1.1 秒就自动收尾
      var noSpeechMs = o.noSpeechMs || 6000;        // 6 秒还没开口就不再等
      var startedAt = Date.now();

      if (typeof o.onTick === 'function') o.onTick('listening');

      proc.onaudioprocess = function (ev) {
        if (self.stopped) return;
        var d = ev.inputBuffer.getChannelData(0);
        var sum = 0;
        for (var i = 0; i < d.length; i++) sum += d[i] * d[i];
        var rms = Math.sqrt(sum / d.length);
        self.chunks.push(new Float32Array(d));
        self.total += d.length;

        if (rms > 0.012) { self.spoken = true; self.quietMs = 0; }
        else if (self.spoken) { self.quietMs += frameMs; }

        var elapsed = Date.now() - startedAt;
        if (typeof o.onTick === 'function') o.onTick('listening', { rms: rms, elapsed: elapsed });

        if ((self.spoken && self.quietMs >= quietStopMs) || elapsed >= maxMs ||
            (!self.spoken && elapsed >= noSpeechMs)) {
          self.finish();
        }
      };

      src.connect(proc);
      proc.connect(mute);
      mute.connect(ctx.destination);
      self.onFinish = o.onFinish;
      return true;
    });
  };

  Recorder.prototype.samples = function () {
    var out = new Float32Array(this.total);
    var at = 0;
    for (var i = 0; i < this.chunks.length; i++) { out.set(this.chunks[i], at); at += this.chunks[i].length; }
    return out;
  };

  Recorder.prototype.release = function () {
    try { if (this.proc) this.proc.onaudioprocess = null; } catch (e) { /* 忽略 */ }
    try { if (this.proc) this.proc.disconnect(); } catch (e2) { /* 忽略 */ }
    try { if (this.mute) this.mute.disconnect(); } catch (e3) { /* 忽略 */ }
    try { if (this.ctx) this.ctx.close(); } catch (e4) { /* 忽略 */ }
    try {
      if (this.stream) this.stream.getTracks().forEach(function (t) { t.stop(); });
    } catch (e5) { /* 忽略 */ }
  };

  Recorder.prototype.finish = function () {
    if (this.stopped) return;
    this.stopped = true;
    var self = this;
    var samples = self.samples();
    var spoke = self.spoken;
    self.release();
    if (typeof self.onFinish === 'function') self.onFinish(spoke, samples);
  };

  Recorder.prototype.abort = function () {
    if (this.stopped) return;
    this.stopped = true;
    this.release();
  };

  var active = null;

  /* ---------------- 对外：听一句 ---------------- */
  function listen(opts) {
    var o = opts || {};
    if (!asr) return Promise.reject(new Error('离线识别还没准备好'));
    return new Promise(function (resolve, reject) {
      var rec = new Recorder({
        maxMs: o.maxMs, quietMs: o.quietMs, noSpeechMs: o.noSpeechMs,
        onTick: o.onTick,
        onFinish: function (spoke, samples) {
          active = null;
          if (!spoke) { resolve(''); return; }
          if (typeof o.onTick === 'function') o.onTick('recognizing');
          var seconds = samples.length / 16000;
          if (seconds < 0.4) { resolve(''); return; }
          try {
            Promise.resolve(asr(samples, {
              language: o.language || 'zh',   // 界面是英文时传 'en'，其余都按中文听
              task: 'transcribe',
              return_timestamps: false
            }))
              .then(function (out) { resolve(clean(out && out.text)); })
              .catch(function (err) { reject(err); });
          } catch (err) { reject(err); }
        }
      });
      active = rec;
      rec.start().catch(function (err) { active = null; reject(err); });
    });
  }

  function stop() {
    if (active) { active.abort(); active = null; return true; }
    return false;
  }

  /* 小模型遇到环境音会"幻听"：静音听成客气话（"谢谢观看""字幕由…提供"），
     或者反复吐同一个字。这些一律清掉，让上层按"没听到"处理，
     绝不能把幻听当成老人说的话去点页面。 */
  var JUNK = [
    /^[\s。，、.!,]*$/,
    /[谢謝](大家)?(观看|觀看|收看|收听|收聽)/,          // 简繁都要挡
    /字幕(由|志願者|志愿者|組|组|by|：|:)/i,
    /請?不吝(點|点)(贊|赞)/,
    /^(點|点)(贊|赞)$/,
    /^(訂閱|訂閲|订阅|轉發|转发|打賞|打赏|關注|关注)$/,
    /^(音乐|音樂)$/i,
    /^(字幕|subtitle|subtitles|music)$/i,
    /^\[.*\]$/,
    /^(.)\1{2,}$/                       // 同一个字重复三次以上，也是幻听
  ];
  var WRAP_L = /^[\s()[\]{}【】（）「」『』<>《》"'`]+/;
  var WRAP_R = /[\s()[\]{}【】（）「」『』<>《》"'`]+$/;
  function clean(text) {
    if (!text) return '';
    var raw = String(text).replace(/\s+/g, ' ').trim();
    /* 模型爱给整句套括号："（音樂）""[BLANK_AUDIO]"。判幻听要连套壳一起判，
       但返还给上层的仍是去掉套壳的正文。 */
    var t = raw.replace(WRAP_L, '').replace(WRAP_R, '').trim();
    if (!t) return '';
    for (var i = 0; i < JUNK.length; i++) {
      if (JUNK[i].test(raw) || JUNK[i].test(t)) return '';
    }
    return t;
  }

  window.XiaoYuErSpeech = {
    version: '1.0.0',
    supported: supported,
    state: function () { return state; },
    ready: function () { return !!asr; },
    cached: cached,
    prepare: prepare,
    listen: listen,
    stop: stop,
    clean: clean,
    setModel: setModel,
    modelSize: modelSize,
    modelName: function () { return currentKey === 'best' ? '标准' : '轻量'; },
    source: function () { return host; },          // 实际用上的模型源
    /* 自检用：不下载也能检查内部状态 */
    _debug: function () {
      return { state: state, key: currentKey, id: modelId(), lib: !!lib, asr: !!asr, host: host };
    }
  };

  currentKey = pickKey();
})();
</script>
<script>

(function () {
